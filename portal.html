<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portalım — Wordora</title>
  <meta name="theme-color" content="#3a32b5">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions">
        <a class="btn btn-ghost btn-sm hidden" id="admin-link" href="admin.html">Admin panel</a>
        <button class="btn btn-ghost btn-sm" id="logout">Çıxış</button>
      </nav>
    </div>
  </header>

  <main class="container" id="app">
    <div class="spinner"></div>
  </main>

  <script type="module">
    import { downloadMaterial } from "./assets/js/materials.js";
    import { startGuard, isTorError, torScreen } from "./assets/js/guard.js";
    import { testState, fmtNum, fmtDuration } from "./assets/js/tests-common.js";
    import { sb, configured, getMyProfile, logout, esc, formatDate, classLabel, toast, translateError, STAR_SVG, showConfigWarning } from "./assets/js/app.js";

    showConfigWarning();
    const app = document.getElementById("app");
    document.getElementById("logout").addEventListener("click", logout);

    function stateScreen(kind, icon, title, text, note) {
      app.innerHTML = `
        <div class="card narrow state ${kind}" style="margin:24px auto">
          <div class="big-ico">${icon}</div>
          <h1 style="font-size:1.5rem">${title}</h1>
          <p class="muted">${text}</p>
          ${note ? `<p class="small" style="color:var(--bad)">Qeyd: ${esc(note)}</p>` : ""}
          <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
            ${kind === "pending" ? '<button class="btn btn-primary" id="refresh">Yenidən yoxla</button>' : ""}
            <button class="btn btn-ghost" id="logout2">Çıxış</button>
          </div>
        </div>`;
      document.getElementById("logout2").addEventListener("click", logout);
      document.getElementById("refresh")?.addEventListener("click", () => location.reload());
    }

    function comingSoon(title, text, iconPath) {
      return `
        <div class="card feature">
          <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg></div>
          <h3>${title} <span class="soon">TEZLİKLƏ</span></h3>
          <p>${text}</p>
        </div>`;
    }

    async function loadAnnouncements() {
      const box = document.getElementById("ann-list");
      const { data, error } = await sb
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(20);
      if (error) { box.innerHTML = `<div class="empty">${esc(translateError(error))}</div>`; return; }
      if (!data.length) { box.innerHTML = '<div class="card empty">Hələlik elan yoxdur.</div>'; return; }
      box.innerHTML = data.map((a) => `
        <article class="card ann">
          <h3>${esc(a.title)}</h3>
          <div class="meta">${formatDate(a.created_at)}${a.target_class ? " · " + esc(classLabel(a.target_class)) : ""}</div>
          <div class="body">${esc(a.body)}</div>
        </article>`).join("");
    }

    async function loadTests() {
      const box = document.getElementById("test-list");
      const [{ data: tests, error }, { data: mine }] = await Promise.all([
        sb.from("tests").select("id, title, duration_min, starts_at, ends_at, questions, results_released").order("created_at", { ascending: false }),
        sb.rpc("get_my_attempts"),
      ]);
      if (error) { box.innerHTML = '<div class="card empty">Hələlik sınaq yoxdur.</div>'; return; }
      const byTest = Object.fromEntries((mine || []).map((a) => [a.test_id, a]));
      const now = Date.now();
      // Bağlanmış və yazılmamış köhnə sınaqları gizlət
      const list = tests.filter((t) => byTest[t.id] || !(t.ends_at && now >= new Date(t.ends_at)));
      if (!list.length) { box.innerHTML = '<div class="card empty">Hələlik açıq sınaq yoxdur.</div>'; return; }
      box.innerHTML = list.map((t) => {
        const a = byTest[t.id];
        const st = testState(t, a);
        const total = (t.questions || []).reduce((s, q) => s + (Number(q.points) || 0), 0);
        let pill = "", action = "";
        if (st === "open") { pill = '<span class="pill live">Açıqdır</span>'; action = `<a class="btn btn-primary btn-sm" href="test.html?id=${t.id}">Başla</a>`; }
        else if (st === "in_progress") {
          pill = '<span class="pill wait">Yarımçıq</span>';
          action = `<a class="btn btn-primary btn-sm" href="test.html?id=${t.id}">${a.status === "expired" ? "Nəticə" : "Davam et"}</a>`;
        }
        else if (st === "upcoming") { pill = '<span class="pill off">Gözləyir</span>'; action = `<span class="muted small">${formatDate(t.starts_at)}</span>`; }
        else if (st === "done") {
          pill = '<span class="pill done">Təhvil verilib</span>';
          action = a.show_score && a.score !== null
            ? `<a class="btn btn-ghost btn-sm" href="test.html?id=${t.id}"><b>${fmtNum(a.score)}</b>&nbsp;/ ${fmtNum(a.total)}</a>`
            : `<a class="btn btn-ghost btn-sm" href="test.html?id=${t.id}">Nəticə gözlənilir</a>`;
        }
        return `
          <article class="card test-card">
            <div style="min-width:0">
              <h3>${esc(t.title)} ${pill}</h3>
              <div class="test-meta"><span>⏱ ${fmtDuration(t.duration_min)}</span><span>${(t.questions || []).length} sual · ${fmtNum(total)} bal</span>${t.ends_at ? `<span>Son: ${formatDate(t.ends_at)}</span>` : ""}</div>
            </div>
            <div>${action}</div>
          </article>`;
      }).join("");
    }

    async function loadMaterials() {
      const box = document.getElementById("mat-list");
      const { data, error } = await sb
        .from("materials")
        .select("id, title, description, category, available_until, allow_download, created_at")
        .order("created_at", { ascending: false });
      if (error) { box.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      if (!data.length) { box.innerHTML = '<div class="card empty">Hələlik material yoxdur.</div>'; return; }
      const groups = {};
      for (const m of data) (groups[m.category] ||= []).push(m);
      box.innerHTML = Object.entries(groups).map(([cat, items]) => `
        <div class="mat-group">
          <div class="mat-cat">${esc(cat)} <span class="muted">· ${items.length}</span></div>
          <div class="mat-grid">
            ${items.map((m) => `
              <div class="mat">
                <span class="mat-ico">PDF</span>
                <span class="mat-body">
                  <span class="mat-title">${esc(m.title)}</span>
                  ${m.description ? `<span class="mat-desc">${esc(m.description)}</span>` : ""}
                  <span class="mat-meta">${formatDate(m.created_at).split(",")[0]}${m.available_until ? " · " + formatDate(m.available_until) + " tarixinə qədər" : ""}</span>
                  <span class="mat-actions">
                    <a class="btn btn-ghost btn-sm" href="material.html?id=${encodeURIComponent(m.id)}">👁 Bax</a>
                    ${m.allow_download ? `<button class="btn btn-primary btn-sm" data-dl="${esc(m.id)}">⬇ Yüklə</button>` : '<span class="muted small">Yalnız baxış</span>'}
                  </span>
                </span>
              </div>`).join("")}
          </div>
        </div>`).join("");
      box.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-dl]");
        if (b) downloadMaterial(b.dataset.dl, b);
      });
    }

    async function start() {
      if (!configured) { app.innerHTML = '<div class="card empty">Sayt hələ bazaya qoşulmayıb.</div>'; return; }
      let me;
      try { me = await getMyProfile(); }
      catch (err) {
        if (isTorError(err)) return torScreen(app);
        app.innerHTML = `<div class="card empty">${esc(translateError(err))}</div>`; return;
      }
      if (!me) { location.href = "login.html"; return; }

      if (me.role === "admin") document.getElementById("admin-link").classList.remove("hidden");

      if (me.status === "pending") {
        return stateScreen("pending", "⏳", "Təsdiq gözlənilir",
          `Salam, ${esc(me.full_name)}! Qeydiyyatın qəbul edildi. Müəllim hesabını təsdiqləyəndən sonra portalın açılacaq.`);
      }
      if (me.status === "rejected") {
        return stateScreen("rejected", "✕", "Qeydiyyat qəbul edilmədi",
          "Müəllim bu qeydiyyatı təsdiqləmədi. Səhv olduğunu düşünürsənsə, müəllimə yaz.", me.status_note);
      }
      if (me.status === "blocked") {
        return stateScreen("blocked", "🔒", "Hesabın bloklanıb",
          "Hesabın müvəqqəti bağlanıb. Açılması üçün müəllimə müraciət et.", me.status_note);
      }

      const firstName = me.full_name.split(" ")[0];
      app.innerHTML = `
        <section class="welcome">
          <span class="star">${STAR_SVG}</span>
          <h1>Salam, ${esc(firstName)}!</h1>
          <p>${esc(classLabel(me.class_name))} · @${esc(me.username)}${me.warnings > 0 ? ` · ⚠️ ${me.warnings} xəbərdarlıq` : ""}</p>
        </section>

        <div class="section-title" id="tests"><h2>Sınaqlar</h2></div>
        <div id="test-list" class="grid"><div class="spinner"></div></div>

        <div class="section-title" id="materials"><h2>Materiallar</h2></div>
        <div id="mat-list"><div class="spinner"></div></div>

        <div class="section-title"><h2>Elanlar</h2></div>
        <div id="ann-list" class="grid"><div class="spinner"></div></div>

      `;
      loadTests();
      loadMaterials();
      loadAnnouncements();
      startGuard({ me, onBlocked: () => location.reload() });
    }

    // Sessiya bitərsə girişə qaytar
    sb?.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.href = "login.html"; });
    start();
  </script>
</body>
</html>
