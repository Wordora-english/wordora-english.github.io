<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portalım — Wordora</title>
  <meta name="theme-color" content="#3a32b5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wd_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions">
        <a class="btn btn-ghost btn-sm hidden" id="admin-link" href="admin.html">Admin panel</a>
        <button class="btn btn-ghost btn-sm" id="logout">Çıxış</button>
      </nav>
    </div>
  </header>

  <main class="container" id="app">
    <div class="spinner"></div>
  </main>

  <script type="module">
    import { downloadMaterial } from "./assets/js/materials.js";
    import { startGuard, isTorError, torScreen } from "./assets/js/guard.js";
    import { testState, fmtNum, fmtDuration } from "./assets/js/tests-common.js";
    import { sb, configured, getMyProfile, logout, esc, formatDate, classLabel, toast, translateError, STAR_SVG, showConfigWarning, canInstall, promptInstall, isStandalone, isIOS } from "./assets/js/app.js";
    import { percentChart } from "./assets/js/charts.js";
    import { speak, canSpeak, wordOfDay } from "./assets/js/words.js";
    import { CERT_MIN_PERCENT } from "./assets/js/config.js";

    showConfigWarning();
    const app = document.getElementById("app");
    let me = null;
    document.getElementById("logout").addEventListener("click", logout);

    function stateScreen(kind, icon, title, text, note) {
      app.innerHTML = `
        <div class="card narrow state ${kind}" style="margin:24px auto">
          <div class="big-ico">${icon}</div>
          <h1 style="font-size:1.5rem">${title}</h1>
          <p class="muted">${text}</p>
          ${note ? `<p class="small" style="color:var(--bad)">Qeyd: ${esc(note)}</p>` : ""}
          <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
            ${kind === "pending" ? '<button class="btn btn-primary" id="refresh">Yenidən yoxla</button>' : ""}
            <button class="btn btn-ghost" id="logout2">Çıxış</button>
          </div>
        </div>`;
      document.getElementById("logout2").addEventListener("click", logout);
      document.getElementById("refresh")?.addEventListener("click", () => location.reload());
    }

    function comingSoon(title, text, iconPath) {
      return `
        <div class="card feature">
          <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg></div>
          <h3>${title} <span class="soon">TEZLİKLƏ</span></h3>
          <p>${text}</p>
        </div>`;
    }

    async function loadAnnouncements() {
      const box = document.getElementById("ann-list");
      const { data, error } = await sb
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(20);
      if (error) { box.innerHTML = `<div class="empty">${esc(translateError(error))}</div>`; return; }
      if (!data.length) { box.innerHTML = '<div class="card empty">Hələlik elan yoxdur.</div>'; return; }
      box.innerHTML = data.map((a) => `
        <article class="card ann">
          <h3>${esc(a.title)}</h3>
          <div class="meta">${formatDate(a.created_at)}${a.target_class ? " · " + esc(classLabel(a.target_class)) : ""}</div>
          <div class="body">${esc(a.body)}</div>
        </article>`).join("");
    }

    async function loadTests() {
      const box = document.getElementById("test-list");
      const [{ data: tests, error }, { data: mine }] = await Promise.all([
        sb.from("tests").select("id, title, duration_min, starts_at, ends_at, questions, results_released").order("created_at", { ascending: false }),
        sb.rpc("get_my_attempts"),
      ]);
      if (error) { box.innerHTML = '<div class="card empty">Hələlik sınaq yoxdur.</div>'; return; }
      const byTest = Object.fromEntries((mine || []).map((a) => [a.test_id, a]));
      const now = Date.now();
      // Bağlanmış və yazılmamış köhnə sınaqları gizlət
      const list = tests.filter((t) => byTest[t.id] || !(t.ends_at && now >= new Date(t.ends_at)));
      if (!list.length) { box.innerHTML = '<div class="card empty">Hələlik açıq sınaq yoxdur.</div>'; return; }
      box.innerHTML = list.map((t) => {
        const a = byTest[t.id];
        const st = testState(t, a);
        const total = (t.questions || []).reduce((s, q) => s + (Number(q.points) || 0), 0);
        let pill = "", action = "";
        if (st === "open") { pill = '<span class="pill live">Açıqdır</span>'; action = `<a class="btn btn-primary btn-sm" href="test.html?id=${t.id}">Başla</a>`; }
        else if (st === "in_progress") {
          pill = '<span class="pill wait">Yarımçıq</span>';
          action = `<a class="btn btn-primary btn-sm" href="test.html?id=${t.id}">${a.status === "expired" ? "Nəticə" : "Davam et"}</a>`;
        }
        else if (st === "upcoming") { pill = '<span class="pill off">Gözləyir</span>'; action = `<span class="muted small">${formatDate(t.starts_at)}</span>`; }
        else if (st === "done") {
          pill = '<span class="pill done">Təhvil verilib</span>';
          action = a.show_score && a.score !== null
            ? `<a class="btn btn-ghost btn-sm" href="test.html?id=${t.id}"><b>${fmtNum(a.score)}</b>&nbsp;/ ${fmtNum(a.total)}</a>`
            : `<a class="btn btn-ghost btn-sm" href="test.html?id=${t.id}">Nəticə gözlənilir</a>`;
        }
        return `
          <article class="card test-card">
            <div style="min-width:0">
              <h3>${esc(t.title)} ${pill}</h3>
              <div class="test-meta"><span>⏱ ${fmtDuration(t.duration_min)}</span><span>${(t.questions || []).length} sual · ${fmtNum(total)} bal</span>${t.ends_at ? `<span>Son: ${formatDate(t.ends_at)}</span>` : ""}</div>
            </div>
            <div>${action}</div>
          </article>`;
      }).join("");
      renderResults(tests, mine || []);
    }

    // ---------- Qısa keçidlər: mesajlar, davamiyyət, valideyn kodu ----------
    async function loadQuick() {
      const [{ data: msgs }, { data: att }] = await Promise.all([
        sb.from("messages").select("sender, read_by_student").eq("user_id", me.id),
        sb.from("attendance").select("status").eq("user_id", me.id).gte("att_date", new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10)),
      ]);
      const unread = (msgs || []).filter((m) => m.sender === "teacher" && !m.read_by_student).length;
      const b = document.getElementById("msg-badge");
      b.textContent = unread; b.classList.toggle("zero", !unread);
      if (unread) document.getElementById("msg-note").textContent = "Müəllim cavab yazıb!";
      const a = att || [];
      document.getElementById("att-note").textContent = a.length
        ? `${Math.round(a.filter((x) => x.status === "present" || x.status === "late").length / a.length * 100)}% · ${a.filter((x) => x.status === "absent").length} qayıb (90 gün)`
        : "Hələ yazılmayıb";
      document.getElementById("parent-btn").onclick = async () => {
        const { data: code, error } = await sb.rpc("get_parent_code");
        if (error) return toast(translateError(error), "err");
        const link = new URL(`parent.html?code=${encodeURIComponent(code)}`, location.href).href;
        const box = document.createElement("div");
        box.className = "wd-modal";
        box.innerHTML = `<div class="wd-modal-box" style="border-top-color:var(--indigo)">
          <div class="wd-modal-ico">👨‍👩‍👧</div><h2>Valideyn kodu</h2>
          <div style="font:800 1.8rem/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;margin:.4rem 0 .8rem;-webkit-user-select:all;user-select:all">${esc(code)}</div>
          <p>Bu kodu yalnız valideyninə ver. O, <b>Valideyn girişi</b> səhifəsində nəticələrini və davamiyyətini görəcək (heç nəyi dəyişə bilməz).</p>
          <div style="display:grid;gap:.5rem">
            <button class="btn btn-primary btn-block" id="pc-share">📤 Linki göndər</button>
            <button class="btn btn-ghost btn-block" id="pc-close">Bağla</button></div></div>`;
        document.body.appendChild(box);
        document.getElementById("pc-close").onclick = () => box.remove();
        document.getElementById("pc-share").onclick = async () => {
          const text = `Wordora — ${me.full_name} üçün valideyn səhifəsi: ${link}`;
          try { if (navigator.share) await navigator.share({ title: "Wordora", text, url: link }); else { await navigator.clipboard.writeText(link); toast("Link kopyalandı ✓", "ok"); } } catch {}
        };
      };
    }

    // ---------- Günün sözü ----------
    async function loadWotd() {
      const box = document.getElementById("wotd");
      const { data, error } = await sb.from("words").select("id, deck, word, meaning, example");
      if (error || !data?.length) { box.innerHTML = ""; return; }
      const w = wordOfDay(data);
      box.innerHTML = `
        <div class="card wotd">
          <div class="wotd-l">
            <div class="muted small">✨ Günün sözü</div>
            <div class="wotd-w">${esc(w.word)} ${canSpeak() ? '<button class="btn btn-ghost btn-sm" id="wotd-say" aria-label="Səsləndir">🔊</button>' : ""}</div>
            <div class="wotd-m">${esc(w.meaning)}</div>
            ${w.example ? `<div class="wotd-ex">“${esc(w.example)}”</div>` : ""}
          </div>
          <a class="btn btn-primary btn-sm" href="words.html">🔤 Söz kartları →</a>
        </div>`;
      document.getElementById("wotd-say")?.addEventListener("click", () => speak(w.word));
    }

    // ---------- Reytinq ----------
    let rankKind = "tests", rankScope = "class", rankDays = 30;
    async function loadRank() {
      const box = document.getElementById("rank-box");
      const { data, error } = await sb.rpc("get_leaderboard", { p_kind: rankKind, p_scope: rankScope, p_days: rankDays });
      if (error) { document.getElementById("rank").remove(); box.remove(); return; }
      if (!data.enabled) { document.getElementById("rank").remove(); box.remove(); return; }
      const rows = data.rows || [];
      const sel = (v, cur, label) => `<button class="tab ${v === cur ? "active" : ""}" data-v="${v}">${label}</button>`;
      box.innerHTML = `
        <div class="card">
          <div class="tabs" id="rk-kind">${sel("tests", rankKind, "📝 Sınaqlar")}${sel("live", rankKind, "🎮 Viktorina")}</div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:10px">
            <select id="rk-scope" style="flex:1 1 140px"><option value="class" ${rankScope === "class" ? "selected" : ""}>Mənim sinfim</option><option value="all" ${rankScope === "all" ? "selected" : ""}>Bütün siniflər</option></select>
            <select id="rk-days" style="flex:1 1 140px"><option value="30" ${rankDays === 30 ? "selected" : ""}>Son 30 gün</option><option value="0" ${rankDays === 0 ? "selected" : ""}>Bütün vaxt</option></select>
          </div>
          ${rows.length ? `<table class="res-table">${rows.map((r) => `
            <tr style="${r.id === data.me ? "background:var(--soft);font-weight:700" : ""}">
              <td style="width:2.5em">${r.rank === 1 ? "🥇" : r.rank === 2 ? "🥈" : r.rank === 3 ? "🥉" : r.rank + "."}</td>
              <td>${esc(r.name)}${r.id === data.me ? " (sən)" : ""} <span class="muted small">${rankScope === "all" ? esc(classLabel(r.class)) : ""}</span></td>
              <td class="r">${rankKind === "tests" ? `${Math.round(r.value)}%` : `${r.value} bal`} <span class="muted small">· ${r.n}</span></td></tr>`).join("")}</table>`
            : '<div class="empty small">Hələ reytinq üçün nəticə yoxdur.</div>'}
        </div>`;
      box.querySelectorAll("#rk-kind [data-v]").forEach((b) => b.onclick = () => { rankKind = b.dataset.v; loadRank(); });
      document.getElementById("rk-scope").onchange = (e) => { rankScope = e.target.value; loadRank(); };
      document.getElementById("rk-days").onchange = (e) => { rankDays = Number(e.target.value); loadRank(); };
    }

    // ---------- Nəticələrim ----------
    function renderResults(tests, mine) {
      const box = document.getElementById("my-results");
      const titles = Object.fromEntries(tests.map((t) => [t.id, t.title]));
      const rows = mine.filter((a) => a.show_score && a.score !== null && a.total > 0)
        .sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));
      const waiting = mine.filter((a) => a.status !== "in_progress" && !(a.show_score && a.score !== null)).length;
      if (!rows.length) {
        box.innerHTML = `<div class="card empty">${waiting ? `${waiting} sınağın nəticəsi müəllim açanda burada görünəcək.` : "Sınaq yazandan sonra nəticələrin və inkişaf qrafikin burada görünəcək."}</div>`;
        return;
      }
      const pct = (a) => (Number(a.score) / Number(a.total)) * 100;
      const avg = rows.reduce((s, a) => s + pct(a), 0) / rows.length;
      const best = Math.max(...rows.map(pct));
      const last = pct(rows[rows.length - 1]);
      const prev = rows.length > 1 ? pct(rows[rows.length - 2]) : null;
      const trend = prev === null ? "" : last > prev ? `<span style="color:var(--ok)">▲ ${Math.round(last - prev)}%</span>` : last < prev ? `<span style="color:var(--bad)">▼ ${Math.round(prev - last)}%</span>` : "＝";
      const cls = (p) => (p >= 75 ? "hi" : p >= 50 ? "mid" : "lo");
      box.innerHTML = `
        <div class="stats">
          <div class="stat"><div class="n">${Math.round(avg)}%</div><div class="l">Orta nəticə</div></div>
          <div class="stat"><div class="n">${Math.round(best)}%</div><div class="l">Ən yaxşı</div></div>
          <div class="stat"><div class="n">${Math.round(last)}%</div><div class="l">Son sınaq ${trend}</div></div>
        </div>
        <div class="card">
          ${percentChart(rows.map((a) => ({ label: formatDate(a.submitted_at).slice(0, 5), value: pct(a), title: titles[a.test_id] || "" })))}
          <table class="res-table" style="margin-top:12px">
            <tr><th>Sınaq</th><th>Tarix</th><th class="r">Bal</th><th class="r">%</th></tr>
            ${rows.slice().reverse().map((a) => `<tr><td><a href="test.html?id=${a.test_id}">${esc(titles[a.test_id] || "Sınaq")}</a></td>
              <td class="muted">${formatDate(a.submitted_at).split(",")[0]}</td><td class="r">${fmtNum(a.score)} / ${fmtNum(a.total)}</td>
              <td class="r"><span class="pct ${cls(pct(a))}">${Math.round(pct(a))}%</span>${pct(a) >= CERT_MIN_PERCENT ? ` <button class="btn btn-ghost btn-sm" data-cert="${a.test_id}" title="Sertifikat">🏅</button>` : ""}</td></tr>`).join("")}
          </table>
          ${waiting ? `<p class="muted small" style="margin:.6rem 0 0">Daha ${waiting} sınağın nəticəsi hələ açılmayıb.</p>` : ""}
        </div>`;
      box.querySelectorAll("[data-cert]").forEach((btn) => btn.onclick = async () => {
        const a = rows.find((x) => x.test_id === btn.dataset.cert);
        btn.disabled = true;
        try {
          const { downloadCertificate } = await import("./assets/js/certificate.js");
          await downloadCertificate({ name: me.full_name, className: classLabel(me.class_name), title: titles[a.test_id] || "Sınaq",
            percent: pct(a), date: formatDate(a.submitted_at).split(",")[0], code: me.student_code, serial: a.test_id.slice(0, 8).toUpperCase() });
          toast("Sertifikat yükləndi 🏅", "ok");
        } catch (err) { toast(translateError(err), "err"); }
        btn.disabled = false;
      });
    }

    // ---------- Tətbiq kimi yükləmə ----------
    function renderInstall() {
      const box = document.getElementById("install-box");
      let dismissed = false; try { dismissed = localStorage.getItem("wd_install_hide") === "1"; } catch {}
      if (isStandalone() || dismissed) { box.innerHTML = ""; return; }
      const close = '<button class="btn btn-ghost btn-sm" id="inst-x" aria-label="Bağla">✕</button>';
      if (canInstall()) {
        box.innerHTML = `<div class="card install-card"><div><b>📱 Wordora-nı tətbiq kimi yüklə</b><div class="muted small">Telefonunun ana ekranında loqolu ikon olacaq.</div></div>
          <div style="display:flex;gap:.4rem"><button class="btn btn-primary btn-sm" id="inst-go">Yüklə</button>${close}</div></div>`;
        document.getElementById("inst-go").onclick = async () => { await promptInstall(); renderInstall(); };
      } else if (isIOS()) {
        box.innerHTML = `<div class="card install-card"><div><b>📱 Ana ekrana əlavə et</b><div class="muted small">Safari-də aşağıdakı <b>Paylaş ⬆️</b> düyməsini bas → <b>"Ana ekrana əlavə et"</b>.</div></div>${close}</div>`;
      } else { box.innerHTML = ""; return; }
      document.getElementById("inst-x").onclick = () => { try { localStorage.setItem("wd_install_hide", "1"); } catch {} renderInstall(); };
    }

    async function loadMaterials() {
      const box = document.getElementById("mat-list");
      const { data, error } = await sb
        .from("materials")
        .select("id, title, description, category, available_until, allow_download, created_at")
        .order("created_at", { ascending: false });
      if (error) { box.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      if (!data.length) { box.innerHTML = '<div class="card empty">Hələlik material yoxdur.</div>'; return; }
      const groups = {};
      for (const m of data) (groups[m.category] ||= []).push(m);
      box.innerHTML = Object.entries(groups).map(([cat, items]) => `
        <div class="mat-group">
          <div class="mat-cat">${esc(cat)} <span class="muted">· ${items.length}</span></div>
          <div class="mat-grid">
            ${items.map((m) => `
              <div class="mat">
                <span class="mat-ico">PDF</span>
                <span class="mat-body">
                  <span class="mat-title">${esc(m.title)}</span>
                  ${m.description ? `<span class="mat-desc">${esc(m.description)}</span>` : ""}
                  <span class="mat-meta">${formatDate(m.created_at).split(",")[0]}${m.available_until ? " · " + formatDate(m.available_until) + " tarixinə qədər" : ""}</span>
                  <span class="mat-actions">
                    <a class="btn btn-ghost btn-sm" href="material.html?id=${encodeURIComponent(m.id)}">👁 Bax</a>
                    ${m.allow_download ? `<button class="btn btn-primary btn-sm" data-dl="${esc(m.id)}">⬇ Yüklə</button>` : '<span class="muted small">Yalnız baxış</span>'}
                  </span>
                </span>
              </div>`).join("")}
          </div>
        </div>`).join("");
      box.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-dl]");
        if (b) downloadMaterial(b.dataset.dl, b);
      });
    }

    async function start() {
      if (!configured) { app.innerHTML = '<div class="card empty">Sayt hələ bazaya qoşulmayıb.</div>'; return; }
      try { me = await getMyProfile(); }
      catch (err) {
        if (isTorError(err)) return torScreen(app);
        app.innerHTML = `<div class="card empty">${esc(translateError(err))}</div>`; return;
      }
      if (!me) { location.href = "login.html"; return; }

      if (me.role === "admin") document.getElementById("admin-link").classList.remove("hidden");

      if (me.status === "pending") {
        return stateScreen("pending", "⏳", "Təsdiq gözlənilir",
          `Salam, ${esc(me.full_name)}! Qeydiyyatın qəbul edildi. Müəllim hesabını təsdiqləyəndən sonra portalın açılacaq.`);
      }
      if (me.status === "rejected") {
        return stateScreen("rejected", "✕", "Qeydiyyat qəbul edilmədi",
          "Müəllim bu qeydiyyatı təsdiqləmədi. Səhv olduğunu düşünürsənsə, müəllimə yaz.", me.status_note);
      }
      if (me.status === "archived") {
        return stateScreen("pending", "🎓", "Təbriklər, məzun oldun!",
          "Hesabın arxivə köçürülüb. Wordora-da oxuduğun üçün təşəkkür edirik. Uğurlar! Hesabı yenidən açmaq lazımdırsa, müəllimə yaz.");
      }
      if (me.status === "blocked") {
        return stateScreen("blocked", "🔒", "Hesabın bloklanıb",
          "Hesabın müvəqqəti bağlanıb. Açılması üçün müəllimə müraciət et.", me.status_note);
      }

      const firstName = me.full_name.split(" ")[0];
      app.innerHTML = `
        <section class="welcome">
          <span class="star">${STAR_SVG}</span>
          <h1>Salam, ${esc(firstName)}!</h1>
          <p>${esc(classLabel(me.class_name))} · @${esc(me.username)}${me.warnings > 0 ? ` · ⚠️ ${me.warnings} xəbərdarlıq` : ""}</p>
        </section>

        <div id="install-box" style="margin-bottom:12px"></div>
        <div id="wotd" style="margin-bottom:12px"></div>

        <form class="card live-join" id="live-join">
          <div><b>🎮 Canlı viktorina</b><div class="muted small">Proyektordakı 6 rəqəmli kodu yaz</div></div>
          <div class="live-join-row">
            <input id="live-code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" aria-label="Viktorina kodu">
            <button class="btn btn-primary" type="submit">Qoşul</button>
          </div>
        </form>

        <div class="quick">
          <a class="card quick-item" href="messages.html"><span class="qi">💬</span><span><b>Müəllimə sual</b><span class="muted small" id="msg-note">Sualını yaz</span></span><span class="badge zero" id="msg-badge">0</span></a>
          <a class="card quick-item" href="words.html"><span class="qi">🔤</span><span><b>Söz kartları</b><span class="muted small">Öyrən və yoxla</span></span></a>
          <button class="card quick-item" id="parent-btn" type="button"><span class="qi">👨‍👩‍👧</span><span><b>Valideyn kodu</b><span class="muted small">Valideynin nəticəni görsün</span></span></button>
          <div class="card quick-item" id="att-card"><span class="qi">✅</span><span><b>Davamiyyət</b><span class="muted small" id="att-note">—</span></span></div>
        </div>

        <div class="section-title" id="tests"><h2>Sınaqlar</h2></div>
        <div id="test-list" class="grid"><div class="spinner"></div></div>

        <div class="section-title" id="results"><h2>Nəticələrim</h2></div>
        <div id="my-results"><div class="spinner"></div></div>

        <div class="section-title" id="rank"><h2>🏆 Reytinq</h2></div>
        <div id="rank-box"><div class="spinner"></div></div>

        <div class="section-title" id="materials"><h2>Materiallar</h2></div>
        <div id="mat-list"><div class="spinner"></div></div>

        <div class="section-title"><h2>Elanlar</h2></div>
        <div id="ann-list" class="grid"><div class="spinner"></div></div>

      `;
      const codeInp = document.getElementById("live-code");
      codeInp.addEventListener("input", () => { codeInp.value = codeInp.value.replace(/\D/g, "").slice(0, 6); });
      document.getElementById("live-join").addEventListener("submit", (e) => {
        e.preventDefault();
        if (codeInp.value.length !== 6) return toast("Kod 6 rəqəmdir", "err");
        location.href = `live.html?code=${codeInp.value}`;
      });
      renderInstall();
      loadWotd();
      loadQuick();
      loadRank();
      addEventListener("wd-installable", renderInstall);
      loadTests();
      loadMaterials();
      loadAnnouncements();
      startGuard({ me, onBlocked: () => location.reload() });
    }

    // Sessiya bitərsə girişə qaytar
    sb?.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.href = "login.html"; });
    start();
  </script>
</body>
