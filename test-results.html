<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nəticələr — Wordora</title>
  <meta name="theme-color" content="#0e1f3d">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wd_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <style>
    .res-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .res-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
    .stats.five { grid-template-columns: repeat(5, 1fr); }
    @media (max-width: 700px) { .stats.five { grid-template-columns: repeat(2, 1fr); } }
    .rrow { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .rrow-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .rank { width: 30px; height: 30px; border-radius: 50%; background: var(--soft); color: var(--indigo); font-weight: 800; display: grid; place-items: center; font-size: .85rem; flex: 0 0 auto; }
    .rrow .who { flex: 1; min-width: 180px; }
    .rrow .sc { font: 700 1.35rem/1 var(--display); color: var(--indigo); white-space: nowrap; }
    .rrow .sc span { font-size: .85rem; color: var(--muted); font-weight: 500; }
    .rrow details { margin-top: 10px; }
    .rrow summary { cursor: pointer; font-size: .86rem; color: var(--indigo); font-weight: 600; }
    .ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 5px; margin-top: 10px; }
    .ans { font-size: .8rem; padding: 5px 7px; border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .ans.ok { background: var(--ok-bg); } .ans.part { background: var(--warn-bg); } .ans.bad { background: var(--bad-bg); }
    .essay-box { margin-top: 10px; background: var(--soft); border-radius: 10px; padding: 10px 12px; }
    .essay-box .txt { white-space: pre-wrap; font-size: .92rem; max-height: 320px; overflow: auto; margin: .4rem 0 .6rem; -webkit-user-select: text; user-select: text; }
    .essay-grade { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .essay-grade input { width: 110px; }
    .qa { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .qa-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .84rem; }
    .qa-bar { height: 7px; border-radius: 99px; background: var(--line); margin-top: 5px; overflow: hidden; }
    .qa-bar div { height: 100%; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions"><a class="btn btn-ghost btn-sm" href="admin.html#tests">← Sınaqlar</a></nav>
    </div>
  </header>

  <main class="container" id="app"><div class="spinner"></div></main>

  <script type="module">
    import { sb, configured, getMyProfile, esc, formatDate, toast, translateError, classLabel } from "./assets/js/app.js";
    import { fmtNum, wordCount, sectionScores } from "./assets/js/tests-common.js";
    import { downloadXlsx, safeName } from "./assets/js/xlsx-lite.js";
    import { CERT_MIN_PERCENT, RUBRIC } from "./assets/js/config.js";

    const app = document.getElementById("app");
    const testId = new URLSearchParams(location.search).get("id");
    let test, key, attempts = [], notStarted = [], violCount = {}, qcs = [], retakes = {}, archive = {};
    let vkeys = {}, assigns = {}, anVar = "A";
    const hasVar = () => (test.variants || []).length > 0;
    const varCodes = () => ["A", ...(test.variants || []).map((v) => v.code)];
    const keyOf = (a) => (a?.variant && a.variant !== "A" && vkeys[a.variant]) || key;
    const varPill = (a) => (hasVar() ? ` <span class="var-pill" title="Variant">${esc(a.variant || "A")}</span>` : "");
    let openIds = new Set(), rendered = false;

    const total = () => (test.questions || []).reduce((s, q) => s + (Number(q.points) || 0), 0);
    const essayQs = () => (test.questions || []).filter((q) => q.type === "essay");
    const essayMax = () => essayQs().reduce((s, q) => s + (Number(q.points) || 0), 0);
    const perCrit = () => Math.round((essayMax() / RUBRIC.length) * 100) / 100;
    const secs = () => test.content?.sections || [];
    const secOf = (a) => sectionScores(secs(), test.questions || [], a.details, a.essay_score);
    const pctCls = (p) => (p >= 70 ? "hi" : p >= 40 ? "mid" : "lo");

    async function load() {
      await sb.rpc("admin_finalize_expired", { p_test: testId });
      const [{ data: t, error }, { data: k }, { data: att }, { data: studs }, { data: qc }, { data: rt }, { data: ar }, { data: va }] = await Promise.all([
        sb.from("tests").select("*").eq("id", testId).maybeSingle(),
        sb.from("test_keys").select("*").eq("test_id", testId).maybeSingle(),
        sb.from("attempts").select("*, profiles(full_name, class_name, student_code, username)").eq("test_id", testId),
        sb.from("profiles").select("id, full_name, class_name, student_code").eq("role", "student").eq("status", "approved"),
        sb.from("quick_comments").select("id, body").order("id"),
        sb.from("test_retakes").select("user_id, expires_at").eq("test_id", testId),
        sb.from("attempts_archive").select("*").eq("test_id", testId).order("archived_at"),
        sb.from("test_variant_assign").select("user_id, variant").eq("test_id", testId),
      ]);
      qcs = qc || [];
      retakes = Object.fromEntries((rt || []).filter((r) => new Date(r.expires_at) > Date.now()).map((r) => [r.user_id, r.expires_at]));
      archive = {};
      for (const x of ar || []) (archive[x.user_id] ||= []).push(x);
      if (error || !t) { app.innerHTML = '<div class="card empty">Sınaq tapılmadı.</div>'; return false; }
      test = t; key = k?.answers || {}; vkeys = k?.variants || {}; attempts = att || [];
      assigns = Object.fromEntries((va || []).map((x) => [x.user_id, x.variant]));
      if (!varCodes().includes(anVar)) anVar = "A";
      const took = new Set(attempts.map((a) => a.user_id));
      const cls = t.target_classes || [];
      notStarted = (studs || []).filter((s) => !took.has(s.id) && (!cls.length || cls.includes(s.class_name)));

      // Sınaq zamanı pozuntular
      violCount = {};
      if (attempts.length) {
        const { data: v } = await sb.from("violations").select("user_id, created_at, cancelled")
          .in("user_id", attempts.map((a) => a.user_id)).eq("cancelled", false);
        for (const a of attempts) {
          const from = new Date(a.started_at).getTime(), to = new Date(a.submitted_at || a.deadline).getTime() + 60000;
          violCount[a.id] = (v || []).filter((x) => x.user_id === a.user_id && new Date(x.created_at) >= from && new Date(x.created_at) <= to).length;
        }
      }
      return true;
    }

    function render() {
      if (rendered) openIds = new Set([...app.querySelectorAll("details[data-a][open]")].map((d) => d.dataset.a));
      const done = attempts.filter((a) => a.status !== "in_progress").sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
      const live = attempts.filter((a) => a.status === "in_progress");
      const scores = done.map((a) => Number(a.score) || 0);
      const avg = scores.length ? scores.reduce((s, x) => s + x, 0) / scores.length : null;
      const pendingEssay = done.filter((a) => a.status === "submitted").length;
      const T = total();

      const closed = !!(test.ends_at && Date.now() >= new Date(test.ends_at).getTime());
      app.innerHTML = `
        <div class="card" style="margin-bottom:16px">
          <div class="res-head">
            <div><h1 style="font-size:1.45rem;margin-bottom:.2rem">${esc(test.title)}</h1>
              <div class="muted small">${test.target_classes?.length ? test.target_classes.map(classLabel).join(", ") : "Bütün siniflər"} · ${test.duration_min} dəq · ${(test.questions || []).length} sual · ${fmtNum(T)} bal
              ${test.ends_at ? ` · son: ${formatDate(test.ends_at)}` : ""}</div></div>
            <div class="res-actions">
              <button class="btn ${test.results_released ? "btn-warn" : "btn-ok"} btn-sm" id="release">${test.results_released ? "Nəticələri bağla" : "Nəticələri şagirdlərə aç"}</button>
              <button class="btn btn-ghost btn-sm" id="csv">⬇ Excel</button>
              <button class="btn btn-ghost btn-sm" id="regrade" title="Cavab açarını dəyişmisənsə">Yenidən hesabla</button>
              <a class="btn btn-ghost btn-sm" href="test-edit.html?id=${test.id}">Redaktə</a>
              <button class="btn btn-ghost btn-sm" id="refresh">↻</button>
            </div>
          </div>
          <p class="small muted" style="margin:.6rem 0 0">${test.results_released
            ? "✅ Nəticələr açıqdır — şagirdlər balını, öz cavablarını və düzgün cavabları görür."
            : test.results_mode === "instant" ? "Şagirdlər təhvil verən kimi balını görür; düzgün cavablar nəticələri açanda görünəcək."
            : "🔒 Nəticələr bağlıdır — şagirdlər hələ heç nə görmür."}</p>
        </div>

        <div class="stats five">
          <div class="stat"><div class="n">${done.length}</div><div class="l">Təhvil verib</div></div>
          <div class="stat"><div class="n">${live.length}</div><div class="l">İndi yazır</div></div>
          <div class="stat"><div class="n">${avg === null ? "—" : fmtNum(Math.round(avg * 10) / 10)}</div><div class="l">Orta bal</div></div>
          <div class="stat"><div class="n">${scores.length ? fmtNum(Math.max(...scores)) : "—"}</div><div class="l">Ən yüksək</div></div>
          <div class="stat"><div class="n" style="${pendingEssay ? "color:var(--warn)" : ""}">${pendingEssay}</div><div class="l">Esse yoxlanılmalı</div></div>
        </div>

        <div class="section-title"><h2>Nəticələr</h2></div>
        <div class="grid" id="results">${done.length ? done.map((a, i) => row(a, i + 1)).join("") : '<div class="card empty">Hələ heç kim təhvil verməyib.</div>'}</div>

        ${live.length ? `<div class="section-title"><h2>İndi yazanlar</h2></div>
          <div class="grid">${live.map((a) => `<div class="rrow"><div class="rrow-top"><span class="rank">⏳</span><div class="who"><b>${esc(a.profiles?.full_name)}</b>${varPill(a)} <span class="muted small">${esc(classLabel(a.profiles?.class_name))}</span><div class="muted small">Başladı: ${formatDate(a.started_at)} · vaxt bitir: ${formatDate(a.deadline)}${violCount[a.id] ? ` · ⚠️ ${violCount[a.id]} pozuntu` : ""}</div></div></div></div>`).join("")}</div>` : ""}

        ${secs().length && done.length ? `<div class="section-title"><h2>Bölmələr üzrə</h2><span class="muted small">sinif ortalaması</span></div>
          <div class="card" style="margin-bottom:8px">${classSections(done)}</div>` : ""}

        <div class="section-title"><h2>Sual analizi</h2><span class="muted small">neçə faiz düzgün cavablayıb</span></div>
        ${hasVar() ? `<div class="tabs" id="an-var" style="margin-bottom:10px">${varCodes().map((c) => `<button class="tab ${c === anVar ? "active" : ""}" data-anvar="${c}">${c} variantı (${done.filter((a) => (a.variant || "A") === c).length})</button>`).join("")}</div>` : ""}
        <div class="qa">${analysis(hasVar() ? done.filter((a) => (a.variant || "A") === anVar) : done)}</div>

        <div class="section-title"><h2>Yazmayanlar <span class="muted small">(${notStarted.length})</span></h2></div>
        <div class="card small">${notStarted.length ? `<div class="ns-list">${notStarted.map((s) => `<div class="ns">
            <span>${esc(s.full_name)} <span class="muted">(${esc(classLabel(s.class_name))})</span>${archive[s.id] ? ` <span class="muted">· əvvəlki: ${archive[s.id].map((x) => fmtNum(x.score ?? 0)).join(", ")}</span>` : ""}</span>
            <span class="ns-act">${hasVar() ? `<select class="var-assign" data-assign="${s.id}" title="Variant">${["", ...varCodes()].map((c) => `<option value="${c}" ${(assigns[s.id] || "") === c ? "selected" : ""}>${c ? `${c} variantı` : "Variant: avto"}</option>`).join("")}</select>` : ""}
            ${retakes[s.id] ? `<span class="ns-act"><span class="pill wait">🔄 ${formatDate(retakes[s.id])} tarixinə qədər yaza bilər</span> <button class="btn btn-ghost btn-sm" data-retake-cancel="${s.id}">Ləğv et</button></span>`
              : closed ? `<button class="btn btn-ghost btn-sm" data-retake="${s.id}">🔄 Yazmağa icazə ver</button>` : ""}</span>
          </div>`).join("")}</div>${closed ? "" : '<div class="muted" style="margin-top:6px">Sınaq hələ açıqdır — yazmayanlar özləri girib yaza bilər.</div>'}` : "Hamı yazıb 👍"}</div>
      `;
      bind();
      rendered = true;
    }

    function row(a, rank) {
      const p = a.profiles || {};
      const T = total();
      const used = a.submitted_at ? Math.round((new Date(a.submitted_at) - new Date(a.started_at)) / 60000) : null;
      const det = a.details || {};
      const cells = (test.questions || []).filter((q) => q.type !== "essay").map((q) => {
        const d = det[q.n] || {};
        const cls = d.frac >= 1 ? "ok" : d.frac > 0 ? "part" : "bad";
        const K = keyOf(a);
        return `<div class="ans ${cls}" title="Düzgün: ${esc(K[q.n] || "")}"><b>${q.n}</b> ${esc(a.answers?.[q.n] || "—")}${cls !== "ok" ? ` <span style="opacity:.6">→ ${esc(K[q.n] || "")}</span>` : ""}</div>`;
      }).join("");
      const essays = essayQs().map((q) => {
        const txt = a.answers?.[q.n] || "";
        const w = wordCount(txt);
        return `<div class="essay-box">
          <b>Esse (${q.n})</b> <span class="muted small">${w} söz${q.min_words ? ` · minimum ${q.min_words}` : ""}${q.min_words && w < q.min_words ? ' — <span style="color:var(--bad)">azdır</span>' : ""}</span>
          <div class="txt">${esc(txt) || "<i>boşdur</i>"}</div>
        </div>`;
      }).join("");
      const rev = a.essay_review || {};
      const essayGrade = essayQs().length ? `
        <div class="essay-box" style="width:100%">
          <b>Qiymətləndirmə</b> <span class="muted small">— hər meyar maksimum ${fmtNum(perCrit())} bal</span>
          <div class="rubric">${RUBRIC.map((c) => `<div><label>${esc(c)}</label><input type="number" min="0" max="${perCrit()}" step="0.5" data-rub="${a.id}" data-c="${esc(c)}" value="${rev.c?.[c] ?? ""}"></div>`).join("")}</div>
          <div class="essay-grade">
            <label class="small">Esse balı (max ${fmtNum(essayMax())}):</label>
            <input type="number" min="0" max="${essayMax()}" step="0.1" value="${a.essay_score ?? ""}" data-essay="${a.id}">
            <span class="muted small">meyarları yazanda cəmi özü hesablanır</span>
          </div>
          <textarea data-comment="${a.id}" maxlength="1500" style="margin-top:8px;min-height:70px" placeholder="Şərh — şagird nəticələr açılanda görəcək">${esc(rev.comment || "")}</textarea>
          <div class="qc-chips">${qcHtml(a.id)}</div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:8px">
            <button class="btn btn-ok btn-sm" data-essay-save="${a.id}">Yadda saxla</button>
            <button class="btn btn-ghost btn-sm" data-qc-new="${a.id}" title="Yazdığın şərhi sonra bir kliklə istifadə etmək üçün">+ Şərhi hazır siyahıya əlavə et</button>
          </div>
        </div>` : "";
      const statusPill = a.status === "submitted" ? '<span class="pill wait">Esse yoxlanılmalı</span>' : "";
      const sc = secOf(a);
      const chips = sc.length ? `<div class="sec-chips">${sc.map((x) => x.pending ? `<span class="sec-chip" style="background:var(--soft)">${esc(x.name)}: ?</span>` : `<span class="sec-chip ${pctCls(x.pct)}">${esc(x.name)} ${x.pct}%</span>`).join("")}</div>` : "";
      return `
        <div class="rrow">
          <div class="rrow-top">
            <span class="rank">${rank}</span>
            <div class="who">
              <b>${esc(p.full_name)}</b>${varPill(a)} <span class="muted small">${esc(classLabel(p.class_name))} · ${esc(p.student_code || "")}</span> ${statusPill}
              ${chips}
              ${archive[a.user_id] ? `<div class="small" style="color:var(--muted)">🗂 Əvvəlki cəhd: ${archive[a.user_id].map((x) => `<b>${fmtNum(x.score ?? 0)}</b> / ${fmtNum(T)}${hasVar() && x.variant ? ` (${esc(x.variant)} variantı)` : ""} (${formatDate(x.submitted_at || x.archived_at)})`).join(" · ")}</div>` : ""}
              <div class="muted small">Təhvil: ${formatDate(a.submitted_at)}${used !== null ? ` · ${used} dəq` : ""}${violCount[a.id] ? ` · <span style="color:var(--bad)">⚠️ ${violCount[a.id]} pozuntu</span>` : ""}${essayQs().length ? ` · test: ${fmtNum(a.auto_score)} + esse: ${a.essay_score === null ? "?" : fmtNum(a.essay_score)}` : ""}</div>
            </div>
            <div class="sc">${fmtNum(a.score)}<span> / ${fmtNum(T)}</span></div>
          </div>
          <details data-a="${a.id}" ${openIds.has(a.id) || (!rendered && a.status === "submitted") ? "open" : ""}>
            <summary>Cavablar${essayQs().length ? " və esse" : ""}</summary>
            ${cells ? `<div class="ans-grid">${cells}</div>` : ""}
            ${essays}
            <div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-top:10px;align-items:center">
              ${essayGrade}
              <span style="display:flex;gap:.4rem;flex-wrap:wrap">
              ${T && (Number(a.score) || 0) / T * 100 >= CERT_MIN_PERCENT ? `<button class="btn btn-ghost btn-sm" data-cert="${a.id}">🏅 Sertifikat</button>` : ""}
              <button class="btn btn-warn btn-sm" data-retake="${a.user_id}" title="Köhnə nəticə arxivdə qalır, şagird sınağı yenidən yaza bilir">🔄 Yenidən yazsın</button></span>
            </div>
          </details>
        </div>`;
    }

    function classSections(done) {
      const all = done.map(secOf);
      const avg = secs().map((x, i) => {
        const vals = all.map((r) => r[i]).filter((r) => r && !r.pending && r.max);
        const pct = vals.length ? Math.round(vals.reduce((s2, r) => s2 + r.pct, 0) / vals.length) : null;
        return { name: x.name, pct, n: vals.length, range: x.from === x.to ? `${x.from}` : `${x.from}–${x.to}` };
      });
      const known = avg.filter((x) => x.pct !== null);
      const weakest = known.length > 1 ? known.reduce((m, x) => (x.pct < m.pct ? x : m)) : null;
      return `<div class="sec-bars" style="margin:0">${avg.map((x) => {
        const color = x.pct === null ? "var(--line)" : x.pct >= 70 ? "var(--ok)" : x.pct >= 40 ? "var(--gold)" : "var(--bad)";
        return `<div class="sec-bar"><div class="sec-top"><span><b>${esc(x.name)}</b> <span class="muted small">(${x.range})</span>${weakest === x ? ' <span class="sec-chip lo">ən zəif</span>' : ""}</span>
          <span>${x.pct === null ? '<span class="muted">esse yoxlanılmayıb</span>' : `<b>${x.pct}%</b>`}</span></div>
          <div class="qa-bar"><div style="width:${x.pct || 0}%;background:${color}"></div></div></div>`;
      }).join("")}</div>`;
    }

    function qcHtml(id) {
      return qcs.map((c) => `<span class="qc"><button type="button" data-qc-add="${id}" data-qc="${c.id}" title="Şərhə əlavə et">${esc(c.body)}</button><button type="button" class="qc-x" data-qc-del="${c.id}" aria-label="Siyahıdan sil">✕</button></span>`).join("");
    }

    function analysis(done) {
      const qs = (test.questions || []).filter((q) => q.type !== "essay");
      if (!done.length || !qs.length) return `<div class="card empty small" style="grid-column:1/-1">${hasVar() ? "Bu variantı hələ heç kim təhvil verməyib." : "Təhvil verən olandan sonra görünəcək."}</div>`;
      return qs.map((q) => {
        const fr = done.map((a) => Number(a.details?.[q.n]?.frac) || 0);
        const pct = Math.round((fr.reduce((s, x) => s + x, 0) / fr.length) * 100);
        const color = pct >= 70 ? "var(--ok)" : pct >= 40 ? "var(--gold)" : "var(--bad)";
        const K = hasVar() ? keyOf({ variant: anVar }) : key;
        return `<div class="qa-item"><b>${q.n}</b> <span class="muted">· düzgün: ${esc(K[q.n] || "")}</span><span style="float:right;font-weight:700">${pct}%</span>
          <div class="qa-bar"><div style="width:${pct}%;background:${color}"></div></div></div>`;
      }).join("");
    }

    function bind() {
      document.getElementById("refresh").onclick = async () => { if (await load()) render(); };
      document.getElementById("release").onclick = async () => {
        const open = !test.results_released;
        if (open && attempts.some((a) => a.status === "in_progress") && !confirm("Hələ yazan şagirdlər var. Nəticələr (düzgün cavablar da) indi açılsın?")) return;
        const { error } = await sb.from("tests").update({ results_released: open }).eq("id", testId);
        if (error) return toast(translateError(error), "err");
        toast(open ? "Nəticələr açıldı ✓" : "Nəticələr bağlandı", "ok");
        if (await load()) render();
      };
      document.getElementById("regrade").onclick = async () => {
        const { data, error } = await sb.rpc("admin_regrade", { p_test: testId });
        if (error) return toast(translateError(error), "err");
        toast(`${data} nəticə yenidən hesablandı`, "ok");
        if (await load()) render();
      };
      document.getElementById("csv").onclick = exportCsv;
      app.querySelectorAll("[data-rub]").forEach((inp) => inp.oninput = () => {
        const id = inp.dataset.rub;
        const vals = [...app.querySelectorAll(`[data-rub="${id}"]`)].filter((x) => x.value !== "").map((x) => Number(x.value) || 0);
        if (vals.length) app.querySelector(`[data-essay="${id}"]`).value = Math.round(vals.reduce((s2, x) => s2 + x, 0) * 100) / 100;
      });
      app.querySelectorAll("[data-qc-add]").forEach((b) => b.onclick = () => {
        const ta = app.querySelector(`[data-comment="${b.dataset.qcAdd}"]`);
        ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + b.textContent;
        ta.focus();
      });
      app.querySelectorAll("[data-qc-del]").forEach((b) => b.onclick = async () => {
        if (!confirm("Bu hazır şərh siyahıdan silinsin?")) return;
        const { error } = await sb.from("quick_comments").delete().eq("id", Number(b.dataset.qcDel));
        if (error) return toast(translateError(error), "err");
        qcs = qcs.filter((c) => String(c.id) !== b.dataset.qcDel);
        app.querySelectorAll(".qc-chips").forEach((box) => { const id = box.parentElement.querySelector("[data-comment]")?.dataset.comment; box.innerHTML = qcHtml(id); });
        bind();
      });
      app.querySelectorAll("[data-qc-new]").forEach((b) => b.onclick = async () => {
        const ta = app.querySelector(`[data-comment="${b.dataset.qcNew}"]`);
        const sel = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
        const body = (sel || ta.value).trim().slice(0, 300);
        if (!body) return toast("Əvvəl şərh yaz (və ya bir hissəsini seç)", "err");
        if (qcs.some((c) => c.body === body)) return toast("Bu şərh artıq siyahıdadır", "err");
        const { data, error } = await sb.from("quick_comments").insert({ body }).select("id, body").single();
        if (error) return toast(translateError(error), "err");
        qcs.push(data);
        app.querySelectorAll(".qc-chips").forEach((box) => { const id = box.parentElement.querySelector("[data-comment]")?.dataset.comment; box.innerHTML = qcHtml(id); });
        bind();
        toast("Hazır şərhlərə əlavə edildi ✓", "ok");
      });
      app.querySelectorAll("[data-essay-save]").forEach((b) => b.onclick = async () => {
        const id = b.dataset.essaySave;
        const inp = app.querySelector(`[data-essay="${id}"]`);
        const v = inp.value === "" ? null : Number(inp.value);
        if (v !== null && (v < 0 || v > essayMax())) return toast(`Esse balı 0–${fmtNum(essayMax())} arası olmalıdır`, "err");
        const c = {};
        for (const x of app.querySelectorAll(`[data-rub="${id}"]`)) {
          if (x.value === "") continue;
          const n = Number(x.value);
          if (!(n >= 0 && n <= perCrit() + 1e-9)) return toast(`${x.dataset.c}: 0–${fmtNum(perCrit())} arası olmalıdır`, "err");
          c[x.dataset.c] = n;
        }
        const comment = app.querySelector(`[data-comment="${id}"]`).value.trim();
        const review = { ...(Object.keys(c).length ? { c } : {}), ...(comment ? { comment } : {}) };
        const { error } = await sb.rpc("admin_save_essay", { p_attempt: id, p_points: v, p_review: review });
        if (error) return toast(translateError(error), "err");
        toast("Esse balı yazıldı ✓", "ok");
        if (await load()) render();
      });
      app.querySelectorAll("[data-cert]").forEach((b) => b.onclick = async () => {
        const a = attempts.find((x) => x.id === b.dataset.cert), p = a.profiles || {};
        const { downloadCertificate } = await import("./assets/js/certificate.js");
        await downloadCertificate({ name: p.full_name, className: classLabel(p.class_name), title: test.title,
          percent: (Number(a.score) || 0) / total() * 100, date: formatDate(a.submitted_at).split(",")[0],
          code: p.student_code, serial: a.id.slice(0, 8).toUpperCase() });
      });
      app.querySelectorAll("[data-anvar]").forEach((b) => b.onclick = () => { anVar = b.dataset.anvar; render(); });
      app.querySelectorAll("[data-assign]").forEach((sel) => sel.onchange = async () => {
        const uid = sel.dataset.assign, v = sel.value;
        const { error } = v
          ? await sb.from("test_variant_assign").upsert({ test_id: testId, user_id: uid, variant: v })
          : await sb.from("test_variant_assign").delete().eq("test_id", testId).eq("user_id", uid);
        if (error) { sel.value = assigns[uid] || ""; return toast(/relation|schema cache/i.test(error.message || "") ? "Əvvəlcə 16-variants.sql faylını Supabase-də işə sal" : translateError(error), "err"); }
        if (v) assigns[uid] = v; else delete assigns[uid];
        toast(v ? `${v} variantı təyin edildi ✓` : "Variant avtomatik veriləcək", "ok");
      });
      app.querySelectorAll("[data-retake]").forEach((b) => b.onclick = async () => {
        const uid = b.dataset.retake;
        const name = attempts.find((x) => x.user_id === uid)?.profiles?.full_name || notStarted.find((x) => x.id === uid)?.full_name || "";
        const had = attempts.some((x) => x.user_id === uid);
        const days = prompt(`${name} sınağı yenidən yaza bilsin.\n${had ? "Köhnə nəticə arxivdə saxlanılacaq (silinmir).\n" : ""}Sınağın son tarixi keçsə belə, neçə gün ərzində yaza bilsin?`, "3");
        if (days === null) return;
        const n = Math.max(1, Math.min(60, parseInt(days, 10) || 3));
        const { error } = await sb.rpc("admin_allow_retake", { p_test: testId, p_user: uid, p_days: n });
        if (error) return toast(/function|schema cache/i.test(error.message || "") ? "Əvvəlcə 15-delete-retake.sql faylını Supabase-də işə sal" : translateError(error), "err");
        toast(`${name} sınağı ${n} gün ərzində yenidən yaza bilər ✓`, "ok");
        if (await load()) render();
      });
      app.querySelectorAll("[data-retake-cancel]").forEach((b) => b.onclick = async () => {
        const { error } = await sb.rpc("admin_cancel_retake", { p_test: testId, p_user: b.dataset.retakeCancel });
        if (error) return toast(translateError(error), "err");
        toast("İcazə ləğv edildi", "ok");
        if (await load()) render();
      });
    }

    function exportCsv() {
      const qs = test.questions || [];
      const done = attempts.filter((a) => a.status !== "in_progress").sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
      const n = (x) => (x === null || x === undefined ? "" : Math.round(Number(x) * 100) / 100);
      const head = ["№", "Ad Soyad", "Sinif", "Kod", ...(hasVar() ? ["Variant"] : []), "Test balı", "Esse balı", "Yekun bal", "Maksimum", "%", "Təhvil", "Dəqiqə", "Pozuntu",
                    ...qs.map((x) => (x.type === "essay" ? `S${x.n} (esse, söz)` : `S${x.n}`))];
      const pad = hasVar() ? 13 : 12;
      const keyRows = (hasVar() ? varCodes() : ["A"]).map((c) => {
        const K = keyOf({ variant: c });
        return ["", hasVar() ? `DÜZGÜN CAVAB (${c})` : "DÜZGÜN CAVAB", ...Array(pad - 2).fill(""), ...qs.map((x) => (x.type === "essay" ? "" : K[x.n] || ""))];
      });
      const rows = done.map((a, i) => {
        const p = a.profiles || {};
        const used = a.submitted_at ? Math.round((new Date(a.submitted_at) - new Date(a.started_at)) / 60000) : "";
        return [i + 1, p.full_name, classLabel(p.class_name), p.student_code, ...(hasVar() ? [a.variant || "A"] : []), n(a.auto_score), n(a.essay_score), n(a.score), n(total()),
          total() ? Math.round((Number(a.score) || 0) / total() * 100) : "", formatDate(a.submitted_at), used, violCount[a.id] || 0,
          ...qs.map((x) => (x.type === "essay" ? wordCount(a.answers?.[x.n]) : a.answers?.[x.n] || ""))];
      });
      const analysisRows = (hasVar() ? varCodes() : ["A"]).flatMap((c) => {
        const dd = hasVar() ? done.filter((a) => (a.variant || "A") === c) : done;
        const K = keyOf({ variant: c });
        return qs.filter((x) => x.type !== "essay").map((x) => {
          const fr = dd.map((a) => Number(a.details?.[x.n]?.frac) || 0);
          return [...(hasVar() ? [c] : []), x.n, K[x.n] || "", fr.length ? Math.round(fr.reduce((s, v) => s + v, 0) / fr.length * 100) : ""];
        });
      });
      const secSheet = secs().length ? [{ name: "Bölmələr", widths: [5, 26, 12, ...secs().flatMap(() => [10, 8])],
        rows: [["№", "Ad Soyad", "Sinif", ...secs().flatMap((x) => [`${x.name} (bal)`, `${x.name} %`])],
          ["", "MAKSİMUM", "", ...sectionScores(secs(), qs, {}, 0).flatMap((x) => [n(x.max), 100])],
          ...done.map((a, i) => [i + 1, a.profiles?.full_name, classLabel(a.profiles?.class_name),
            ...secOf(a).flatMap((x) => (x.pending ? ["", ""] : [n(x.got), x.pct]))])] }] : [];
      downloadXlsx(`${safeName(test.title)}_neticeler.xlsx`, [
        { name: "Nəticələr", widths: [5, 26, 12, 11, ...(hasVar() ? [8] : []), 9, 9, 9, 9, 6, 17, 7, 8], rows: [head, ...keyRows, ...rows] },
        ...secSheet,
        { name: "Sual analizi", widths: [...(hasVar() ? [8] : []), 8, 18, 14], rows: [[...(hasVar() ? ["Variant"] : []), "Sual", "Düzgün cavab", "Düzgün %"], ...analysisRows] },
        { name: "Yazmayanlar", widths: [28, 14, 12], rows: [["Ad Soyad", "Sinif", "Kod"], ...notStarted.map((s) => [s.full_name, classLabel(s.class_name), s.student_code])] },
      ]);
    }

    async function start() {
      if (!configured) { app.innerHTML = '<div class="card empty">Sayt bazaya qoşulmayıb.</div>'; return; }
      const me = await getMyProfile().catch(() => null);
      if (!me) { location.href = "login.html"; return; }
      if (me.role !== "admin") { location.href = "portal.html"; return; }
      if (!testId) { app.innerHTML = '<div class="card empty">Sınaq seçilməyib.</div>'; return; }
      if (await load()) render();
      // Yazanlar varsa, siyahını 30 saniyədən bir yenilə
      setInterval(async () => {
        if (document.hidden || document.activeElement?.matches("input, textarea") || !attempts.some((a) => a.status === "in_progress")) return;
        if (await load()) render();
      }, 30000);
    }
    start();
  </script>
</body>
</html>
