<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Söz kartları — Wordora</title>
  <meta name="theme-color" content="#3a32b5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wd_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <style>
    .deck-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .deck-row select { flex: 1 1 200px; }
    .mode { display: flex; gap: .4rem; }
    .flash-wrap { perspective: 1200px; max-width: 560px; margin: 0 auto; }
    .flash { position: relative; height: 320px; transform-style: preserve-3d; transition: transform .45s ease; cursor: pointer; }
    .flash.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .face.front { background: var(--grad); color: #fff; }
    .face.back { background: var(--card); transform: rotateY(180deg); }
    .face .w { font: 700 clamp(2rem, 8vw, 3rem)/1.1 var(--display); }
    .face .m { font: 700 1.6rem/1.2 var(--display); margin-bottom: .6rem; }
    .face .ex { color: var(--muted); font-style: italic; }
    .face .hint { color: rgba(255,255,255,.85); font-size: .85rem; margin-top: 1rem; }
    .speak { border: 0; background: rgba(255,255,255,.18); color: #fff; width: 52px; height: 52px; border-radius: 50%; font-size: 1.4rem; margin-top: 14px; cursor: pointer; }
    .back .speak { background: var(--soft); color: var(--text); }
    .flash-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; max-width: 560px; margin: 14px auto 0; }
    .prog { text-align: center; color: var(--muted); font-size: .9rem; }
    .quiz-q { text-align: center; margin-bottom: 14px; }
    .quiz-q .w { font: 700 2.2rem/1.1 var(--display); }
    .quiz-opts { display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
    .quiz-opt { text-align: left; padding: 1rem 1.1rem; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); font: 600 1rem var(--font); cursor: pointer; }
    .quiz-opt.ok { border-color: var(--ok); background: var(--ok-bg); }
    .quiz-opt.bad { border-color: var(--bad); background: var(--bad-bg); }
    .score-pill { font-weight: 800; color: var(--indigo-text); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions"><a class="btn btn-ghost btn-sm" href="portal.html">← Portal</a></nav>
    </div>
  </header>

  <main class="container" style="max-width:760px" id="app"><div class="spinner"></div></main>

  <script type="module">
    import { sb, configured, getMyProfile, esc, toast, translateError } from "./assets/js/app.js";
    import { speak, canSpeak } from "./assets/js/words.js";

    const app = document.getElementById("app");
    let words = [], deck = "", mode = "cards", order = [], idx = 0, quizScore = 0, quizN = 0;
    const KNOWN = "wd_known_words";
    const known = new Set((() => { try { return JSON.parse(localStorage.getItem(KNOWN) || "[]"); } catch { return []; } })());
    const saveKnown = () => { try { localStorage.setItem(KNOWN, JSON.stringify([...known])); } catch {} };

    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const deckWords = () => words.filter((w) => !deck || w.deck === deck);

    function shell() {
      const decks = [...new Set(words.map((w) => w.deck))];
      app.innerHTML = `
        <h1 style="font-size:1.6rem">🔤 Söz kartları</h1>
        <div class="deck-row">
          <select id="deck"><option value="">Bütün sözlər (${words.length})</option>${decks.map((d) => `<option ${d === deck ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
          <div class="mode">
            <button class="tab ${mode === "cards" ? "active" : ""}" data-mode="cards">🃏 Kartlar</button>
            <button class="tab ${mode === "quiz" ? "active" : ""}" data-mode="quiz">❓ Test</button>
          </div>
        </div>
        <div id="stage"></div>`;
      document.getElementById("deck").onchange = (e) => { deck = e.target.value; start(); };
      app.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { mode = b.dataset.mode; shell(); start(); });
    }

    function start() {
      const list = deckWords();
      if (mode === "cards") {
        // əvvəlcə öyrənilməmişlər
        order = shuffle(list.filter((w) => !known.has(w.id))).concat(shuffle(list.filter((w) => known.has(w.id))));
      } else order = shuffle(list.slice());
      idx = 0; quizScore = 0; quizN = 0;
      mode === "cards" ? card() : quiz();
    }

    function card() {
      const st = document.getElementById("stage");
      if (!order.length) { st.innerHTML = '<div class="card empty">Bu dəstdə söz yoxdur.</div>'; return; }
      const w = order[idx];
      const learned = order.filter((x) => known.has(x.id)).length;
      st.innerHTML = `
        <div class="prog">${idx + 1} / ${order.length} · öyrənilib: ${learned}</div>
        <div class="flash-wrap" style="margin-top:8px">
          <div class="flash" id="flash">
            <div class="face front"><div class="w">${esc(w.word)}</div>
              ${canSpeak() ? '<button class="speak" data-say="1" aria-label="Səsləndir">🔊</button>' : ""}
              <div class="hint">Çevirmək üçün toxun</div></div>
            <div class="face back"><div class="m">${esc(w.meaning)}</div>
              ${w.example ? `<div class="ex">“${esc(w.example)}”</div>` : ""}
              ${canSpeak() && w.example ? '<button class="speak" data-say="2" aria-label="Nümunəni səsləndir">🔊</button>' : ""}</div>
          </div>
        </div>
        <div class="flash-nav">
          <button class="btn btn-ghost" id="prev">←</button>
          <button class="btn btn-bad" id="again">🔁 Təkrar</button>
          <button class="btn btn-ok" id="know">✓ Bilirəm</button>
          <button class="btn btn-ghost" id="next">→</button>
        </div>`;
      const f = document.getElementById("flash");
      f.onclick = (e) => {
        const say = e.target.closest("[data-say]");
        if (say) { e.stopPropagation(); speak(say.dataset.say === "1" ? w.word : w.example); return; }
        f.classList.toggle("flipped");
      };
      const go = (d) => { idx = (idx + d + order.length) % order.length; card(); };
      document.getElementById("prev").onclick = () => go(-1);
      document.getElementById("next").onclick = () => go(1);
      document.getElementById("know").onclick = () => { known.add(w.id); saveKnown(); go(1); };
      document.getElementById("again").onclick = () => { known.delete(w.id); saveKnown(); go(1); };
    }

    function quiz() {
      const st = document.getElementById("stage");
      const pool = deckWords();
      if (pool.length < 4) { st.innerHTML = '<div class="card empty">Test üçün dəstdə ən azı 4 söz olmalıdır.</div>'; return; }
      if (idx >= order.length) {
        const pct = Math.round(quizScore / Math.max(quizN, 1) * 100);
        st.innerHTML = `<div class="card center"><div style="font-size:3rem">${pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "💪"}</div>
          <h2>Nəticə: ${quizScore} / ${quizN} (${pct}%)</h2><button class="btn btn-primary" id="restart">Yenidən başla</button></div>`;
        document.getElementById("restart").onclick = start;
        return;
      }
      const w = order[idx];
      const opts = shuffle([w, ...shuffle(pool.filter((x) => x.id !== w.id && x.meaning !== w.meaning)).slice(0, 3)]);
      st.innerHTML = `
        <div class="prog">${idx + 1} / ${order.length} · <span class="score-pill">${quizScore} düzgün</span></div>
        <div class="card quiz-q" style="margin-top:8px"><div class="w">${esc(w.word)}</div>
          ${canSpeak() ? '<button class="btn btn-ghost btn-sm" id="say" style="margin-top:10px">🔊 Dinlə</button>' : ""}</div>
        <div class="quiz-opts">${opts.map((o) => `<button class="quiz-opt" data-id="${o.id}">${esc(o.meaning)}</button>`).join("")}</div>`;
      document.getElementById("say")?.addEventListener("click", () => speak(w.word));
      st.querySelectorAll(".quiz-opt").forEach((b) => b.onclick = () => {
        if (st.querySelector(".quiz-opt.ok")) return;
        quizN++;
        const right = Number(b.dataset.id) === w.id;
        if (right) { quizScore++; known.add(w.id); saveKnown(); }
        st.querySelectorAll(".quiz-opt").forEach((x) => { if (Number(x.dataset.id) === w.id) x.classList.add("ok"); });
        if (!right) b.classList.add("bad");
        setTimeout(() => { idx++; quiz(); }, right ? 700 : 1500);
      });
    }

    async function init() {
      if (!configured) return;
      const me = await getMyProfile().catch(() => null);
      if (!me) { location.href = "login.html"; return; }
      if (me.status !== "approved") { location.href = "portal.html"; return; }
      const { data, error } = await sb.from("words").select("id, deck, word, meaning, example").order("id");
      if (error) { app.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      words = data;
      deck = new URLSearchParams(location.search).get("deck") || "";
      if (!words.length) { app.innerHTML = '<div class="card empty">Müəllim hələ söz əlavə etməyib.</div>'; return; }
      shell(); start();
    }
    init();
  </script>
</body>
</html>
