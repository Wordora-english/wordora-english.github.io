<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Canlı viktorina — Wordora</title>
  <meta name="theme-color" content="#1d1a5e">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/live.css">
</head>
<body class="live">
  <div class="live-top">
    <a class="wordmark" href="portal.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
    <a class="btn btn-ghost btn-sm" href="portal.html">Portal</a>
  </div>
  <main id="app"><div class="spinner"></div></main>

  <script type="module">
    import { sb, configured, getMyProfile, esc, toast, translateError } from "./assets/js/app.js";
    import { startGuard, isTorError, torScreen } from "./assets/js/guard.js";
    import { OPTION_STYLE, TEAMS, teamLabel } from "./assets/js/live-common.js";
    import { LiveAudio, confetti, AVATARS, COLORS, REACTIONS } from "./assets/js/live-audio.js";

    const app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    let sid = params.get("s") || sessionStorage.getItem("wd_live") || null;
    let me, st = null, lastKey = "", sending = false, leftAt = 0, timer = null, prevPhase = "";
    // Telefonda: effektlər açıq, musiqi bağlı (sinifdə 30 telefon birdən çalmasın); istəyən açır
    const audio = new LiveAudio({ music: false });
    document.addEventListener("pointerdown", () => audio.unlock(), { once: true });

    const center = (html) => `<div class="pl-center"><div class="pl-card">${html}</div></div>`;
    const teamChip = (t) => (t === null || t === undefined || !TEAMS[t] ? "" : `<span class="team-chip" style="background:${TEAMS[t].color}">${TEAMS[t].icon} ${esc(TEAMS[t].name)}</span>`);
    let draft = "";   // yazmalı sualda yazılan (ekran yenilənsə itməsin)
    const ava = (a, c, cls = "") => `<span class="ava ${cls}" style="background:${esc(c || "#7b4fe0")}">${esc(a || "🙂")}</span>`;

    function joinScreen(prefill = "") {
      app.innerHTML = center(`
        <div style="font-size:2.4rem">🎮</div>
        <h1 style="font-size:1.4rem">Canlı viktorina</h1>
        <p class="muted small">Proyektordakı 6 rəqəmli kodu yaz</p>
        <input class="code-input" id="code" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="000000" value="${esc(prefill)}">
        <button class="btn btn-primary btn-block" id="join" style="margin-top:12px">Qoşul</button>`);
      const inp = document.getElementById("code");
      inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 6); });
      inp.focus();
      const go = async () => {
        audio.unlock();
        const code = inp.value;
        if (code.length !== 6) return toast("Kod 6 rəqəmdir", "err");
        const { data, error } = await sb.rpc("live_join", { p_code: code });
        if (error) return toast(translateError(error), "err");
        sid = data.session_id;
        sessionStorage.setItem("wd_live", sid);
        history.replaceState(null, "", `live.html?s=${sid}`);
        audio.pop();
        startPolling();
      };
      document.getElementById("join").onclick = go;
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    }

    async function answer(i) {
      if (sending) return;
      sending = true;
      audio.tap();
      st.my_choice = i;            // ekranda dərhal göstər
      lastKey = ""; render();
      const { data, error } = await sb.rpc("live_answer", { p_session: sid, p_choice: i });
      sending = false;
      if (error) toast(translateError(error), "err");
      else if (data && !data.accepted) toast("Vaxt bitdi — cavab qəbul olunmadı", "err");
    }

    async function answerText() {
      const v = (document.getElementById("pl-ans")?.value || "").trim();
      if (!v) return toast("Cavabı yaz", "err");
      if (sending) return;
      sending = true;
      audio.tap();
      st.my_choice = 0; st.my_text = v;
      lastKey = ""; render();
      const { data, error } = await sb.rpc("live_answer_text", { p_session: sid, p_text: v });
      sending = false;
      if (error) { toast(translateError(error), "err"); st.my_choice = null; lastKey = ""; render(); }
      else { draft = ""; if (data && !data.accepted) toast("Vaxt bitdi — cavab qəbul olunmadı", "err"); }
    }

    // komandanın yeri (reveal/finished)
    function teamLine() {
      if (!st.teams || st.team === null || st.team === undefined || !st.team_scores?.length) return "";
      const k = st.team_scores.findIndex((t) => t.team === st.team);
      if (k < 0) return "";
      return `<p style="margin:.4rem 0 0">${teamChip(st.team)} komandası: <b>${k + 1}-ci yer</b> · ${st.team_scores[k].avg} bal</p>`;
    }

    let lastReactAt = 0;
    function reactRow() {
      return `<div class="react-row">${REACTIONS.map((e) => `<button type="button" data-react="${e}">${e}</button>`).join("")}</div>
        <div class="small muted" style="margin-top:4px">Toxun — proyektorda uçacaq</div>`;
    }
    function bindReact() {
      app.querySelectorAll("[data-react]").forEach((b) => b.onclick = () => {
        if (Date.now() - lastReactAt < 1000) return;
        lastReactAt = Date.now();
        audio.tap();
        sb.rpc("live_react", { p_session: sid, p_emoji: b.dataset.react }).then(() => {}, () => {});
      });
    }
    function soundRow() {
      return `<div style="display:flex;gap:6px;justify-content:center;margin-top:.8rem">
        <button type="button" class="btn btn-ghost btn-sm" id="t-sfx">${audio.sfxOn ? "🔔 Səslər: açıq" : "🔕 Səslər: bağlı"}</button>
        <button type="button" class="btn btn-ghost btn-sm" id="t-mus">${audio.musicOn ? "🎵 Musiqi: açıq" : "🎵 Musiqi: bağlı"}</button></div>`;
    }
    function bindSound() {
      document.getElementById("t-sfx")?.addEventListener("click", (e) => { audio.unlock(); audio.setSfx(!audio.sfxOn); e.target.textContent = audio.sfxOn ? "🔔 Səslər: açıq" : "🔕 Səslər: bağlı"; });
      document.getElementById("t-mus")?.addEventListener("click", (e) => {
        audio.unlock(); audio.setMusic(!audio.musicOn); e.target.textContent = audio.musicOn ? "🎵 Musiqi: açıq" : "🎵 Musiqi: bağlı";
        if (audio.musicOn && st?.status === "lobby") audio.play("lobby"); else if (!audio.musicOn) audio.stop();
      });
    }

    // ---- Gözləmə otağı: personaj seç, kimlər var, emoji göndər ----
    let pickTimer = null;
    function lobby() {
      const roomHtml = () => (st.room || []).map((p) => `<span title="${esc(p.name)}">${ava(p.avatar, p.color)}</span>`).join("");
      if (document.getElementById("pick")) {   // yalnız otağı yenilə — seçim pəncərəsi yerində qalsın
        document.getElementById("mini-room").innerHTML = roomHtml();
        document.getElementById("pcount").textContent = st.players;
        document.getElementById("my-team").innerHTML = st.teams ? `Sənin komandan: ${teamChip(st.team)}` : "";
        return;
      }
      app.innerHTML = center(`
        <div id="my-ava">${ava(st.avatar, st.color, "lg")}</div>
        <h1 style="font-size:1.3rem;margin:.4rem 0 0">Qoşuldun, ${esc(me.full_name.split(" ")[0])}!</h1>
        <div id="my-team" class="small" style="margin:.3rem 0">${st.teams ? `Sənin komandan: ${teamChip(st.team)}` : ""}</div>
        <p class="muted small" style="margin:.2rem 0 .4rem">Müəllim başlayana qədər personajını seç 👇</p>
        <div class="pick-grid" id="pick">${AVATARS.map((a) => `<button type="button" data-a="${a}" class="${a === st.avatar ? "on" : ""}">${a}</button>`).join("")}</div>
        <div class="color-row" id="colors">${COLORS.map((c) => `<button type="button" data-c="${c}" class="${c === st.color ? "on" : ""}" style="background:${c}" aria-label="rəng"></button>`).join("")}</div>
        <hr style="border:0;border-top:1px solid var(--line);margin:.8rem 0">
        <div class="small"><b>👥 Otaqda: <span id="pcount">${st.players}</span> nəfər</b></div>
        <div class="mini-room" id="mini-room">${roomHtml()}</div>
        ${reactRow()}
        ${soundRow()}`);
      const choose = (a, c) => {
        st.avatar = a; st.color = c;
        document.getElementById("my-ava").innerHTML = ava(a, c, "lg");
        app.querySelectorAll("#pick button").forEach((b) => b.classList.toggle("on", b.dataset.a === a));
        app.querySelectorAll("#colors button").forEach((b) => b.classList.toggle("on", b.dataset.c === c));
        audio.tap();
        clearTimeout(pickTimer);
        pickTimer = setTimeout(() => sb.rpc("live_set_avatar", { p_session: sid, p_avatar: a, p_color: c }).then(({ error }) => { if (error) toast(translateError(error), "err"); }), 350);
      };
      app.querySelectorAll("#pick button").forEach((b) => b.onclick = () => choose(b.dataset.a, st.color || COLORS[0]));
      app.querySelectorAll("#colors button").forEach((b) => b.onclick = () => choose(st.avatar || AVATARS[0], b.dataset.c));
      bindReact(); bindSound();
    }

    function render() {
      const phase = `${st.status}|${st.q_index}`;
      const key = `${phase}|${st.my_choice}|${st.my_points}|${st.score}|${st.status === "lobby" ? JSON.stringify(st.room) + st.team + st.teams : ""}`;
      if (key === lastKey) return;
      lastKey = key;
      const changed = phase !== prevPhase;
      prevPhase = phase;

      if (changed) {
        if (st.status === "lobby" && audio.musicOn) audio.play("lobby"); else audio.stop();
      }

      if (st.status === "lobby") return lobby();

      const head = `<div class="pl-status"><span class="pl-top-ava">${ava(st.avatar, st.color, "sm")} Sual ${st.q_index + 1}/${st.total}</span><span id="pl-cd"></span></div>`;

      const q0 = st.question || {};
      const x2 = q0.double ? '<div class="pl-x2">⭐ İKİQAT BAL ⭐</div>' : "";
      if (st.status === "question" && (st.my_choice === null || st.my_choice === undefined) && q0.type === "text") {
        if (changed) { audio.whoosh(); draft = ""; }
        app.innerHTML = `${head}<div class="pl-time"><i id="pl-bar" style="width:100%"></i></div>${x2}
          <form class="pl-type" id="pl-form">
            <div class="pl-q">${esc(q0.text || "")}</div>
            <input id="pl-ans" maxlength="120" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Cavabı yaz…" value="${esc(draft)}">
            <button class="btn btn-primary" type="submit">Göndər ✓</button>
          </form>`;
        const inp = document.getElementById("pl-ans");
        inp.addEventListener("input", () => { draft = inp.value; });
        document.getElementById("pl-form").onsubmit = (e) => { e.preventDefault(); answerText(); };
        if (changed) setTimeout(() => inp.focus(), 50);
        tick();
        return;
      }

      if (st.status === "question" && (st.my_choice === null || st.my_choice === undefined)) {
        const q = st.question;
        if (changed) audio.whoosh();
        app.innerHTML = `${head}<div class="pl-time"><i id="pl-bar" style="width:100%"></i></div>${x2}
          <div class="pl-opts" style="${q.options.length <= 2 ? "grid-template-columns:1fr" : ""}">
            ${q.options.map((o, i) => `<button class="pl-opt" data-i="${i}" style="background:${OPTION_STYLE[i].color}"><span class="sym">${OPTION_STYLE[i].sym}</span><span>${esc(o)}</span></button>`).join("")}
          </div>`;
        app.querySelectorAll(".pl-opt").forEach((b) => b.onclick = () => answer(Number(b.dataset.i)));
        tick();
        return;
      }

      if (st.status === "question") {
        if (q0.type === "text") {
          app.innerHTML = center(`<div style="font-size:3rem">✍️</div><h1 style="font-size:1.4rem">Cavab göndərildi</h1><p style="font-size:1.2rem"><b>${esc(st.my_text || "")}</b></p><p class="muted">Digərlərini gözləyirik…</p>`);
          return;
        }
        const s = OPTION_STYLE[st.my_choice] || OPTION_STYLE[0];
        app.innerHTML = center(`<div style="font-size:3rem;color:${s.color}">${s.sym}</div><h1 style="font-size:1.4rem">Cavab göndərildi</h1><p class="muted">Digərlərini gözləyirik…</p>`);
        return;
      }

      if (st.status === "reveal") {
        const none = st.my_choice === null || st.my_choice === undefined;
        if (changed) { if (!none && st.my_correct) { audio.correct(); if (st.streak >= 3) setTimeout(() => audio.streak(), 450); } else audio.wrong(); }
        app.innerHTML = center((none
          ? `<div style="font-size:3rem">⏰</div><div class="result-big result-bad">Cavab vermədin</div>`
          : st.my_correct
            ? `<div style="font-size:3rem">🎉</div><div class="result-big result-ok">Düzgün!</div><p style="font-size:1.3rem;font-weight:800">+${st.my_points}</p>
               ${st.streak >= 3 ? `<div class="streak-badge">🔥 ${st.streak} ardıcıl düzgün! Bonus bal</div>` : st.streak === 2 ? '<div class="small muted">Daha biri düzgün olsa — 🔥 seriya bonusu!</div>' : ""}`
            : `<div style="font-size:3rem">😕</div><div class="result-big result-bad">Səhv</div>${q0.type === "text"
                ? `<p>Sənin cavabın: <s>${esc(st.my_text || "")}</s><br>Düzgün: <b style="color:var(--ok)">${esc(q0.answer || "")}</b></p>`
                : '<p class="muted">Düzgün cavab proyektordadır</p>'}`)
        + (none && q0.type === "text" && q0.answer ? `<p>Düzgün cavab: <b style="color:var(--ok)">${esc(q0.answer)}</b></p>` : "")
        + (q0.double && st.my_correct ? '<p class="small" style="margin:.2rem 0 0">⭐ İkiqat bal sualı idi!</p>' : "")
        + `<hr style="border:0;border-top:1px solid var(--line);margin:1rem 0"><p>${ava(st.avatar, st.color, "sm")} Balın: <b>${st.score}</b> · Yerin: <b>${st.rank}</b> / ${st.players}</p>${teamLine()}${reactRow()}`);
        bindReact();
        return;
      }

      if (st.status === "finished") {
        sessionStorage.removeItem("wd_live");
        clearInterval(timer);
        const medal = st.rank === 1 ? "🥇" : st.rank === 2 ? "🥈" : st.rank === 3 ? "🥉" : "🏁";
        if (changed) { audio.fanfare(); if (st.rank <= 3) setTimeout(() => confetti(90), 600); }
        app.innerHTML = center(`<div style="font-size:3.4rem">${medal}</div>${ava(st.avatar, st.color, "lg")}<h1 style="font-size:1.5rem;margin-top:.5rem">Viktorina bitdi</h1>
          <p style="font-size:1.2rem">Yekun bal: <b>${st.score}</b></p><p style="font-size:1.2rem">Yerin: <b>${st.rank}</b> / ${st.players}</p>${teamLine()}
          ${st.teams && st.team_scores?.[0]?.team === st.team && st.team_scores[0].avg > 0 ? '<p style="font-size:1.2rem">🏆 <b>Komandan qalib gəldi!</b></p>' : ""}
          <a class="btn btn-primary btn-block" href="portal.html" style="margin-top:12px">Portala qayıt</a>`);
      }
    }

    let lastSec = -1;
    function tick() {
      if (st?.status !== "question") return;
      const ms = Math.max(0, leftAt - Date.now()), sec = Math.ceil(ms / 1000);
      const el = document.getElementById("pl-cd");
      if (el) el.textContent = `⏱ ${sec}`;
      const bar = document.getElementById("pl-bar");
      if (bar && st.time) bar.style.width = `${Math.min(100, ms / (st.time * 10))}%`;
      if (bar && sec <= 3 && sec > 0 && sec !== lastSec) { lastSec = sec; audio.tick(true); }
    }
    setInterval(tick, 250);

    async function poll() {
      const { data, error } = await sb.rpc("live_state", { p_session: sid });
      if (error) {
        sessionStorage.removeItem("wd_live");
        clearInterval(timer);
        toast(translateError(error), "err");
        return joinScreen();
      }
      if (sending && data.status === "question") { data.my_choice = st?.my_choice; data.my_text = st?.my_text; }   // göndərilən cavabı itirmə
      st = data;
      if (st.status === "question") leftAt = Date.now() + (st.left_ms || 0);
      render();
    }

    function startPolling() {
      clearInterval(timer);
      poll();
      timer = setInterval(() => { if (!document.hidden) poll(); }, 1000);
    }

    async function start() {
      if (!configured) return;
      try { me = await getMyProfile(); } catch (err) { if (isTorError(err)) return torScreen(app); }
      if (!me) { location.href = "login.html"; return; }
      if (me.status !== "approved") { location.href = "portal.html"; return; }
      startGuard({ me, page: "canlı viktorina" });
      const code = params.get("code");
      if (code && /^\d{6}$/.test(code)) { sid = null; joinScreen(code); document.getElementById("join").click(); }
      else if (sid) startPolling();
      else joinScreen("");
    }
    start();
  </script>
</body>
</html>
