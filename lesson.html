  <style>
    html, body { height: 100%; }
    body.room { background: #0b0f1f; color: #e9eaf5; margin: 0; overflow: hidden; }
    .r-wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .r-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); background: #11162b; border-bottom: 1px solid #1f2642; }
    .r-top .t { font-family: var(--display); font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .r-live { background: #c62f45; color: #fff; font-size: .7rem; font-weight: 700; padding: .15rem .5rem; border-radius: 99px; letter-spacing: .05em; }
    .r-cnt, .r-time { font-size: .85rem; color: #aab0d0; white-space: nowrap; }
    .r-stage { flex: 1; min-height: 0; position: relative; padding: 10px; overflow: auto; }
    .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); align-content: start; }
    .tile { position: relative; background: #161c35; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; }
    .tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
    .tile.screen video { object-fit: contain; }
    .tile .nm { position: absolute; left: 8px; bottom: 8px; background: rgba(0, 0, 0, .55); color: #fff; font-size: .8rem; padding: .15rem .5rem; border-radius: 8px; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .av { position: absolute; inset: 0; display: none; place-items: center; }
    .tile .av span { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #3a32b5, #7b4fe0); display: grid; place-items: center; font-family: var(--display); font-size: 2rem; font-weight: 700; color: #fff; }
    .tile.nocam .av { display: grid; }
    .tile.nocam video { visibility: hidden; }
    .tile .hand { position: absolute; top: 8px; right: 8px; font-size: 1.6rem; display: none; cursor: pointer; animation: wave 1s ease-in-out infinite alternate; }
    .tile.hand .hand { display: block; }
    .tile.hand { outline: 3px solid #f5b400; }
    .tile .warn { position: absolute; top: 8px; left: 8px; font-size: .72rem; background: rgba(198, 47, 69, .85); color: #fff; padding: .1rem .45rem; border-radius: 6px; display: none; }
    .tile.bad .warn { display: block; }
    .tile .away-b { position: absolute; inset: auto 0 0 0; top: 0; display: none; place-items: center; background: rgba(198, 47, 69, .55); color: #fff; font-weight: 700; font-size: 1rem; text-align: center; }
    .tile.away .away-b { display: grid; }
    .tile.away { outline: 3px solid #c62f45; }
    .r-alert { background: #c62f45; color: #fff; border: 0; border-radius: 99px; font-weight: 700; font-size: .8rem; padding: .25rem .65rem; cursor: pointer; }
    .r-alert[hidden] { display: none; }
    .rchat-l .m.sys { background: rgba(198, 47, 69, .15); border-left: 3px solid #c62f45; padding: 4px 8px; border-radius: 6px; font-size: .85rem; }
    .rchat-l .m.sys.ok { background: rgba(18, 146, 92, .15); border-color: #12925c; }
    @keyframes wave { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) { .tile .hand { animation: none; } }
    .main-tile { aspect-ratio: auto; height: 100%; min-height: 200px; }
    .main-tile video { object-fit: contain; }
    .main-tile.screen::after { content: "⛶ Böyütmək üçün toxun"; position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, .55); color: #fff; font-size: .75rem; padding: .15rem .5rem; border-radius: 8px; pointer-events: none; }
    .main-tile:fullscreen::after { display: none; }
    .self { position: absolute; right: 14px; bottom: 14px; width: min(30vw, 180px); aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); z-index: 3; border: 2px solid #2a3157; }
    .self video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .self.screen video { transform: none; object-fit: contain; }
    .slide-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: rgba(17, 22, 43, .92); border: 1px solid #262e55; padding: 8px 10px; border-radius: 99px; z-index: 4; }
    .slide-bar[hidden] { display: none; }
    .slide-bar b { min-width: 64px; text-align: center; }
    .slide-bar .cb { width: 42px; height: 42px; font-size: 1rem; }
    .slide-bar .cb.end { width: auto; }
    .self.nocam::after { content: "📷 bağlı"; position: absolute; inset: 0; display: grid; place-items: center; color: #aab0d0; font-size: .8rem; background: #161c35; }
    .perm { background: #12925c; color: #fff; font-size: .85rem; font-weight: 600; padding: .45rem 14px; text-align: center; }
    .perm[hidden] { display: none; }
    .mates { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 0; }
    .mate { font-size: .78rem; background: #1a2040; border-radius: 99px; padding: .2rem .6rem; color: #c4c7de; }
    .mate.hand { background: #f5b400; color: #2a1d00; font-weight: 700; }
    .r-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #11162b; border-top: 1px solid #1f2642; }
    .cb { width: 52px; height: 52px; border-radius: 50%; border: 0; background: #232a4d; color: #fff; font-size: 1.3rem; cursor: pointer; display: grid; place-items: center; position: relative; }
    .cb:hover { background: #2f3866; }
    .cb:disabled { opacity: .35; cursor: not-allowed; }
    .cb.off { background: #c62f45; }
    .cb.on { background: #f5b400; color: #2a1d00; }
    .cb.end { background: #c62f45; width: auto; border-radius: 99px; padding: 0 18px; font-size: .95rem; font-weight: 600; }
    .cb .dot { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: #f5b400; display: none; }
    .cb.unread .dot { display: block; }
    .cb[hidden] { display: none; }
    .rchat { position: absolute; right: 10px; top: 10px; bottom: 10px; width: min(340px, calc(100% - 20px)); background: #141a33; border: 1px solid #262e55; border-radius: 16px; display: flex; flex-direction: column; z-index: 5; }
    .rchat[hidden] { display: none; }
    .rchat-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #262e55; font-weight: 600; }
    .rchat-l { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .rchat-l .m b { color: #b9b0ff; font-size: .8rem; display: block; }
    .rchat-l .m.t b { color: #f5b400; }
    .rchat-f { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #262e55; }
    .rchat-f input { flex: 1; min-width: 0; background: #0f1430; color: #fff; border: 1px solid #2a3157; }
    .wait { height: 100%; display: grid; place-items: center; text-align: center; color: #aab0d0; padding: 20px; }
    .pre { max-width: 460px; margin: 0 auto; padding: 24px 16px; text-align: center; }
    .pre .self-pre { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #161c35; margin: 14px 0; }
    .pre .self-pre video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .pre .row { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
    .pre .hint { font-size: .85rem; color: #aab0d0; }
    .pre h1 { font-family: var(--display); font-size: 1.4rem; margin: 0; }
    .unmute { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 10; }
    .r-toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: #f5b400; color: #2a1d00; padding: .5rem 1rem; border-radius: 99px; font-weight: 600; z-index: 20; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); width: max-content; max-width: calc(100vw - 32px); text-align: center; }
    .card-dark { background: #141a33; border: 1px solid #262e55; border-radius: 18px; padding: 24px; max-width: 460px; margin: 60px auto; text-align: center; }
    @media (max-width: 600px) {
      .cb { width: 46px; height: 46px; font-size: 1.15rem; }
      .r-bar { gap: 6px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .r-time { display: none; }
    }
  </style>

<body class="room">
  <div id="app"><div class="spinner" style="margin-top:80px"></div></div>
  <audio id="ping" preload="auto" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="></audio>

  <script type="module">
    import { sb, configured, getMyProfile, esc, translateError } from "./assets/js/app.js";

    const app = document.getElementById("app");
    const $ = (id) => document.getElementById(id);
    const lessonId = new URLSearchParams(location.search).get("id");
    const myKey = `${Math.random().toString(36).slice(2, 10)}${Date.now().toString(36)}`;
    let info, ch, local = null, screenStream = null, iceServers, wakeLock = null, startedAt = Date.now(), facing = "user";
    const st = { mic: true, cam: true, hand: false, screen: false, allow: false };
    const peers = new Map();   // key -> peer
    let people = {};           // key -> meta (presence)
    const chatMsgs = [];
    let left = false;
    let relayOwners = [null, null];   // müəllim: hansı şagirdlərin səsi hamıya ötürülür
    let awayAt = null, blurT = null, alerts = 0;
    const awayAlerted = new Set(), byes = new Set(), seen = new Set();   // müəllim: hansı şagirdlər üçün artıq xəbərdarlıq çıxıb
    window.__wd = { peers, get people() { return people; }, get local() { return local; } };   // yoxlama üçün

    const myMeta = () => ({ key: myKey, uid: info.uid, name: info.name, teacher: info.teacher, mic: st.mic && !!local?.getAudioTracks().length, cam: st.cam && !!local?.getVideoTracks().length, hand: st.hand, screen: st.screen, away: !!awayAt, allow: info.teacher && st.allow });
    // Müəllim "çıxmağa icazə" veribsə (məs. uşaqlar PDF açsın) — xəbərdarlıq olmur
    const awayAllowed = () => (info.teacher ? st.allow : Object.values(people).some((m) => m.teacher && m.allow));
    const initial = (n) => (n || "?").trim().charAt(0).toUpperCase();
    const studentCount = () => Object.values(people).filter((p) => !p.teacher && p.key !== myKey).length;

    function flash(msg) {
      const d = document.createElement("div"); d.className = "r-toast"; d.textContent = msg; document.body.appendChild(d);
      setTimeout(() => d.remove(), 3500);
    }
    function fail(msg, back = true) {
      app.innerHTML = `<div class="card-dark"><div style="font-size:2.5rem">🎥</div><p>${esc(msg)}</p>${back ? `<a class="btn btn-primary" href="${info?.teacher ? "video-admin.html" : "portal.html"}">Geri qayıt</a>` : ""}</div>`;
    }

    // ---------- Kamera / mikrofon ----------
    async function getMedia(video = true) {
      const vc = info.teacher
        ? { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 24 }, facingMode: facing }
        : { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 15, max: 15 }, facingMode: facing };
      const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
      try { return await navigator.mediaDevices.getUserMedia({ audio, video: video ? vc : false }); }
      catch (e) {
        if (video) { try { return await navigator.mediaDevices.getUserMedia({ audio }); } catch {} }
        try { return await navigator.mediaDevices.getUserMedia({ video: vc }); } catch {}
        return null;
      }
    }

    // ---------- Əlaqə (WebRTC, "perfect negotiation") ----------
    // Supabase saniyədə ~10 mesaj qəbul edir — növbə ilə göndəririk
    const outq = []; let pumping = false;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    function send(event, payload) { outq.push({ event, payload }); pump(); }
    async function pump() {
      if (pumping) return; pumping = true;
      while (outq.length && ch && !left) {
        const m = outq.shift();
        let r; try { r = await ch.send({ type: "broadcast", event: m.event, payload: m.payload }); } catch { r = "error"; }
        if (r === "rate limited") { outq.unshift(m); await sleep(400); } else await sleep(110);
      }
      pumping = false;
    }

    function createPeer(meta, initiator = false) {
      const pc = new RTCPeerConnection({ iceServers });
      const p = { key: meta.key, meta, pc, polite: myKey > meta.key, makingOffer: false, ignoreOffer: false, stream: new MediaStream(), cands: [], t: null, restarted: false,
                  sid: Math.random().toString(36).slice(2, 10), rsid: null, born: Date.now(), okAt: 0 };
      peers.set(meta.key, p);
      const withVideo = info.teacher || meta.teacher;
      p.video = withVideo;
      const at = local?.getAudioTracks()[0];
      const vt = screenStream?.getVideoTracks()[0] || local?.getVideoTracks()[0];
      if (at) pc.addTrack(at, local);
      if (withVideo && vt) pc.addTrack(vt, local);
      // Müəllim: hər şagirdə 2 əlavə səs kanalı — danışan şagirdlərin səsi bunlarla digərlərinə ötürülür
      if (info.teacher) p.relay = [0, 1].map(() => pc.addTransceiver("audio", { direction: "sendonly" }).sender);
      if (initiator) {   // göndərəcək heç nə yoxdursa da əlaqə qurulsun
        if (!at) pc.addTransceiver("audio", { direction: "recvonly" });
        if (withVideo && !vt) pc.addTransceiver("video", { direction: "recvonly" });
      }
      pc.onnegotiationneeded = async () => {
        try { p.makingOffer = true; await pc.setLocalDescription(); send("sig", { to: p.key, from: myKey, sid: p.sid, rsid: p.rsid, meta: myMeta(), description: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } }); }
        catch (e) { console.warn(e); } finally { p.makingOffer = false; }
      };
      pc.onicecandidate = ({ candidate }) => {
        if (!candidate) return;
        p.cands.push(candidate.toJSON());
        clearTimeout(p.t);
        p.t = setTimeout(() => { const c = p.cands.splice(0); if (c.length) send("sig", { to: p.key, from: myKey, sid: p.sid, rsid: p.rsid, candidates: c }); }, 300);
      };
      pc.ontrack = ({ track }) => {
        p.stream.addTrack(track);
        if (track.kind === "audio") {   // hər səs üçün ayrıca element — hamısı eşidilsin
          const a = document.createElement("audio");
          a.autoplay = true; a.srcObject = new MediaStream([track]);
          document.body.appendChild(a); (p.auds ||= []).push(a);
          a.play().catch(blocked);
          updateRelay();
        } else {
          p.vstream = new MediaStream([track]);
          const v = p.el?.querySelector("video");
          if (v) { v.srcObject = p.vstream; v.play().catch(() => {}); }
        }
        track.onunmute = () => render();
        render();
      };
      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === "connected") { p.bad = false; tuneBitrate(p); }
        if (s === "failed") {
          p.bad = true;
          if (!p.restarted) { p.restarted = true; pc.restartIce(); }
        }
        if (s === "disconnected") p.bad = true;
        render();
      };
      return p;
    }

    async function tuneBitrate(p) {
      for (const s of p.pc.getSenders()) {
        if (s.track?.kind !== "video") continue;
        const prm = s.getParameters();
        if (!prm.encodings?.length) prm.encodings = [{}];
        const n = studentCount();
        // sinif böyüdükcə keyfiyyət avtomatik azalır ki, hamı qoşula bilsin
        const [br, sc] = info.teacher
          ? (st.screen ? [n <= 8 ? 900e3 : n <= 16 ? 500e3 : 300e3, 1] : n <= 8 ? [450e3, 1] : n <= 16 ? [300e3, 1] : n <= 25 ? [200e3, 1.5] : [130e3, 2])
          : (n <= 12 ? [150e3, 1] : n <= 25 ? [100e3, 1.34] : [60e3, 2]);
        prm.encodings[0].maxBitrate = br;
        prm.encodings[0].scaleResolutionDownBy = sc;
        try { await s.setParameters(prm); } catch {}
      }
    }

    async function onSig({ to, from, sid, rsid, meta, description, candidates }) {
      if (to !== myKey || left) return;
      if (meta) people[from] = { ...(people[from] || {}), ...meta };
      let p = peers.get(from);
      const isOffer = description?.type === "offer";
      // Qarşı tərəf əlaqəni yenidən başladıbsa (və ya mesaj köhnə əlaqəyə aiddirsə) — köhnəni at, yenisini qur
      if (p && ((rsid && rsid !== p.sid) || (sid && p.rsid && p.rsid !== sid))) {
        if (!isOffer) return;
        dropPeer(from); p = null;
      }
      if (!p) {
        if (!isOffer) return;
        p = createPeer(meta || people[from] || { key: from });
      }
      if (sid) p.rsid = sid;
      const pc = p.pc;
      try {
        if (description) {
          const collision = description.type === "offer" && (p.makingOffer || pc.signalingState !== "stable");
          p.ignoreOffer = !p.polite && collision;
          if (p.ignoreOffer) return;
          await pc.setRemoteDescription(description);
          if (description.type === "offer") {
            await pc.setLocalDescription();
            send("sig", { to: from, from: myKey, sid: p.sid, rsid: p.rsid, meta: myMeta(), description: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
          }
        }
        for (const c of candidates || []) {
          try { await pc.addIceCandidate(c); } catch (e) { if (!p.ignoreOffer) console.warn(e); }
        }
      } catch (e) { console.warn(e); }
    }

    function dropPeer(key) {
      const p = peers.get(key); if (!p) return;
      try { p.pc.close(); } catch {}
      p.el?.remove(); (p.auds || []).forEach((a) => a.remove());
      peers.delete(key);
    }

    function syncPeers() {
      const present = new Set(Object.keys(people));
      for (const key of present) {
        if (key === myKey) continue;
        const m = people[key];
        // Əlaqə yalnız müəllim ↔ şagird. Şagirdlər bir-birini müəllimin ötürdüyü səs ilə eşidir —
        // belə olanda sinifdə çox şagird ola bilər.
        if (!m || !!m.teacher === !!info.teacher) continue;
        if (!peers.has(key) && myKey < key) {   // hər cüt üçün bir tərəf başlayır
          createPeer(m, true);
        }
      }
      const n = studentCount();
      if (n !== syncPeers.n) { syncPeers.n = n; for (const p of peers.values()) tuneBitrate(p); }
      updateRelay();
      render();
    }

    // Gözətçi: hər 4 saniyədən bir əlaqələri yoxlayır, qırılanı özü yenidən qurur
    const asked = {};
    function watchdog() {
      if (left || !ch) return;
      const now = Date.now();
      // internet kəsilib qayıdanda adımız siyahıdan düşübsə — yenidən yazılırıq
      if (!ch.presenceState()?.[myKey] && (!watchdog.tr || now - watchdog.tr > 10000)) { watchdog.tr = now; ch.track(myMeta()).catch?.(() => {}); }
      for (const p of [...peers.values()]) {
        const s = p.pc.connectionState, present = !!people[p.key];
        if (s === "connected") { p.okAt = now; continue; }
        const since = now - Math.max(p.okAt, p.born);
        if (!present) { if (since > 6000) dropPeer(p.key); continue; }   // dərsdən çıxıb
        if (s === "failed" || s === "closed" || since > 15000) {
          if (myKey < p.key) { dropPeer(p.key); createPeer(people[p.key], true); }
          else if (!asked[p.key] || now - asked[p.key] > 8000) { asked[p.key] = now; send("reset", { to: p.key, from: myKey }); }
        }
      }
      // qarşı tərəf buradadır, amma əlaqə yoxdur — başlayan tərəfdən xahiş et
      for (const [k, m] of Object.entries(people)) {
        if (k === myKey || peers.has(k) || !!m.teacher === !!info.teacher) continue;
        if (myKey < k) createPeer(m, true);
        else if (!asked[k] || now - asked[k] > 8000) { asked[k] = now; send("reset", { to: k, from: myKey }); }
      }
      render();
    }

    // Telefon arxa plana keçəndə kamera/mikrofon dayana bilər — qayıdanda yenidən aç
    async function reviveMedia() {
      try { if (!wakeLock || wakeLock.released) wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
      if (!local) return;
      const deadV = local.getVideoTracks().some((t) => t.readyState === "ended");
      const deadA = local.getAudioTracks().some((t) => t.readyState === "ended");
      if (!deadV && !deadA) return;
      const fresh = await getMedia(deadV);
      if (!fresh) return;
      for (const t of fresh.getTracks()) {
        if ((t.kind === "video" && !deadV) || (t.kind === "audio" && !deadA)) { t.stop(); continue; }
        const old = local.getTracks().find((x) => x.kind === t.kind);
        if (old) local.removeTrack(old);
        local.addTrack(t);
        t.enabled = t.kind === "audio" ? st.mic : st.cam;
        if (t.kind === "video" && st.screen) continue;
        for (const p of peers.values()) {
          const snd = p.pc.getSenders().find((x) => x.track && (x.track === old || (x.track.kind === t.kind && x.track.readyState === "ended")));
          if (snd) snd.replaceTrack(t).catch(() => {});
        }
      }
      if (!st.screen) $("self-v").srcObject = local;
    }

    // Müəllim: mikrofonu açıq olan (ən çox 2) şagirdin səsini digər şagirdlərə ötürür
    function updateRelay() {
      if (!info.teacher) return;
      const speaking = Object.values(people).filter((m) => !m.teacher && m.mic && !m.away && peers.get(m.key)?.stream.getAudioTracks().length).map((m) => m.key);
      relayOwners = relayOwners.map((k) => (speaking.includes(k) ? k : null));
      for (const k of speaking) { if (relayOwners.includes(k)) continue; const i = relayOwners.indexOf(null); if (i < 0) break; relayOwners[i] = k; }
      for (const p of peers.values()) (p.relay || []).forEach((snd, i) => {
        const o = relayOwners[i];
        const tr = o && o !== p.key ? peers.get(o)?.stream.getAudioTracks()[0] || null : null;
        if (snd.track !== tr) snd.replaceTrack(tr).catch(() => {});
      });
    }

    // ---------- Görünüş ----------
    function tileFor(p) {
      if (!p.el) {
        p.el = document.createElement("div");
        p.el.className = "tile";
        p.el.innerHTML = `<video autoplay playsinline muted></video><div class="av"><span></span></div><div class="nm"></div><div class="hand" title="Əli endir">✋</div><div class="warn">Bağlantı zəifdir…</div><div class="away-b">⚠️ Dərsdə deyil</div>`;
        const v = p.el.querySelector("video");
        if (p.vstream) { v.srcObject = p.vstream; v.play().catch(() => {}); }
        p.el.querySelector(".hand").addEventListener("click", () => { if (info.teacher) send("ctl", { cmd: "lower", to: p.key, from: myKey }); });
        if (!info.teacher) p.el.addEventListener("click", () => {   // şagird: müəllimin ekranına toxun — tam ekran, telefon üfüqi
          const v = p.el.querySelector("video");
          if (document.fullscreenElement) return document.exitFullscreen?.();
          const r = p.el.requestFullscreen?.() || v.webkitEnterFullscreen?.();
          Promise.resolve(r).then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
        });
      }
      const m = people[p.key] || p.meta || {};
      const hasVideo = p.stream.getVideoTracks().some((t) => t.readyState === "live" && !t.muted);
      p.el.querySelector(".nm").textContent = `${m.mic === false ? "🔇 " : ""}${m.name || "…"}${m.teacher ? " · müəllim" : ""}`;
      p.el.querySelector(".av span").textContent = initial(m.name);
      p.el.classList.toggle("nocam", !hasVideo || (m.cam === false && !m.screen));   // ekran paylaşanda kamera bağlı olsa da göstər
      p.el.classList.toggle("hand", !!m.hand);
      p.el.classList.toggle("screen", !!m.screen);
      p.el.classList.toggle("bad", !!p.bad);
      p.el.classList.toggle("away", !!m.away && !awayAllowed());
      return p.el;
    }
    const blocked = (e) => { if (e?.name === "NotAllowedError") needUnmute(); };   // yalnız brauzer səsi bloklayanda
    function needUnmute() {
      if ($("unmute")) return;
      const b = document.createElement("button");
      b.id = "unmute"; b.className = "btn btn-primary unmute"; b.textContent = "🔊 Səsi aç";
      b.onclick = () => { document.querySelectorAll("audio[autoplay], .tile video").forEach((x) => x.play().catch(() => {})); b.remove(); };
      document.body.appendChild(b);
    }

    function render() {
      const stage = $("stage"); if (!stage) return;
      const n = Object.keys(people).length || 1;
      $("cnt").textContent = `👥 ${n}`;
      if (info.teacher) {
        let grid = $("grid");
        if (!grid) { stage.innerHTML = '<div class="grid" id="grid"></div><div class="wait hidden" id="empty">Şagirdlərin qoşulmasını gözləyin…<br>Onlar portalda qırmızı "Dərsə qoşul" düyməsini görür.</div>'; grid = $("grid"); }
        const list = [...peers.values()].sort((a, b) => (people[b.key]?.hand - people[a.key]?.hand) || (people[a.key]?.name || "").localeCompare(people[b.key]?.name || "", "az"));
        // elementi yerindən tərpətmirik (video dayanar) — sıranı CSS "order" ilə veririk
        list.forEach((p, i) => { const el = tileFor(p); el.style.order = i; if (el.parentNode !== grid) grid.appendChild(el); });
        $("empty").classList.toggle("hidden", list.length > 0);
      } else {
        const tp = [...peers.values()].find((p) => (people[p.key] || p.meta).teacher);
        let main = $("main");
        if (!main) { stage.innerHTML = '<div id="main" style="height:100%"></div>'; main = $("main"); }
        if (tp) {
          const el = tileFor(tp); el.classList.add("main-tile");
          if (el.parentNode !== main) { main.innerHTML = ""; main.appendChild(el); }
        } else if (!main.querySelector(".wait")) {
          main.innerHTML = '<div class="wait"><div><div style="font-size:2.5rem">⏳</div>Müəllimin qoşulması gözlənilir…</div></div>';
        }
        const mates = Object.values(people).filter((m) => !m.teacher && m.key !== myKey).sort((a, b) => (a.name || "").localeCompare(b.name || "", "az"));
        $("mates").innerHTML = mates.map((m) => `<span class="mate${m.hand ? " hand" : ""}">${m.hand ? "✋ " : ""}${m.mic ? "🎤 " : "🔇 "}${esc(m.name || "")}</span>`).join("");
      }
      const self = $("self");
      self.classList.toggle("nocam", !st.screen && (!st.cam || !local?.getVideoTracks().length));
      self.classList.toggle("screen", st.screen);
      $("b-mic").classList.toggle("off", !st.mic); $("b-mic").textContent = st.mic ? "🎤" : "🔇";
      $("b-cam").classList.toggle("off", !st.cam); $("b-cam").textContent = st.cam ? "📷" : "🚫";
      $("b-mic").disabled = !local?.getAudioTracks().length;
      $("b-cam").disabled = !local?.getVideoTracks().length;
      if ($("b-hand")) $("b-hand").classList.toggle("on", st.hand);
      if ($("b-scr")) $("b-scr").classList.toggle("on", st.screen && !slides);
      if ($("b-file")) $("b-file").classList.toggle("on", !!slides);
      if ($("b-allow")) { $("b-allow").classList.toggle("on", st.allow); $("b-allow").textContent = st.allow ? "🔓" : "🔒"; }
      if ($("perm")) $("perm").hidden = !awayAllowed();
    }

    function updateMe() { ch?.track(myMeta()); people[myKey] = myMeta(); render(); }

    // ---------- Düymələr ----------
    function setMic(on) { st.mic = on; local?.getAudioTracks().forEach((t) => (t.enabled = on)); updateMe(); }
    function setCam(on) { st.cam = on; local?.getVideoTracks().forEach((t) => (t.enabled = on)); updateMe(); }

    // Görüntü kanalını tap (kamera olmasa da, şagirdin kamerası üçün yaranmış kanal ola bilər)
    async function replaceVideo(track) {
      for (const p of peers.values()) {
        if (!p.video) continue;
        const tc = p.pc.getTransceivers().find((t) => t.receiver.track?.kind === "video" && t.currentDirection !== "stopped" && !t.stopped);
        if (tc) {
          try { await tc.sender.replaceTrack(track); } catch (e) { console.warn(e); }
          if (track && !/send/.test(tc.direction)) tc.direction = tc.direction === "inactive" ? "sendonly" : "sendrecv";   // yenidən razılaşma özü başlayır
        } else if (track) p.pc.addTrack(track, local || new MediaStream([track]));
        tuneBitrate(p);
      }
    }
    // PDF / şəkil göstər — telefonda da işləyir
    let slides = null;
    async function startSlides(files) {
      if (!files?.length) return;
      flash("📄 Fayl açılır…");
      let sl;
      try { sl = await (await import("./assets/js/slides.js")).openSlides([...files]); }
      catch (e) { flash("Fayl açılmadı: " + (e.message || e)); return; }
      if (st.screen) await stopScreen();
      slides = sl; screenStream = sl.stream; st.screen = true;
      $("self-v").srcObject = sl.stream;
      await replaceVideo(sl.track);
      showSlideBar(); updateMe();
    }
    function showSlideBar() {
      const b = $("slide-bar"); b.hidden = !slides;
      if (slides) $("sl-n").textContent = `${slides.page} / ${slides.pages}`;
    }
    async function toggleScreen() {
      if (st.screen) return stopScreen();
      try { screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 10 }, audio: false }); }
      catch { return; }
      const t = screenStream.getVideoTracks()[0];
      t.contentHint = "detail";
      t.onended = stopScreen;
      st.screen = true;
      $("self-v").srcObject = screenStream;
      await replaceVideo(t);
      updateMe();
    }
    async function stopScreen() {
      if (!screenStream) return;
      screenStream.getTracks().forEach((t) => t.stop()); screenStream = null; st.screen = false;
      if (slides) { slides.stop(); slides = null; $("slide-bar").hidden = true; }
      $("self-v").srcObject = local;
      await replaceVideo(local?.getVideoTracks()[0] || null);
      updateMe();
    }
    async function flipCam() {
      if (!local?.getVideoTracks().length) return;
      facing = facing === "user" ? "environment" : "user";
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: info.teacher ? 640 : 320 }, height: { ideal: info.teacher ? 480 : 240 } } }).catch(() => null);
      if (!s) return;
      const nt = s.getVideoTracks()[0]; nt.enabled = st.cam;
      const old = local.getVideoTracks()[0];
      local.removeTrack(old); old.stop(); local.addTrack(nt);
      if (!st.screen) { $("self-v").srcObject = local; await replaceVideo(nt); }
      $("self-v").style.transform = facing === "user" ? "" : "none";
    }

    // Müəllim üçün qeyd (chat pəncərəsində qırmızı sətir)
    function sysLog(text, ok = false) {
      const l = $("chat-l"); if (!l) return;
      const t = new Date(Date.now() + 4 * 3600e3).toISOString().slice(11, 16);
      l.insertAdjacentHTML("beforeend", `<div class="m sys${ok ? " ok" : ""}"><b>${t}</b>${esc(text)}</div>`);
      l.scrollTop = l.scrollHeight;
      if (!ok) { alerts++; const b = $("b-alert"); if (b) { b.hidden = false; b.textContent = `⚠️ ${alerts}`; } }
    }
    function beep() {
      try {
        const ac = beep.ac ||= new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = 880; g.gain.setValueAtTime(.15, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .35);
        o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .35);
      } catch {}
      try { navigator.vibrate?.([120, 60, 120]); } catch {}
    }
    function awayAlert(key, m) {
      if (awayAlerted.has(key) || awayAllowed()) return;
      awayAlerted.add(key);
      flash(`⚠️ ${m.name} dərsdən çıxdı — başqa proqrama/sayta keçdi`); beep();
      sysLog(`${m.name} dərs ekranından çıxdı (başqa proqram və ya sayt)`);
    }
    const fmtSec = (sec) => sec >= 60 ? `${Math.floor(sec / 60)} dəq ${sec % 60} san` : `${sec} san`;

    // Şagird: dərs ekranından çıxanda (başqa proqram, Instagram, başqa sayt) müəllimə xəbər
    function goAway() {
      if (awayAt || left || info.teacher || awayAllowed()) return;
      awayAt = Date.now();
      send("away", { from: myKey, away: true });
      updateMe();
    }
    function comeBack() {
      clearTimeout(blurT);
      if (!awayAt || left) return;
      const sec = Math.max(1, Math.round((Date.now() - awayAt) / 1000));
      awayAt = null;
      send("away", { from: myKey, away: false, sec });
      updateMe();
      sb.rpc("video_away", { p_id: info.id, p_sec: sec }).then(() => {}, () => {});
      flash(`⚠️ Dərsdən çıxdığın müəllimə bildirildi (${fmtSec(sec)})`);
    }

    function addChat(m) {
      chatMsgs.push(m);
      const l = $("chat-l"); if (!l) return;
      l.insertAdjacentHTML("beforeend", `<div class="m${m.teacher ? " t" : ""}"><b>${esc(m.name)}</b>${esc(m.text)}</div>`);
      l.scrollTop = l.scrollHeight;
      if ($("chat").hidden && m.key !== myKey) $("b-chat").classList.add("unread");
    }

    async function leave(go = true, bye = true) {
      if (left) return;
      if (bye && ch && !info.teacher) { try { await ch.send({ type: "broadcast", event: "bye", payload: { from: myKey } }); } catch {} }
      left = true;
      for (const k of [...peers.keys()]) dropPeer(k);
      try { await ch?.untrack(); } catch {}
      try { sb.removeChannel(ch); } catch {}
      local?.getTracks().forEach((t) => t.stop()); screenStream?.getTracks().forEach((t) => t.stop());
      try { wakeLock?.release(); } catch {}
      if (go) location.href = info.teacher ? "video-admin.html" : "portal.html";
    }
    async function lessonOver() {
      await leave(false);
      fail("Dərs bitdi. İştirak etdiyin üçün təşəkkürlər! 👋");
    }

    // ---------- Otaq ----------
    async function enterRoom() {
      document.querySelector(".pre button#go")?.setAttribute("disabled", "");
      try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
      const canShare = info.teacher && typeof navigator.mediaDevices?.getDisplayMedia === "function";   // Android telefonlarda yoxdur — orada 📄 var
      app.innerHTML = `<div class="r-wrap">
        <div class="r-top"><span class="r-live">● CANLI</span><span class="t">${esc(info.title)}</span><span class="r-time" id="tm"></span>${info.teacher ? '<button class="r-alert" id="b-alert" hidden title="Xəbərdarlıqlar">⚠️ 0</button>' : ""}<span class="r-cnt" id="cnt">👥 1</span></div>
        ${info.teacher ? "" : '<div class="perm" id="perm" hidden>🔓 Müəllim icazə verib — başqa proqrama və ya sayta keçə bilərsən</div><div class="mates" id="mates"></div>'}
        <div class="r-stage" id="stage-wrap"><div id="stage" style="height:100%"></div>
          <div class="self" id="self"><video id="self-v" autoplay playsinline muted></video></div>
          <div class="slide-bar" id="slide-bar" hidden><button class="cb" id="sl-p" aria-label="Əvvəlki">◀</button><b id="sl-n">1 / 1</b><button class="cb" id="sl-x2" aria-label="Növbəti">▶</button><button class="cb end" id="sl-x">✕ Bağla</button></div>
          <div class="rchat" id="chat" hidden><div class="rchat-h">💬 Dərs chatı <button class="cb" id="chat-x" style="width:34px;height:34px;font-size:1rem" aria-label="Bağla">✕</button></div>
            <div class="rchat-l" id="chat-l"></div>
            <form class="rchat-f" id="chat-f"><input id="chat-i" maxlength="300" placeholder="Mesaj yaz…" autocomplete="off"><button class="btn btn-primary btn-sm">➤</button></form></div>
        </div>
        <div class="r-bar">
          <button class="cb" id="b-mic" title="Mikrofon">🎤</button>
          <button class="cb" id="b-cam" title="Kamera">📷</button>
          <button class="cb" id="b-flip" title="Kameranı çevir" hidden>🔄</button>
          ${info.teacher ? "" : '<button class="cb" id="b-hand" title="Əl qaldır">✋</button>'}
          ${canShare ? '<button class="cb" id="b-scr" title="Ekranı paylaş">🖥</button>' : ""}
          ${info.teacher ? '<button class="cb" id="b-file" title="PDF və ya şəkil göstər">📄</button><input type="file" id="f-file" accept="application/pdf,image/*" multiple hidden>' : ""}
          <button class="cb" id="b-chat" title="Chat">💬<span class="dot"></span></button>
          ${info.teacher ? '<button class="cb" id="b-muteall" title="Hamının səsini bağla">🔕</button><button class="cb" id="b-allow" title="Uşaqlara dərsdən çıxmağa icazə ver (məs. PDF açsınlar)">🔒</button>' : ""}
          <button class="cb end" id="b-end">${info.teacher ? "⏹ Dərsi bitir" : "🚪 Çıx"}</button>
        </div></div>`;
      $("self-v").srcObject = local;
      $("b-mic").onclick = () => setMic(!st.mic);
      $("b-cam").onclick = () => setCam(!st.cam);
      if ($("b-hand")) $("b-hand").onclick = () => { st.hand = !st.hand; updateMe(); if (st.hand) flash("✋ Müəllim əlini qaldırdığını görür"); };
      if ($("b-scr")) $("b-scr").onclick = toggleScreen;
      if ($("b-file")) {
        $("b-file").onclick = () => (slides ? stopScreen() : $("f-file").click());
        $("f-file").onchange = (e) => { const fs = [...e.target.files]; e.target.value = ""; startSlides(fs); };
        $("sl-p").onclick = async () => { await slides?.prev(); showSlideBar(); };
        $("sl-x2").onclick = async () => { await slides?.next(); showSlideBar(); };
        $("sl-x").onclick = stopScreen;
      }
      $("b-chat").onclick = () => { const c = $("chat"); c.hidden = !c.hidden; $("b-chat").classList.remove("unread"); if (!c.hidden) $("chat-i").focus(); };
      $("chat-x").onclick = () => ($("chat").hidden = true);
      $("chat-f").onsubmit = (e) => {
        e.preventDefault();
        const text = $("chat-i").value.trim().slice(0, 300); if (!text) return;
        const m = { key: myKey, name: info.name, teacher: info.teacher, text };
        send("chat", m); addChat(m); $("chat-i").value = "";
      };
      if ($("b-allow")) $("b-allow").onclick = () => {
        st.allow = !st.allow;
        send("ctl", { cmd: "allow", on: st.allow, from: myKey });
        if (st.allow) { awayAlerted.clear(); for (const m of Object.values(people)) if (!m.teacher) m.away = false; }
        flash(st.allow ? "🔓 Uşaqlar başqa proqrama/sayta keçə bilər — xəbərdarlıq gəlməyəcək" : "🔒 İcazə bağlandı — çıxanlar yenə qeyd olunacaq");
        updateMe();
      };
      if ($("b-muteall")) $("b-muteall").onclick = () => { send("ctl", { cmd: "mute", from: myKey }); flash("🔕 Bütün şagirdlərin mikrofonu bağlandı"); };
      $("b-end").onclick = async () => {
        const b = $("b-end");
        if (info.teacher) {
          if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Əminsiniz? Yenə basın"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "⏹ Dərsi bitir"; }, 4000); return; }
          await sb.rpc("admin_video_end", { p_id: info.id });
          send("ctl", { cmd: "end", from: myKey });
        }
        leave();
      };
      navigator.mediaDevices?.enumerateDevices?.().then((ds) => { if (ds.filter((d) => d.kind === "videoinput").length > 1 && local?.getVideoTracks().length) { $("b-flip").hidden = false; $("b-flip").onclick = flipCam; } }).catch(() => {});

      startedAt = new Date(info.starts_at).getTime();
      setInterval(() => { const s = Math.max(0, Math.floor((Date.now() - startedAt) / 1000)); $("tm") && ($("tm").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`); }, 1000);

      ch = sb.channel(`vid-${info.room}`, { config: { broadcast: { self: false }, presence: { key: myKey } } });
      ch.on("broadcast", { event: "sig" }, ({ payload }) => onSig(payload));
      ch.on("broadcast", { event: "chat" }, ({ payload }) => addChat(payload));
      ch.on("broadcast", { event: "ctl" }, async ({ payload }) => {
        const from = people[payload.from];
        if (!from?.teacher || info.teacher) return;
        if (payload.cmd === "mute" && st.mic) { setMic(false); flash("🔇 Müəllim mikrofonunu bağladı"); }
        if (payload.cmd === "lower" && payload.to === myKey) { st.hand = false; updateMe(); }
        if (payload.cmd === "allow") { if (people[payload.from]) people[payload.from].allow = payload.on; flash(payload.on ? "🔓 Müəllim icazə verdi: başqa proqrama/sayta keçə bilərsən" : "🔒 İcazə bitdi — artıq dərsdən çıxma"); render(); }
        if (payload.cmd === "end") { const { data } = await sb.rpc("video_alive", { p_id: info.id }); if (data === false) lessonOver(); }
      });
      ch.on("broadcast", { event: "away" }, ({ payload }) => {
        if (!info.teacher) return;
        const m = people[payload.from]; if (!m) return;
        m.away = payload.away;
        if (payload.away) awayAlert(payload.from, m);
        else if (awayAlerted.delete(payload.from)) sysLog(`${m.name} qayıtdı — ${fmtSec(payload.sec || 0)} kənarda idi`, true);
        render();
      });
      ch.on("broadcast", { event: "bye" }, ({ payload }) => {
        const m = people[payload.from];
        if (info.teacher && m) { m.bye = true; byes.add(payload.from); sysLog(`${m.name} "Çıx" basıb dərsi tərk etdi`); }
        dropPeer(payload.from); render();
      });
      ch.on("broadcast", { event: "reset" }, ({ payload }) => {
        if (payload.to !== myKey || left || !(myKey < payload.from)) return;
        const p = peers.get(payload.from);
        if (p && p.pc.connectionState === "connected" && Date.now() - p.born < 5000) return;
        dropPeer(payload.from);
        createPeer(people[payload.from] || { key: payload.from }, true);
      });
      ch.on("presence", { event: "sync" }, () => {
        const before = people;
        const stNow = ch.presenceState();
        people = {};
        for (const [key, arr] of Object.entries(stNow)) if (arr?.[0]) people[key] = arr[arr.length - 1];
        people[myKey] = myMeta();
        if (info.teacher) for (const [k, m] of Object.entries(people)) if (m.hand && !before[k]?.hand && k !== myKey) { flash(`✋ ${m.name} əl qaldırdı`); try { navigator.vibrate?.(120); } catch {} }
        if (info.teacher) {
          for (const [k, m] of Object.entries(before)) if (!people[k] && !m.teacher && k !== myKey && !byes.has(k) && !left) {
            setTimeout(() => {   // internet bir anlıq kəsilibsə, səhv xəbərdarlıq olmasın
              if (people[k] || byes.has(k) || left || awayAllowed() || peers.get(k)?.pc.connectionState === "connected") return;
              flash(`⚠️ ${m.name} dərsdən çıxdı`); beep(); sysLog(`${m.name} dərsdən çıxdı (səhifəni bağladı və ya interneti kəsildi)`);
            }, 8000);
          }
          for (const [k, m] of Object.entries(people)) {
            if (k === myKey || m.teacher) continue;
            if (m.away) awayAlert(k, m);   // bildiriş itibsə, vəziyyətdən bilirik
            else if (awayAlerted.delete(k)) sysLog(`${m.name} dərsə qayıtdı`, true);
            if (!before[k] && Object.keys(before).length > 0 && !seen.has(k)) sysLog(`${m.name} dərsə qoşuldu`, true);
            seen.add(k);
          }
        }
        for (const p of peers.values()) if (people[p.key]) p.meta = people[p.key];
        syncPeers();
      });
      ch.subscribe(async (status) => {
        if (status === "SUBSCRIBED") { await ch.track(myMeta()); people[myKey] = myMeta(); render(); }   // yenidən qoşulanda da
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") flash("Bağlantı problemi — yenidən qoşulur…");
      });
      render();
      if (!info.teacher) {
        document.addEventListener("visibilitychange", () => (document.hidden ? goAway() : comeBack()));
        addEventListener("blur", () => { clearTimeout(blurT); blurT = setTimeout(goAway, 4000); });   // kompüterdə başqa pəncərəyə keçəndə
        addEventListener("focus", comeBack);
      } else {
        $("b-alert").onclick = () => { $("chat").hidden = false; $("b-chat").classList.remove("unread"); };
      }
      setInterval(watchdog, 4000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reviveMedia(); });
      // Müəllim dərsi admin səhifəsindən bitirərsə
      setInterval(async () => { if (left) return; const { data } = await sb.rpc("video_alive", { p_id: info.id }); if (data === false) lessonOver(); }, 60000);
      addEventListener("pagehide", () => leave(false, false));   // səhifəni bağlayanda müəllimə "dərsdən çıxdı" xəbərdarlığı gedir
    }

    async function prejoin() {
      app.innerHTML = `<div class="pre">
        <h1>🎥 ${esc(info.title)}</h1>
        <div class="self-pre"><video id="pv" autoplay playsinline muted></video><div class="wait hidden" id="pv-no" style="position:absolute;inset:0">📷 Kamera tapılmadı</div></div>
        <div class="row"><button class="cb" id="p-mic">🎤</button><button class="cb" id="p-cam">📷</button></div>
        <button class="btn btn-primary" id="go" style="width:100%">Dərsə daxil ol</button>
        <p class="hint">Brauzer kamera və mikrofon icazəsi istəyəndə <b>"İcazə ver" / "Allow"</b> basın.<br>${info.teacher ? "Dərsi Wi-Fi ilə keçirmək daha yaxşıdır." : "Mikrofonun bağlıdır — danışmaq üçün 🎤 düyməsinə bas.<br><b>⚠️ Dərs vaxtı başqa proqrama (Instagram, oyun və s.) və ya başqa sayta keçsən, müəllimə dərhal xəbər gedir</b> — müəllim icazə verməyibsə."}</p>
      </div>`;
      local = await getMedia(true);
      if (!local) {
        $("pv-no").classList.remove("hidden"); $("pv-no").textContent = "Kamera və mikrofon icazəsi verilmədi — yalnız izləyə və eşidə bilərsən";
      } else {
        $("pv").srcObject = local;
        if (!local.getVideoTracks().length) $("pv-no").classList.remove("hidden");
      }
      if (!info.teacher) st.mic = false;   // sinifdə səs-küy olmasın — danışanda açır
      const upd = () => {
        $("p-mic").classList.toggle("off", !st.mic); $("p-mic").textContent = st.mic ? "🎤" : "🔇";
        $("p-cam").classList.toggle("off", !st.cam); $("p-cam").textContent = st.cam ? "📷" : "🚫";
        local?.getAudioTracks().forEach((t) => (t.enabled = st.mic));
        local?.getVideoTracks().forEach((t) => (t.enabled = st.cam));
      };
      $("p-mic").onclick = () => { st.mic = !st.mic; upd(); };
      $("p-cam").onclick = () => { st.cam = !st.cam; upd(); };
      upd();
      $("go").onclick = enterRoom;
    }

    async function start() {
      if (!configured) return fail("Sayt bazaya qoşulmayıb.", false);
      const me = await getMyProfile().catch(() => null);
      if (!me) { location.href = "login.html"; return; }
      if (!lessonId) return fail("Dərs tapılmadı.");
      if (!window.RTCPeerConnection || !navigator.mediaDevices) return fail("Bu brauzer görüntülü dərsi dəstəkləmir. Chrome və ya Safari-nin yeni versiyası ilə açın.");
      const { data, error } = await sb.rpc("video_join", { p_id: lessonId });
      if (error) return fail(/video_join|function/i.test(error.message) && !/dərs/i.test(error.message) ? "Görüntülü dərs hələ quraşdırılmayıb (40-video-room.sql)." : translateError(error));
      info = data;
      if (info.url) { location.href = info.url; return; }   // köhnə: müəllimin öz linki
      if (!info.uid) return fail("Əvvəlcə 40-video-room.sql faylını Supabase-də işə salın.");
      const { data: ice } = await sb.rpc("video_ice");
      iceServers = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }, { urls: "stun:stun.cloudflare.com:3478" }, ...(Array.isArray(ice) ? ice : [])];
      prejoin();
    }
    start();
  </script>
</body>
