<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panel — Wordora</title>
  <meta name="theme-color" content="#0e1f3d">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wd_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions">
        <a class="btn btn-ghost btn-sm hide-sm" href="portal.html">Şagird görünüşü</a>
        <button class="btn btn-ghost btn-sm" id="logout">Çıxış</button>
      </nav>
    </div>
  </header>

  <main class="container" id="app"><div class="spinner"></div></main>

  <template id="tpl-admin">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h1 style="font-size:1.6rem">Admin panel</h1><p class="muted" id="hello"></p></div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <a class="btn btn-ghost btn-sm" href="attendance.html">✅ Davamiyyət</a>
        <a class="btn btn-ghost btn-sm" href="report.html">📊 Aylıq hesabat</a>
        <button class="btn btn-ghost btn-sm" id="backup-btn">💾 Ehtiyat nüsxə</button>
        <button class="btn btn-ghost btn-sm" id="storage-btn">🧹 Yaddaş</button>
      </div>
    </div>
    <div style="height:12px"></div>

    <div class="group-switch" id="group-switch" role="tablist" aria-label="Bölmə">
      <button type="button" data-group="school">🏫 Məktəb <span class="badge zero" id="gb-school">0</span></button>
      <button type="button" data-group="mag">🎓 Magistratura <span class="badge zero" id="gb-mag">0</span></button>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="st-pending">0</div><div class="l">Təsdiq gözləyir</div></div>
      <div class="stat"><div class="n" id="st-approved">0</div><div class="l">Aktiv şagird</div></div>
      <div class="stat"><div class="n" id="st-blocked">0</div><div class="l">Bloklanıb</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="pending">Yeni qeydiyyatlar <span class="badge" id="badge-pending">0</span></button>
      <button class="tab" data-tab="approved">Şagirdlər</button>
      <button class="tab" data-tab="blocked">Bloklanan / məzun</button>
      <button class="tab" data-tab="tests">Sınaqlar</button>
      <button class="tab" data-tab="hw">📝 Tapşırıqlar <span class="badge zero" id="badge-hw">0</span></button>
      <button class="tab" data-tab="bank">🗂 Sual bankı</button>
      <button class="tab" data-tab="live">🎮 Viktorina</button>
      <button class="tab" data-tab="words">🔤 Sözlər</button>
      <button class="tab" data-tab="msgs">💬 Mesajlar <span class="badge zero" id="badge-msgs">0</span></button>
      <button class="tab" data-tab="viol">Pozuntular <span class="badge zero" id="badge-viol">0</span></button>
      <button class="tab" data-tab="mat">Materiallar</button>
      <button class="tab" data-tab="ann">Elanlar</button>
    </div>

    <section data-panel="pending">
      <div class="toolbar"><button class="btn btn-ghost btn-sm" data-refresh>↻ Yenilə</button></div>
      <div class="people" id="list-pending"></div>
    </section>

    <section data-panel="approved" class="hidden">
      <div class="toolbar">
        <input id="search" placeholder="Ad, istifadəçi adı və ya kod ilə axtar…">
        <select id="class-filter"><option value="">Bütün siniflər</option></select>
        <button class="btn btn-ghost btn-sm" id="year-btn">🎓 Yeni tədris ili</button>
      </div>
      <div class="people" id="list-approved"></div>
    </section>

    <section data-panel="blocked" class="hidden">
      <div class="people" id="list-blocked"></div>
    </section>

    <section data-panel="hw" class="hidden">
      <form class="card" id="hw-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Yeni ev tapşırığı</h2>
        <div class="field"><label for="hw-title">Başlıq</label><input id="hw-title" maxlength="150" placeholder="məs. Unit 3 — Workbook p.24, ex. 1–4" required></div>
        <div class="field"><label for="hw-desc">Tapşırıq</label><textarea id="hw-desc" maxlength="5000" placeholder="Nə etməli olduqlarını yaz…"></textarea></div>
        <div class="row3">
          <div class="field"><label for="hw-due">Son tarix</label><input id="hw-due" type="datetime-local"></div>
          <div class="field"><label for="hw-max">Maksimum bal</label><input id="hw-max" type="number" min="1" step="0.5" value="10"></div>
          <div class="field"><label>&nbsp;</label><label class="chk" style="width:max-content"><input type="checkbox" id="hw-files" checked> Şəkil/PDF əlavə etmək olar</label></div>
        </div>
        <div class="field"><label>Kimlər üçün</label><div class="chk-row" id="hw-classes"></div><div class="hint">Heç biri seçilməsə — bütün məktəb sinifləri (5–11).</div></div>
        <button class="btn btn-primary" type="submit">Paylaş</button>
      </form>
      <div class="grid" id="hw-list"></div>
    </section>

    <section data-panel="bank" class="hidden">
      <form class="card" id="bank-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Banka sual əlavə et</h2>
        <div class="field"><label for="bank-topic">Mövzu</label><input id="bank-topic" list="bank-topics" maxlength="80" placeholder="məs. Present Perfect" required><datalist id="bank-topics"></datalist></div>
        <div class="field">
          <label for="bank-text">Suallar (onlayn sınaq formatında)</label>
          <textarea id="bank-text" style="min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace" placeholder="She has ___ finished her homework.
*already
yet
ever

## Read the text.
Tom lives in London...

Where does Tom live?
*In London
In Paris"></textarea>
          <div class="hint">Hər sual (və ya mətn + onun sualları) ayrıca saxlanılır. Sonra seçib <b>onlayn sınağa</b> və ya <b>canlı viktorinaya</b> köçürə bilərsən.</div>
        </div>
        <button class="btn btn-primary" type="submit">Banka əlavə et</button>
      </form>
      <div class="toolbar">
        <select id="bank-filter" style="width:auto;min-width:220px"><option value="">Bütün mövzular</option></select>
        <button class="btn btn-ghost btn-sm" id="bank-to-test">→ Seçilənlərdən sınaq</button>
        <button class="btn btn-ghost btn-sm" id="bank-to-live">→ Seçilənlərdən viktorina</button>
        <span class="muted small" id="bank-sel">0 seçilib</span>
      </div>
      <div class="grid" id="bank-list"></div>
    </section>

    <section data-panel="msgs" class="hidden">
      <div id="msgs-box"></div>
    </section>

    <section data-panel="words" class="hidden">
      <form class="card" id="words-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Söz əlavə et</h2>
        <div class="field"><label for="words-deck">Dəst (mövzu)</label><input id="words-deck" list="deck-list" maxlength="60" placeholder="məs. Unit 3 — Travel" required><datalist id="deck-list"></datalist></div>
        <div class="field">
          <label for="words-text">Sözlər — hər sətirdə bir söz</label>
          <textarea id="words-text" style="min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace" placeholder="journey | səyahət | Our journey took six hours.
luggage | baqaj
departure | yola düşmə | The departure was delayed."></textarea>
          <div class="hint">Format: <b>söz | tərcümə | nümunə cümlə</b> (nümunə istəyə görə). Hər gün bu sözlərdən biri "Günün sözü" olur.</div>
        </div>
        <div id="words-msg" class="form-msg hidden"></div>
        <button class="btn btn-primary" type="submit">Əlavə et</button>
      </form>
      <div class="grid" id="words-list"></div>
    </section>

    <section data-panel="live" class="hidden">
      <form class="card" id="live-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem" id="live-form-title">Yeni canlı viktorina</h2>
        <div class="row2">
          <div class="field"><label for="live-name">Ad</label><input id="live-name" maxlength="150" placeholder="məs. Present Perfect — isinmə" required></div>
          <div class="field"><label for="live-time">Hər suala vaxt</label>
            <select id="live-time"><option value="10">10 saniyə</option><option value="20" selected>20 saniyə</option><option value="30">30 saniyə</option><option value="45">45 saniyə</option><option value="60">60 saniyə</option></select></div>
        </div>
        <div class="field">
          <label for="live-text">Suallar</label>
          <textarea id="live-text" style="min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace" placeholder="She ___ to school every day.
*goes
go
going

What is the past of &quot;see&quot;?
*saw
seen
seed"></textarea>
          <div class="hint">Birinci sətir — sual, altında 2–4 variant. Düzgün variantın əvvəlinə <b>*</b> qoy. Sualları <b>boş sətirlə</b> ayır.</div>
        </div>
        <div id="live-msg" class="form-msg hidden"></div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn btn-primary" type="submit">Yadda saxla</button>
          <button class="btn btn-ghost hidden" type="button" id="live-cancel">Ləğv et</button>
        </div>
      </form>
      <div class="grid" id="live-list"></div>
    </section>

    <section data-panel="tests" class="hidden">
      <div class="toolbar">
        <a class="btn btn-primary" href="test-edit.html">+ Yeni sınaq</a>
        <button class="btn btn-ghost btn-sm" data-tests-refresh>↻ Yenilə</button>
      </div>
      <div class="grid" id="tests-list"></div>
    </section>

    <section data-panel="viol" class="hidden">
      <div class="card" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Qoruma ayarları</h2>
        <div class="settings-row">
          <div class="field">
            <label for="set-max">Xəbərdarlıq limiti</label>
            <select id="set-max">
              <option value="0">0 — ilk pozuntuda blok</option><option value="1">1 xəbərdarlıq</option>
              <option value="2">2 xəbərdarlıq</option><option value="3">3 xəbərdarlıq</option>
              <option value="4">4 xəbərdarlıq</option><option value="5">5 xəbərdarlıq</option>
            </select>
          </div>
          <div class="field">
            <label for="set-tor">Tor Browser bloku</label>
            <select id="set-tor"><option value="on">Açıq — Tor bloklanır</option><option value="off">Söndürülüb</option></select>
          </div>
          <div class="field">
            <label for="set-rank">Şagird reytinqi</label>
            <select id="set-rank"><option value="on">Açıq — şagirdlər görür</option><option value="off">Gizli</option></select>
          </div>
        </div>
        <div class="weekly-row">
          <div class="field" style="margin:0;flex:1 1 220px">
            <label for="set-weekly">📬 Həftəlik Telegram hesabatı</label>
            <select id="set-weekly"><option value="on">Açıq — hər bazar 20:00</option><option value="off">Bağlı</option></select>
          </div>
          <button class="btn btn-ghost btn-sm" id="weekly-now" type="button">İndi göndər</button>
        </div>
        <p class="muted small" style="margin:.8rem 0 0" id="set-info"></p>
      </div>
      <div class="toolbar">
        <select id="viol-filter">
          <option value="active">Aktiv pozuntular</option>
          <option value="all">Hamısı (ləğv edilənlər də)</option>
        </select>
        <button class="btn btn-ghost btn-sm" data-viol-refresh>↻ Yenilə</button>
      </div>
      <div class="grid" id="viol-list"></div>
      <div class="section-title" style="margin-top:22px"><h2>🚨 Saytda xətalar</h2><span class="muted small">şagirdlərdə baş verən texniki xətalar (son 30)</span></div>
      <div class="card small" id="err-list"><div class="muted">Yüklənir…</div></div>
    </section>

    <section data-panel="mat" class="hidden">
      <form class="card" id="mat-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Yeni material (PDF)</h2>
        <div class="field"><label for="mat-file">PDF fayl</label><input id="mat-file" type="file" accept="application/pdf,.pdf" required><div class="hint">Maksimum 50 MB.</div></div>
        <div class="row2">
          <div class="field"><label for="mat-title">Başlıq</label><input id="mat-title" maxlength="150" required></div>
          <div class="field"><label for="mat-cat">Kateqoriya</label><input id="mat-cat" list="mat-cats" value="Qrammatika qaydaları" maxlength="60" required>
            <datalist id="mat-cats"><option>Qrammatika qaydaları</option><option>Sınaqlar</option><option>Söz siyahıları</option><option>Oxu mətnləri</option><option>Digər</option></datalist></div>
        </div>
        <div class="field"><label for="mat-desc">Qısa izah (istəyə görə)</label><input id="mat-desc" maxlength="1000"></div>
        <div class="field"><label>Kimlər görsün</label><div class="chk-row" id="mat-classes"></div><div class="hint">Heç biri seçilməsə — bütün məktəb sinifləri (5–11) görür.</div></div>
        <div class="row2">
          <div class="field"><label for="mat-until">Bu tarixə qədər açıq (istəyə görə)</label><input id="mat-until" type="datetime-local"></div>
          <div class="field"><label>&nbsp;</label>
            <div class="chk-row">
              <label class="chk"><input type="checkbox" id="mat-pub" checked> Dərhal paylaş</label>
              <label class="chk"><input type="checkbox" id="mat-dl" checked> Şagirdlər yükləyə bilsin</label>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" id="mat-submit">Yüklə</button>
        <div class="progress hidden" id="mat-progress"><div></div></div>
      </form>
      <div class="grid" id="mat-list"></div>
    </section>

    <section data-panel="ann" class="hidden">
      <form class="card" id="ann-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Yeni elan</h2>
        <div class="field"><label for="ann-title">Başlıq</label><input id="ann-title" maxlength="150" required></div>
        <div class="field"><label for="ann-body">Mətn</label><textarea id="ann-body" maxlength="5000" required></textarea></div>
        <div class="field"><label for="ann-class">Kimə</label><select id="ann-class"><option value="">Bütün siniflər</option></select></div>
        <button class="btn btn-primary" type="submit">Elanı paylaş</button>
      </form>
      <div class="grid" id="ann-list"></div>
    </section>
  </template>

  <script type="module">
    import { sb, configured, getMyProfile, logout, esc, formatDate, classLabel, toast, translateError, CLASSES, showConfigWarning, MAG_CLASS, SCHOOL_CLASSES, isMag } from "./assets/js/app.js";

    // ---- Bölmə: məktəb və ya magistratura (şagirdlər, materiallar, elanlar, tapşırıqlar ayrıdır) ----
    let group = "school";
    try { group = localStorage.getItem("wd_admin_group") === "mag" ? "mag" : "school"; } catch {}
    const inGroup = (cls) => (group === "mag" ? isMag(cls) : !isMag(cls));
    const itemInGroup = (targets) => {
      const t = targets?.length ? targets : null;
      return group === "mag" ? !!t?.includes(MAG_CLASS) : !t || t.some((c) => !isMag(c));
    };
    const groupTargets = (checked) => (group === "mag" ? [MAG_CLASS] : checked.length ? checked : null);
    import { VIOLATION_LABELS } from "./assets/js/guard.js";
    import { parseLive, toLiveText } from "./assets/js/live-common.js";
    import { downloadXlsx } from "./assets/js/xlsx-lite.js";

    showConfigWarning();
    const app = document.getElementById("app");
    document.getElementById("logout").addEventListener("click", logout);

    let people = [];

    function personCard(p) {
      const meta = `
        <span>@${esc(p.username)}</span>
        <span>${esc(classLabel(p.class_name))}</span>
        <span class="code" title="Şəxsi gizli kod">${esc(p.student_code)}</span>
        <span>${formatDate(p.created_at)}</span>
        ${p.warnings > 0 ? `<span class="warn-count">⚠️ ${p.warnings} xəbərdarlıq</span>` : ""}`;
      let actions = "";
      if (p.status === "pending") {
        actions = `
          <button class="btn btn-ok btn-sm" data-act="approved" data-id="${p.id}">✓ Təsdiqlə</button>
          <button class="btn btn-bad btn-sm" data-act="rejected" data-id="${p.id}">✕ Rədd et</button>`;
      } else if (p.status === "approved") {
        actions = `
          ${p.warnings > 0 ? `<button class="btn btn-ghost btn-sm" data-vreset="${p.id}">Xəbərdarlığı sıfırla</button>` : ""}
          <a class="btn btn-ghost btn-sm" href="student.html?id=${p.id}">📈 Profil</a>
          <button class="btn btn-ghost btn-sm" data-pwd="${p.id}">🔑 Şifrə</button>
          <button class="btn btn-ghost btn-sm" data-act="class" data-id="${p.id}">Sinfi dəyiş</button>
          <button class="btn btn-bad btn-sm" data-act="blocked" data-id="${p.id}">🔒 Blokla</button>
          <button class="btn btn-bad btn-sm" data-act="delete" data-id="${p.id}" title="Hesabı və bütün nəticələri tamamilə sil">🗑 Sil</button>`;
      } else {
        actions = `${p.status === "blocked" ? `<a class="btn btn-ghost btn-sm" href="student.html?id=${p.id}">📈 Profil</a><button class="btn btn-ghost btn-sm" data-pwd="${p.id}">🔑 Şifrə</button>` : ""}
          <button class="btn btn-ok btn-sm" data-act="approved" data-id="${p.id}">${p.status === "blocked" ? "🔓 Blokdan çıxar" : p.status === "archived" ? "↩ Bərpa et" : "✓ Təsdiqlə"}</button>
          <button class="btn btn-bad btn-sm" data-act="delete" data-id="${p.id}" title="Hesabı və bütün nəticələri tamamilə sil">🗑 Sil</button>`;
      }
      const pill = p.status === "blocked" ? '<span class="pill blocked">Bloklanıb</span>'
                 : p.status === "rejected" ? '<span class="pill rejected">Rədd edilib</span>'
                 : p.status === "archived" ? '<span class="pill arch">🎓 Məzun</span>' : "";
      return `
        <div class="person">
          <div class="who">
            <div class="name">${esc(p.full_name)} ${pill}</div>
            <div class="meta">${meta}</div>
            ${p.status_note ? `<div class="note">Qeyd: ${esc(p.status_note)}</div>` : ""}
          </div>
          <div class="actions">${actions}</div>
        </div>`;
    }

    function render() {
      const all = people.filter((p) => p.role === "student");
      for (const [g, pred] of [["school", (p) => !isMag(p.class_name)], ["mag", (p) => isMag(p.class_name)]]) {
        const n = all.filter((p) => p.status === "pending" && pred(p)).length;
        const b = document.getElementById(`gb-${g}`); b.textContent = n; b.classList.toggle("zero", !n);
      }
      const by = (s) => all.filter((p) => s.includes(p.status) && inGroup(p.class_name));
      const pending = by(["pending"]);
      const approved = by(["approved"]);
      const blocked = by(["blocked", "rejected", "archived"]);

      document.getElementById("st-pending").textContent = pending.length;
      document.getElementById("st-approved").textContent = approved.length;
      document.getElementById("st-blocked").textContent = by(["blocked"]).length;
      const badge = document.getElementById("badge-pending");
      badge.textContent = pending.length;
      badge.classList.toggle("zero", pending.length === 0);

      document.getElementById("list-pending").innerHTML = pending.length
        ? pending.map(personCard).join("")
        : '<div class="card empty">Yeni qeydiyyat yoxdur.</div>';

      const q = document.getElementById("search").value.trim().toLowerCase();
      const cls = document.getElementById("class-filter").value;
      const filtered = approved.filter((p) =>
        (!cls || p.class_name === cls) &&
        (!q || p.full_name.toLowerCase().includes(q) || p.username.includes(q) || p.student_code.toLowerCase().includes(q)));
      document.getElementById("list-approved").innerHTML = filtered.length
        ? filtered.map(personCard).join("")
        : '<div class="card empty">Şagird tapılmadı.</div>';

      document.getElementById("list-blocked").innerHTML = blocked.length
        ? blocked.map(personCard).join("")
        : '<div class="card empty">Bloklanan və ya rədd edilən yoxdur.</div>';
    }

    async function loadPeople() {
      const { data, error } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
      if (error) { toast(translateError(error), "err"); return; }
      people = data;
      render();
    }

    async function setStatus(id, status) {
      const p = people.find((x) => x.id === id);
      let note = null;
      if (status === "blocked") {
        note = prompt(`${p.full_name} bloklanır. Səbəb (şagird görəcək, boş saxlaya bilərsən):`, "");
        if (note === null) return;
      } else if (status === "rejected") {
        if (!confirm(`${p.full_name} — qeydiyyat rədd edilsin?`)) return;
      }
      const { error } = await sb.rpc("admin_set_status", { p_user: id, p_status: status, p_note: note || null });
      if (error) { toast(translateError(error), "err"); return; }
      toast(status === "approved" ? "Təsdiqləndi ✓" : status === "blocked" ? "Bloklandı" : "Rədd edildi", "ok");
      loadPeople();
    }

    // Şagirdi saytdan tamamilə silmək
    async function deleteStudent(id) {
      const p = people.find((x) => x.id === id);
      if (!p) return;
      if (!confirm(`${p.full_name} saytdan TAMAMİLƏ silinsin?\n\nHesabı, bütün sınaq nəticələri, ev tapşırıqları, mesajları və davamiyyəti silinəcək. Bunu geri qaytarmaq olmur.\n\nYalnız girişini bağlamaq istəyirsənsə, "Blokla" düyməsindən istifadə et.`)) return;
      const typed = prompt(`Təsdiq üçün şagirdin istifadəçi adını yaz: ${p.username}`);
      if (typed === null) return;
      if (typed.trim().toLowerCase().replace(/^@/, "") !== p.username) return toast("İstifadəçi adı uyğun gəlmədi — silinmədi", "err");
      // ev tapşırığı fayllarını da sil
      try {
        const { data: subs } = await sb.from("hw_submissions").select("files").eq("user_id", id);
        const files = (subs || []).flatMap((x) => x.files || []);
        if (files.length) await sb.storage.from("homework").remove(files);

      const { error } = await sb.rpc("admin_delete_student", { p_user: id });
      if (error) return toast(/function|schema cache/i.test(error.message || "") ? "Əvvəlcə 15-delete-retake.sql faylını Supabase-də işə sal" : translateError(error), "err");
      toast(`${p.full_name} silindi`, "ok");
      loadPeople();
    }

    const BACKUP_TABLES = ["profiles", "announcements", "materials", "material_views", "violations", "tests", "test_keys",
                           "attempts", "live_quizzes", "live_sessions", "live_players", "live_answers", "words", "attendance",

    async function fetchAll(table) {
      const out = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await sb.from(table).select("*").range(from, from + 999);
        if (error) { if (from === 0) return null; break; }
        out.push(...data);
        if (data.length < 1000) break;
      }
      return out;
    }

    // ================= Yaddaş (pulsuz plan: fayllar 1 GB, baza 500 MB) =================
    const LIMIT_FILES = 1024 ** 3, LIMIT_DB = 500 * 1024 ** 2;
    const BUCKET_LABELS = { materials: "Materiallar", tests: "Sınaq PDF / audio", homework: "Ev tapşırıqları" };
    const mb = (b) => (b >= 1024 ** 3 ? `${(b / 1024 ** 3).toFixed(2)} GB` : `${(b / 1024 ** 2).toFixed(b < 10 * 1024 ** 2 ? 1 : 0)} MB`);
    function usageBar(label, used, limit) {
      const pct = Math.min(100, Math.round((used / limit) * 100));
      const color = pct >= 85 ? "var(--bad)" : pct >= 65 ? "var(--gold)" : "var(--ok)";
      return `<div class="usage"><div class="usage-row"><b>${label}</b><span>${mb(used)} / ${mb(limit)} · <b>${pct}%</b></span></div>
        <div class="bar"><div style="width:${Math.max(pct, 1)}%;background:${color}"></div></div></div>`;
    }

            removed = removed.concat(chunk);

    // ================= Şifrə sıfırlama =================
    function genPassword() {
      const L = "abcdefghjkmnpqrstuvwxyz", D = "23456789";
      const pick = (s) => s[crypto.getRandomValues(new Uint32Array(1))[0] % s.length];
      return Array.from({ length: 4 }, () => pick(L)).join("") + Array.from({ length: 4 }, () => pick(D)).join("");
    }

    async function resetPassword(id) {
      const p = people.find((x) => x.id === id);

      if (pwd === null) return;
      if (pwd.length < 8 || !/[a-zA-Z]/.test(pwd) || !/\d/.test(pwd)) return toast("Şifrə ən azı 8 simvol, hərf və rəqəm olmalıdır", "err");
      const { error } = await sb.rpc("admin_set_password", { p_user: id, p_password: pwd });

    }

        else pill = '<span class="pill live">Açıqdır</span>';

        return `

                ${t.starts_at ? `<span>Başlama: ${formatDate(t.starts_at)}</span>` : ""}

              </div>

            </div>
            <div style="display:flex;gap:.4rem;flex-wrap:wrap">
              <a class="btn btn-primary btn-sm" href="test-results.html?id=${t.id}">Nəticələr</a>

              <button class="btn btn-bad btn-sm" data-test="delete" data-id="${t.id}">Sil</button>

      if (action === "pub") {
        const { error } = await sb.from("tests").update({ is_published: !t.is_published }).eq("id", id);

        toast(t.is_published ? "Sınaq gizlədildi" : "Sınaq paylaşıldı", "ok");

      }
      if (action === "copy") {
        const { data: k } = await sb.from("test_keys").select("answers, variants").eq("test_id", id).maybeSingle();
        const { id: _, created_at, ...rest } = t;
        const { data: n, error } = await sb.from("tests")
          .insert({ ...rest, title: `${t.title} (kopya)`, is_published: false, results_released: false, starts_at: null, ends_at: null })
          .select("id").single();
        if (error) return toast(translateError(error), "err");
        await sb.from("test_keys").insert({ test_id: n.id, answers: k?.answers || {}, ...(k?.variants ? { variants: k.variants } : {}) });
        if (t.content?.mode === "online") {
          const { data: on } = await sb.from("test_online").select("questions, passages, source").eq("test_id", id).maybeSingle();
          if (on) await sb.from("test_online").insert({ test_id: n.id, ...on });
        }
        toast("Kopyalandı — indi redaktə et", "ok");
        location.href = `test-edit.html?id=${n.id}`;
        return;

      if (action === "delete") {
        if (!confirm(`"${t.title}" və bütün nəticələri silinsin? Bunu geri qaytarmaq olmur.`)) return;
        const { error } = await sb.from("tests").delete().eq("id", id);
        if (error) return toast(translateError(error), "err");
        if (t.pdf_path) {
          const { count } = await sb.from("tests").select("id", { count: "exact", head: true }).eq("pdf_path", t.pdf_path);
          if (!count) await sb.storage.from("tests").remove([t.pdf_path]);
        }
        // variantların faylları (kopyalarda istifadə olunmursa)

          try {
            const { count: c1 } = await sb.from("tests").select("id", { count: "exact", head: true }).contains("variants", [{ pdf_path: pth }]);
            const { count: c2 } = await sb.from("tests").select("id", { count: "exact", head: true }).contains("variants", [{ audio_path: pth }]);
            if (!c1 && !c2) await sb.storage.from("tests").remove([pth]);
          } catch {}
        }
        toast("Silindi", "ok");
        loadTests();
      }

      if (onlyActive) q = q.eq("cancelled", false);
      const { data, error } = await q;
      if (error) { box.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      updateViolBadge(data);
      if (!data.length) { box.innerHTML = '<div class="card empty">Pozuntu yoxdur 👍</div>'; return; }
      box.innerHTML = data.map((v) => {
        const p = v.profiles || {};
        const tag = v.cancelled ? '<span class="pill off">Ləğv edilib</span>'
                  : !v.counted ? '<span class="pill off">Sayılmayıb</span>'
                  : p.status === "blocked" ? '<span class="pill blocked">Bloklanıb</span>' : "";
        return `
          <div class="card viol ${v.cancelled ? "cancelled" : ""}">
            <div style="min-width:0">
              <div class="what">${esc(VIOLATION_LABELS[v.kind] || v.kind)} ${tag}</div>
              <div><b>${esc(p.full_name || "—")}</b> <span class="muted small">${esc(classLabel(p.class_name))} · ${esc(p.student_code || "")} · cəmi xəbərdarlıq: ${p.warnings ?? 0}</span></div>
              <div class="when">${formatDate(v.created_at)}${v.page ? " · " + esc(v.page) : ""}${v.details ? " · " + esc(v.details) : ""}${v.ip ? " · IP " + esc(v.ip) : ""}</div>
            </div>
            <div style="display:flex;gap:.4rem;flex-wrap:wrap">
              ${!v.cancelled && v.counted ? `<button class="btn btn-ghost btn-sm" data-vcancel="${v.id}" title="Səhv siqnal idisə">Ləğv et</button>` : ""}
            </div>
          </div>`;
      }).join("");
    }

    function updateViolBadge(rows) {
      const dayAgo = Date.now() - 86400000;
      const n = rows.filter((v) => !v.cancelled && v.counted && new Date(v.created_at).getTime() > dayAgo).length;
      const b = document.getElementById("badge-viol");
      b.textContent = n; b.classList.toggle("zero", n === 0);
    }

    async function cancelViolation(id) {
      if (!confirm("Bu pozuntu ləğv edilsin? Şagirdin xəbərdarlıq sayı bir azalacaq.")) return;
      const { error } = await sb.rpc("admin_cancel_violation", { p_id: Number(id) });
      if (error) return toast(translateError(error), "err");
      toast("Ləğv edildi", "ok");
      loadViolations(); loadPeople();
    }

    async function resetWarnings(id) {
      const p = people.find((x) => x.id === id);
      if (!confirm(`${p?.full_name || "Şagird"} — bütün xəbərdarlıqlar sıfırlansın?`)) return;
      const { error } = await sb.rpc("admin_reset_warnings", { p_user: id });
      if (error) return toast(translateError(error), "err");
      toast("Xəbərdarlıqlar sıfırlandı", "ok");
      loadPeople();
    }

    // ================= Materiallar =================
    let materials = [];
    const fmtSize = (b) => !b ? "" : b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";

    async function loadMaterials() {
      const box = document.getElementById("mat-list");
      let [{ data, error }, { data: views }] = await Promise.all([
        sb.from("materials").select("*").order("created_at", { ascending: false }),
        sb.from("material_views").select("material_id, user_id, kind"),
      ]);
      if (error) { box.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      materials = data;
      data = data.filter((m) => itemInGroup(m.target_classes));
      const stats = {};
      for (const v of views || []) {
        const s = (stats[v.material_id] ||= { total: 0, dl: 0, users: new Set() });
        if (v.kind === "download") s.dl++; else s.total++;
        s.users.add(v.user_id);
      }
      if (!data.length) { box.innerHTML = '<div class="card empty">Hələ material yüklənməyib.</div>'; return; }
      const now = Date.now();
      box.innerHTML = data.map((m) => {
        const s = stats[m.id] || { total: 0, dl: 0, users: new Set() };
        const dlPill = m.allow_download ? '<span class="pill on">⬇ Yüklənə bilər</span>' : '<span class="pill off">Yalnız baxış</span>';
        const expired = m.available_until && new Date(m.available_until).getTime() < now;
        const pill = !m.is_published ? '<span class="pill off">Gizli</span>'
                   : expired ? '<span class="pill off">Müddəti bitib</span>' : '<span class="pill on">Açıq</span>';
        const classes = m.target_classes?.length ? m.target_classes.map(classLabel).join(", ") : "Bütün siniflər";
        return `
          <article class="card" id="m-${m.id}">
            <div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:start">
              <div style="min-width:0">
                <h3 style="font-size:1.05rem;margin-bottom:.2rem">${esc(m.title)} ${pill} ${dlPill}</h3>
                <div class="muted small">${esc(m.category)} · ${esc(classes)} · ${fmtSize(m.file_size)}${m.available_until ? " · " + formatDate(m.available_until) + " tarixinə qədər" : ""}</div>
                ${m.description ? `<div class="small" style="margin-top:.3rem">${esc(m.description)}</div>` : ""}
                <div class="small" style="margin-top:.4rem"><b>${s.users.size}</b> şagird · <b>${s.total}</b> baxış · <b>${s.dl}</b> yükləmə</div>
              </div>
              <div class="actions" style="display:flex;gap:.4rem;flex-wrap:wrap">
                <button class="btn btn-primary btn-sm" data-mat="edit" data-id="${m.id}">✏️ Redaktə et</button>
                <button class="btn btn-ghost btn-sm" data-mat="views" data-id="${m.id}">Kim baxıb</button>
                <a class="btn btn-ghost btn-sm" href="material.html?id=${m.id}" target="_blank" rel="noopener">Bax</a>
                <button class="btn btn-warn btn-sm" data-mat="toggle" data-id="${m.id}">${m.is_published ? "Gizlət" : "Paylaş"}</button>
                <button class="btn btn-ghost btn-sm" data-mat="dl" data-id="${m.id}">${m.allow_download ? "Yükləməni bağla" : "Yükləməni aç"}</button>
                <button class="btn btn-bad btn-sm" data-mat="delete" data-id="${m.id}">Sil</button>
              </div>
            </div>
            <div class="views hidden"></div>
          </article>`;
      }).join("");
    }

    async function uploadMaterial(e) {
      e.preventDefault();
      const file = document.getElementById("mat-file").files[0];
      const title = document.getElementById("mat-title").value.trim();
      const category = document.getElementById("mat-cat").value.trim() || "Digər";
      const description = document.getElementById("mat-desc").value.trim() || null;
      const target_classes = groupTargets([...document.querySelectorAll("#mat-classes input:checked")].map((i) => i.value));
      const untilVal = document.getElementById("mat-until").value;
      const is_published = document.getElementById("mat-pub").checked;
      const allow_download = document.getElementById("mat-dl").checked;

      if (!file) return toast("PDF faylı seç", "err");
      if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) return toast("Yalnız PDF fayl yükləmək olar", "err");
      if (file.size > 50 * 1048576) return toast("Fayl 50 MB-dan böyükdür", "err");
      if (!title) return toast("Başlıq yaz", "err");

      const btn = document.getElementById("mat-submit");
      const prog = document.getElementById("mat-progress");
      btn.disabled = true; btn.textContent = "Yüklənir…";
      prog.classList.remove("hidden"); prog.firstElementChild.style.width = "35%";

      const path = `${crypto.randomUUID()}.pdf`;
      try {
        const up = await sb.storage.from("materials").upload(path, file, { contentType: "application/pdf", upsert: false });
        if (up.error) throw up.error;
        prog.firstElementChild.style.width = "85%";
        const ins = await sb.from("materials").insert({
          title, category, description, file_path: path, file_size: file.size,
          target_classes: target_classes.length ? target_classes : null,
          available_until: untilVal ? new Date(untilVal).toISOString() : null,
          is_published, allow_download,
        });
        if (ins.error) { await sb.storage.from("materials").remove([path]); throw ins.error; }
        prog.firstElementChild.style.width = "100%";
        toast("Material yükləndi ✓", "ok");
        e.target.reset();
        document.getElementById("mat-cat").value = category;
        loadMaterials();
      } catch (err) {
        toast(translateError(err), "err");
      } finally {
        btn.disabled = false; btn.textContent = "Yüklə";
        setTimeout(() => { prog.classList.add("hidden"); prog.firstElementChild.style.width = "0"; }, 600);
      }
    }

    // Materialı redaktə et: ad, kateqoriya, izah, kimlər görsün, müddət, paylaşma və yükləmə
    function editMaterial(m) {
      const pad = (n) => String(n).padStart(2, "0");
      const local = (iso) => { if (!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
      const t = m.target_classes || [];
      const box = document.createElement("div");
      box.className = "wd-modal";
      box.innerHTML = `<form class="wd-modal-box" style="border-top-color:var(--violet);text-align:left;max-width:540px;max-height:92vh;overflow:auto">
        <h2 style="font-size:1.2rem;margin-bottom:12px">✏️ Materialı redaktə et</h2>
        <div class="field"><label for="em-title">Başlıq</label><input id="em-title" maxlength="150" required value="${esc(m.title)}"></div>
        <div class="field"><label for="em-cat">Kateqoriya</label><input id="em-cat" list="mat-cats" maxlength="60" required value="${esc(m.category)}"></div>
        <div class="field"><label for="em-desc">Qısa izah</label><input id="em-desc" maxlength="1000" value="${esc(m.description || "")}"></div>
        <div class="field"><label>Kimlər görsün</label>
          <div class="chk-row">${SCHOOL_CLASSES.map((c) => `<label class="chk"><input type="checkbox" name="em-cls" value="${esc(c)}" ${t.includes(c) ? "checked" : ""}> ${esc(classLabel(c))}</label>`).join("")}</div>
          <label class="chk em-mag" style="width:max-content;margin-top:8px"><input type="checkbox" name="em-cls" value="${esc(MAG_CLASS)}" ${t.includes(MAG_CLASS) ? "checked" : ""}> 🎓 Magistrantlar</label>
          <div class="hint" id="em-hint"></div></div>
        <div class="field"><label for="em-until">Bu tarixə qədər açıq (boş = müddətsiz)</label><input id="em-until" type="datetime-local" value="${local(m.available_until)}"></div>
        <div class="chk-row" style="margin-bottom:14px">
          <label class="chk"><input type="checkbox" id="em-pub" ${m.is_published ? "checked" : ""}> Paylaşılıb (görünür)</label>
          <label class="chk"><input type="checkbox" id="em-dl" ${m.allow_download ? "checked" : ""}> Yükləmək olar</label></div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn btn-primary" type="submit">Yadda saxla</button>
          <button class="btn btn-ghost" type="button" data-k="x">Ləğv et</button></div>
      </form>`;
      document.body.appendChild(box);
      const form = box.firstElementChild;
      const hint = () => {
        const sel = [...form.querySelectorAll('input[name="em-cls"]:checked')].map((i) => i.value);
        const school = sel.filter((c) => !isMag(c)), mag = sel.includes(MAG_CLASS);
        form.querySelector("#em-hint").textContent =
          !sel.length ? "Heç biri seçilməyib → bütün məktəb sinifləri (5–11) görür, magistrantlar görmür."
          : `Görəcəklər: ${[...school.map(classLabel), ...(mag ? ["magistrantlar"] : [])].join(", ")}.`;
      };
      hint();
      form.addEventListener("change", hint);
      box.addEventListener("click", (e) => { if (e.target === box || e.target.closest('[data-k="x"]')) box.remove(); });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const sel = [...form.querySelectorAll('input[name="em-cls"]:checked')].map((i) => i.value);
        const until = form.querySelector("#em-until").value;
        const row = {
          title: form.querySelector("#em-title").value.trim(),
          category: form.querySelector("#em-cat").value.trim() || "Digər",
          description: form.querySelector("#em-desc").value.trim() || null,
          target_classes: sel.length ? sel : null,
          available_until: until ? new Date(until).toISOString() : null,
          is_published: form.querySelector("#em-pub").checked,
          allow_download: form.querySelector("#em-dl").checked,
        };
        if (!row.title) return toast("Başlıq yaz", "err");
        const { error } = await sb.from("materials").update(row).eq("id", m.id);
        if (error) return toast(translateError(error), "err");
        box.remove();
        const stays = itemInGroup(row.target_classes);
        toast(stays ? "Yadda saxlanıldı ✓" : `Yadda saxlanıldı ✓ — material indi "${group === "mag" ? "🏫 Məktəb" : "🎓 Magistratura"}" bölməsində görünür`, "ok");
        loadMaterials();
      });
    }

    async function materialAction(action, id, btn) {
      const m = materials.find((x) => x.id === id);
      if (!m) return;
      if (action === "edit") return editMaterial(m);
      if (action === "toggle") {
        const { error } = await sb.from("materials").update({ is_published: !m.is_published }).eq("id", id);
        if (error) return toast(translateError(error), "err");
        toast(m.is_published ? "Material gizlədildi" : "Material paylaşıldı", "ok");
        return loadMaterials();
      }
      if (action === "dl") {
        const { error } = await sb.from("materials").update({ allow_download: !m.allow_download }).eq("id", id);
        if (error) return toast(translateError(error), "err");
        toast(m.allow_download ? "Yükləmə bağlandı — yalnız baxış" : "Yükləmə açıldı", "ok");
        return loadMaterials();
      }
      if (action === "delete") {
        if (!confirm(`"${m.title}" tamamilə silinsin? Bunu geri qaytarmaq olmur.`)) return;
        const rm = await sb.storage.from("materials").remove([m.file_path]);
        if (rm.error) return toast(translateError(rm.error), "err");
        const { error } = await sb.from("materials").delete().eq("id", id);
        if (error) return toast(translateError(error), "err");
        toast("Silindi", "ok");
        return loadMaterials();
      }
      if (action === "views") {
        const box = document.querySelector(`#m-${id} .views`);
        if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
        box.classList.remove("hidden");
        box.innerHTML = '<div class="muted">Yüklənir…</div>';
        const { data, error } = await sb
          .from("material_views")
          .select("viewed_at, user_id, kind, profiles(full_name, class_name, student_code, role)")
          .eq("material_id", id)
          .order("viewed_at", { ascending: false })
          .limit(1000);
        if (error) { box.innerHTML = esc(translateError(error)); return; }
        const byUser = new Map();
        for (const v of data) {
          if (v.profiles?.role === "admin") continue;
          const u = byUser.get(v.user_id) || { p: v.profiles, n: 0, dl: 0, last: v.viewed_at };
          if (v.kind === "download") u.dl++; else u.n++;
          byUser.set(v.user_id, u);
        }
        if (!byUser.size) { box.innerHTML = '<div class="muted">Hələ heç bir şagird baxmayıb.</div>'; return; }
        box.innerHTML = `<table>${[...byUser.values()].map((u) => `
          <tr>
            <td><b>${esc(u.p?.full_name || "—")}</b> <span class="muted">${esc(classLabel(u.p?.class_name))}</span> <span class="code" style="font-family:ui-monospace,monospace;font-size:.78rem;color:var(--indigo)">${esc(u.p?.student_code || "")}</span></td>
            <td class="n">👁 ${u.n} · ⬇ ${u.dl} · son: ${formatDate(u.last)}</td>
          </tr>`).join("")}</table>`;
      }
    }

    function setupGroup() {
      const opts = (list) => list.map((c) => `<option value="${esc(c)}">${esc(classLabel(c))}</option>`).join("");
      const chks = (list) => list.map((c) => `<label class="chk"><input type="checkbox" value="${esc(c)}"> ${esc(classLabel(c))}</label>`).join("");
      const sw = document.getElementById("group-switch");
      const apply = () => {
        const mag = group === "mag";
        document.body.dataset.group = group;
        sw.querySelectorAll("[data-group]").forEach((b) => b.classList.toggle("on", b.dataset.group === group));
        const cf = document.getElementById("class-filter");
        cf.innerHTML = '<option value="">Bütün siniflər</option>' + opts(SCHOOL_CLASSES);
        cf.classList.toggle("hidden", mag);
        document.getElementById("ann-class").innerHTML = '<option value="">Bütün siniflər</option>' + opts(SCHOOL_CLASSES);
        document.getElementById("mat-classes").innerHTML = chks(SCHOOL_CLASSES);
        document.getElementById("hw-classes").innerHTML = chks(SCHOOL_CLASSES);
        for (const id of ["ann-class", "mat-classes", "hw-classes"]) {
          const field = document.getElementById(id).closest(".field");
          field.classList.toggle("hidden", mag);
          let note = field.parentElement.querySelector(`.mag-note[data-for="${id}"]`);
          if (!note) {
            note = document.createElement("div"); note.className = "mag-note hint"; note.dataset.for = id;
            note.textContent = "🎓 Yalnız magistrantlar görəcək.";
            field.after(note);
          }
          note.classList.toggle("hidden", !mag);
        }
        render();
        loadAnnouncements(); loadMaterials();
        if (hws.length || hwOpen) loadHw();
      };
      sw.addEventListener("click", (e) => {
        const b = e.target.closest("[data-group]"); if (!b || b.dataset.group === group) return;
        group = b.dataset.group;
        try { localStorage.setItem("wd_admin_group", group); } catch {}
        hwOpen = null;
        apply();
      });
      setupGroup.apply = apply;
    }

    async function start() {
      if (!configured) { app.innerHTML = '<div class="card empty">Sayt hələ bazaya qoşulmayıb.</div>'; return; }
      let me;
      try { me = await getMyProfile(); } catch (err) { app.innerHTML = `<div class="card empty">${esc(translateError(err))}</div>`; return; }
      if (!me) { location.href = "login.html"; return; }
      if (me.role !== "admin" || me.status !== "approved") { location.href = "portal.html"; return; }

      app.innerHTML = document.getElementById("tpl-admin").innerHTML;
      document.getElementById("hello").textContent = `Xoş gəldin, ${me.full_name}.`;

      setupGroup();
      document.getElementById("mat-file").addEventListener("change", (e) => {
        const f = e.target.files[0], t = document.getElementById("mat-title");
        if (f && !t.value) t.value = f.name.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ");
      });
      document.getElementById("mat-form").addEventListener("submit", uploadMaterial);

      // Tablar
      app.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
        app.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
        app.querySelectorAll("[data-panel]").forEach((s) => s.classList.toggle("hidden", s.dataset.panel !== t.dataset.tab));
        if (t.dataset.tab === "ann") loadAnnouncements();
        if (t.dataset.tab === "mat") loadMaterials();
        if (t.dataset.tab === "viol") { loadViolations(); loadSettings(); loadErrors(); }
        if (t.dataset.tab === "tests") loadTests();
        if (t.dataset.tab === "live") loadLive();
        if (t.dataset.tab === "words") loadWords();
        if (t.dataset.tab === "hw") loadHw();
        if (t.dataset.tab === "bank") loadBank();
        if (t.dataset.tab === "msgs") { openThread = null; loadMsgs(); }
        history.replaceState(null, "", "#" + t.dataset.tab);
      }));

      // Düymələr
      app.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.act === "class") return changeClass(b.dataset.id);
        if (b.dataset.act === "delete") return deleteStudent(b.dataset.id);
        if (b.dataset.act) return setStatus(b.dataset.id, b.dataset.act);
        if (b.hasAttribute("data-refresh")) return loadPeople();
        if (b.dataset.mat) return materialAction(b.dataset.mat, b.dataset.id, b);
        if (b.hasAttribute("data-viol-refresh")) return loadViolations();
        if (b.hasAttribute("data-tests-refresh")) return loadTests();
        if (b.dataset.test) return testAction(b.dataset.test, b.dataset.id);
        if (b.dataset.live) return liveAction(b.dataset.live, b.dataset.id);
        if (b.dataset.pwd) return resetPassword(b.dataset.pwd);
        if (b.dataset.wdel) return deleteWord(b.dataset.wdel);
        if (b.dataset.hw) return hwAction(b.dataset.hw, b.dataset.id);
        if (b.dataset.grade) return gradeHw(b.dataset.grade);
        if (b.dataset.hwqc) { const f = document.getElementById(`f-${b.dataset.hwqc}`); f.value = (f.value.trim() ? f.value.trim() + " " : "") + b.textContent; return f.focus(); }
        if (b.dataset.bdel) return deleteBank(b.dataset.bdel);
        if (b.dataset.thread) { openThread = b.dataset.thread; return loadMsgs(); }
        if (b.hasAttribute("data-threads")) { openThread = null; return loadMsgs(); }
        if (b.dataset.deckdel) return deleteDeck(b.dataset.deckdel);
        if (b.dataset.vcancel) return cancelViolation(b.dataset.vcancel);
        if (b.dataset.vreset) return resetWarnings(b.dataset.vreset);
        if (b.dataset.del) {
          if (!confirm("Elan silinsin?")) return;
          sb.from("announcements").delete().eq("id", b.dataset.del).then(({ error }) => {
            if (error) toast(translateError(error), "err"); else { toast("Silindi", "ok"); loadAnnouncements(); }
          });
        }
      });

      document.getElementById("backup-btn").addEventListener("click", openBackup);
      document.getElementById("storage-btn").addEventListener("click", openStorage);
      document.getElementById("live-form").addEventListener("submit", saveLive);
      document.getElementById("live-cancel").addEventListener("click", resetLiveForm);
      document.getElementById("set-max").addEventListener("change", (e) => saveSetting("max_warnings", e.target.value));
      document.getElementById("set-tor").addEventListener("change", (e) => saveSetting("tor_block", e.target.value));
      document.getElementById("set-weekly").addEventListener("change", async (e) => {
        const { error } = await sb.rpc("admin_set_weekly", { p_on: e.target.value === "on" });
        if (error) return toast(/function|schema cache/i.test(error.message || "") ? "Əvvəlcə 18-weekly-report.sql faylını Supabase-də işə sal" : translateError(error), "err");
        toast(e.target.value === "on" ? "Həftəlik hesabat açıldı ✓" : "Həftəlik hesabat bağlandı", "ok");
      });
      document.getElementById("weekly-now").addEventListener("click", async (e) => {
        e.target.disabled = true;
        const { error } = await sb.rpc("admin_weekly_report_now");
        e.target.disabled = false;
        if (error) return toast(/function|schema cache/i.test(error.message || "") ? "Əvvəlcə 18-weekly-report.sql faylını Supabase-də işə sal" : translateError(error), "err");
        toast("Hesabat Telegram-a göndərildi ✓", "ok");
      });
      document.getElementById("set-rank").addEventListener("change", async (e) => {
        const { error } = await sb.rpc("admin_set_leaderboard", { p_on: e.target.value === "on" });
        if (error) return toast(translateError(error) + " (09-words-year-rank.sql işə salınıb?)", "err");
        toast("Ayar yadda saxlandı ✓", "ok");
      });
      document.getElementById("year-btn").addEventListener("click", promoteYear);
      document.getElementById("hw-form").addEventListener("submit", saveHw);
      document.getElementById("bank-form").addEventListener("submit", saveBank);
      document.getElementById("bank-filter").addEventListener("change", renderBank);
      document.getElementById("bank-list").addEventListener("change", updateBankSel);
      document.getElementById("bank-to-test").addEventListener("click", () => bankExport("test"));
      document.getElementById("bank-to-live").addEventListener("click", () => bankExport("live"));
      document.getElementById("words-form").addEventListener("submit", saveWords);
      document.getElementById("viol-filter").addEventListener("change", loadViolations);
      document.getElementById("search").addEventListener("input", render);
      document.getElementById("class-filter").addEventListener("change", render);

      document.getElementById("ann-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("ann-title").value.trim();
        const body = document.getElementById("ann-body").value.trim();
        const target_class = group === "mag" ? MAG_CLASS : document.getElementById("ann-class").value || null;
        if (!title || !body) return toast("Başlıq və mətni yaz", "err");
        const { error } = await sb.from("announcements").insert({ title, body, target_class });
        if (error) return toast(translateError(error), "err");
        e.target.reset();
        toast("Elan paylaşıldı ✓", "ok");
        loadAnnouncements();
      });

      setupGroup.apply();
      await loadPeople();
      loadViolations();   // nişan sayı üçün
      loadMsgs();         // oxunmamış mesaj sayı üçün
      storageWarn();      // yaddaş 80%-i keçibsə xəbərdarlıq
      loadHw(true);       // yoxlanılmamış tapşırıq sayı üçün
      const startTab = location.hash.slice(1);
      if (startTab) app.querySelector(`.tab[data-tab="${CSS.escape(startTab)}"]`)?.click();
      // Yeni qeydiyyatları hər 30 saniyədən bir yoxla
      setInterval(() => { if (!document.hidden) loadPeople(); }, 30000);
    }

    start();
  </script>
</body>
</html>
