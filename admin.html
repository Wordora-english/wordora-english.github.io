<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panel — Wordora</title>
  <meta name="theme-color" content="#0e1f3d">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions">
        <a class="btn btn-ghost btn-sm hide-sm" href="portal.html">Şagird görünüşü</a>
        <button class="btn btn-ghost btn-sm" id="logout">Çıxış</button>
      </nav>
    </div>
  </header>

  <main class="container" id="app"><div class="spinner"></div></main>

  <template id="tpl-admin">
    <h1 style="font-size:1.6rem">Admin panel</h1>
    <p class="muted" id="hello"></p>

    <div class="stats">
      <div class="stat"><div class="n" id="st-pending">0</div><div class="l">Təsdiq gözləyir</div></div>
      <div class="stat"><div class="n" id="st-approved">0</div><div class="l">Aktiv şagird</div></div>
      <div class="stat"><div class="n" id="st-blocked">0</div><div class="l">Bloklanıb</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="pending">Yeni qeydiyyatlar <span class="badge" id="badge-pending">0</span></button>
      <button class="tab" data-tab="approved">Şagirdlər</button>
      <button class="tab" data-tab="blocked">Bloklanan / rədd</button>
      <button class="tab" data-tab="mat">Materiallar</button>
      <button class="tab" data-tab="ann">Elanlar</button>
    </div>

    <section data-panel="pending">
      <div class="toolbar"><button class="btn btn-ghost btn-sm" data-refresh>↻ Yenilə</button></div>
      <div class="people" id="list-pending"></div>
    </section>

    <section data-panel="approved" class="hidden">
      <div class="toolbar">
        <input id="search" placeholder="Ad, istifadəçi adı və ya kod ilə axtar…">
        <select id="class-filter"><option value="">Bütün siniflər</option></select>
      </div>
      <div class="people" id="list-approved"></div>
    </section>

    <section data-panel="blocked" class="hidden">
      <div class="people" id="list-blocked"></div>
    </section>

    <section data-panel="mat" class="hidden">
      <form class="card" id="mat-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Yeni material (PDF)</h2>
        <div class="field"><label for="mat-file">PDF fayl</label><input id="mat-file" type="file" accept="application/pdf,.pdf" required><div class="hint">Maksimum 50 MB.</div></div>
        <div class="row2">
          <div class="field"><label for="mat-title">Başlıq</label><input id="mat-title" maxlength="150" required></div>
          <div class="field"><label for="mat-cat">Kateqoriya</label><input id="mat-cat" list="mat-cats" value="Qrammatika qaydaları" maxlength="60" required>
            <datalist id="mat-cats"><option>Qrammatika qaydaları</option><option>Sınaqlar</option><option>Söz siyahıları</option><option>Oxu mətnləri</option><option>Digər</option></datalist></div>
        </div>
        <div class="field"><label for="mat-desc">Qısa izah (istəyə görə)</label><input id="mat-desc" maxlength="1000"></div>
        <div class="field"><label>Kimlər görsün</label><div class="chk-row" id="mat-classes"></div><div class="hint">Heç biri seçilməsə — bütün siniflər görür.</div></div>
        <div class="row2">
          <div class="field"><label for="mat-until">Bu tarixə qədər açıq (istəyə görə)</label><input id="mat-until" type="datetime-local"></div>
          <div class="field"><label>&nbsp;</label><label class="chk" style="width:max-content"><input type="checkbox" id="mat-pub" checked> Dərhal paylaş</label></div>
        </div>
        <button class="btn btn-primary" type="submit" id="mat-submit">Yüklə</button>
        <div class="progress hidden" id="mat-progress"><div></div></div>
      </form>
      <div class="grid" id="mat-list"></div>
    </section>

    <section data-panel="ann" class="hidden">
      <form class="card" id="ann-form" style="margin-bottom:16px">
        <h2 style="font-size:1.15rem">Yeni elan</h2>
        <div class="field"><label for="ann-title">Başlıq</label><input id="ann-title" maxlength="150" required></div>
        <div class="field"><label for="ann-body">Mətn</label><textarea id="ann-body" maxlength="5000" required></textarea></div>
        <div class="field"><label for="ann-class">Kimə</label><select id="ann-class"><option value="">Bütün siniflər</option></select></div>
        <button class="btn btn-primary" type="submit">Elanı paylaş</button>
      </form>
      <div class="grid" id="ann-list"></div>
    </section>
  </template>

  <script type="module">
    import { sb, configured, getMyProfile, logout, esc, formatDate, classLabel, toast, translateError, CLASSES, showConfigWarning } from "./assets/js/app.js";

    showConfigWarning();
    const app = document.getElementById("app");
    document.getElementById("logout").addEventListener("click", logout);

    let people = [];

    function personCard(p) {
      const meta = `
        <span>@${esc(p.username)}</span>
        <span>${esc(classLabel(p.class_name))}</span>
        <span class="code" title="Şəxsi gizli kod">${esc(p.student_code)}</span>
        <span>${formatDate(p.created_at)}</span>`;
      let actions = "";
      if (p.status === "pending") {
        actions = `
          <button class="btn btn-ok btn-sm" data-act="approved" data-id="${p.id}">✓ Təsdiqlə</button>
          <button class="btn btn-bad btn-sm" data-act="rejected" data-id="${p.id}">✕ Rədd et</button>`;
      } else if (p.status === "approved") {
        actions = `
          <button class="btn btn-ghost btn-sm" data-act="class" data-id="${p.id}">Sinfi dəyiş</button>
          <button class="btn btn-bad btn-sm" data-act="blocked" data-id="${p.id}">🔒 Blokla</button>`;
      } else {
        actions = `<button class="btn btn-ok btn-sm" data-act="approved" data-id="${p.id}">${p.status === "blocked" ? "🔓 Blokdan çıxar" : "✓ Təsdiqlə"}</button>`;
      }
      const pill = p.status === "blocked" ? '<span class="pill blocked">Bloklanıb</span>'
                 : p.status === "rejected" ? '<span class="pill rejected">Rədd edilib</span>' : "";
      return `
        <div class="person">
          <div class="who">
            <div class="name">${esc(p.full_name)} ${pill}</div>
            <div class="meta">${meta}</div>
            ${p.status_note ? `<div class="note">Qeyd: ${esc(p.status_note)}</div>` : ""}
          </div>
          <div class="actions">${actions}</div>
        </div>`;
    }

    function render() {
      const by = (s) => people.filter((p) => p.role === "student" && s.includes(p.status));
      const pending = by(["pending"]);
      const approved = by(["approved"]);
      const blocked = by(["blocked", "rejected"]);

      document.getElementById("st-pending").textContent = pending.length;
      document.getElementById("st-approved").textContent = approved.length;
      document.getElementById("st-blocked").textContent = by(["blocked"]).length;
      const badge = document.getElementById("badge-pending");
      badge.textContent = pending.length;
      badge.classList.toggle("zero", pending.length === 0);

      document.getElementById("list-pending").innerHTML = pending.length
        ? pending.map(personCard).join("")
        : '<div class="card empty">Yeni qeydiyyat yoxdur.</div>';

      const q = document.getElementById("search").value.trim().toLowerCase();
      const cls = document.getElementById("class-filter").value;
      const filtered = approved.filter((p) =>
        (!cls || p.class_name === cls) &&
        (!q || p.full_name.toLowerCase().includes(q) || p.username.includes(q) || p.student_code.toLowerCase().includes(q)));
      document.getElementById("list-approved").innerHTML = filtered.length
        ? filtered.map(personCard).join("")
        : '<div class="card empty">Şagird tapılmadı.</div>';

      document.getElementById("list-blocked").innerHTML = blocked.length
        ? blocked.map(personCard).join("")
        : '<div class="card empty">Bloklanan və ya rədd edilən yoxdur.</div>';
    }

    async function loadPeople() {
      const { data, error } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
      if (error) { toast(translateError(error), "err"); return; }
      people = data;
      render();
    }

    async function setStatus(id, status) {
      const p = people.find((x) => x.id === id);
      let note = null;
      if (status === "blocked") {
        note = prompt(`${p.full_name} bloklanır. Səbəb (şagird görəcək, boş saxlaya bilərsən):`, "");
        if (note === null) return;
      } else if (status === "rejected") {
        if (!confirm(`${p.full_name} — qeydiyyat rədd edilsin?`)) return;
      }
      const { error } = await sb.rpc("admin_set_status", { p_user: id, p_status: status, p_note: note || null });
      if (error) { toast(translateError(error), "err"); return; }
      toast(status === "approved" ? "Təsdiqləndi ✓" : status === "blocked" ? "Bloklandı" : "Rədd edildi", "ok");
      loadPeople();
    }

    async function changeClass(id) {
      const p = people.find((x) => x.id === id);
      const val = prompt(`${p.full_name} üçün yeni sinif (${CLASSES.join(", ")}):`, p.class_name);
      if (val === null || !val.trim() || val.trim() === p.class_name) return;
      const { error } = await sb.rpc("admin_set_class", { p_user: id, p_class: val.trim() });
      if (error) { toast(translateError(error), "err"); return; }
      toast("Sinif dəyişdirildi", "ok");
      loadPeople();
    }

    async function loadAnnouncements() {
      const box = document.getElementById("ann-list");
      const { data, error } = await sb.from("announcements").select("*").order("created_at", { ascending: false });
      if (error) { box.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      box.innerHTML = data.length ? data.map((a) => `
        <article class="card ann">
          <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:start">
            <h3>${esc(a.title)}</h3>
            <button class="btn btn-bad btn-sm" data-del="${a.id}">Sil</button>
          </div>
          <div class="meta">${formatDate(a.created_at)} · ${a.target_class ? esc(classLabel(a.target_class)) : "Bütün siniflər"}</div>
          <div class="body">${esc(a.body)}</div>
        </article>`).join("") : '<div class="card empty">Hələ elan yoxdur.</div>';
    }

    // ================= Materiallar =================
    let materials = [];
    const fmtSize = (b) => !b ? "" : b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";

    async function loadMaterials() {
      const box = document.getElementById("mat-list");
      const [{ data, error }, { data: views }] = await Promise.all([
        sb.from("materials").select("*").order("created_at", { ascending: false }),
        sb.from("material_views").select("material_id, user_id"),
      ]);
      if (error) { box.innerHTML = `<div class="card empty">${esc(translateError(error))}</div>`; return; }
      materials = data;
      const stats = {};
      for (const v of views || []) {
        const s = (stats[v.material_id] ||= { total: 0, users: new Set() });
        s.total++; s.users.add(v.user_id);
      }
      if (!data.length) { box.innerHTML = '<div class="card empty">Hələ material yüklənməyib.</div>'; return; }
      const now = Date.now();
      box.innerHTML = data.map((m) => {
        const s = stats[m.id] || { total: 0, users: new Set() };
        const expired = m.available_until && new Date(m.available_until).getTime() < now;
        const pill = !m.is_published ? '<span class="pill off">Gizli</span>'
                   : expired ? '<span class="pill off">Müddəti bitib</span>' : '<span class="pill on">Açıq</span>';
        const classes = m.target_classes?.length ? m.target_classes.map(classLabel).join(", ") : "Bütün siniflər";
        return `
          <article class="card" id="m-${m.id}">
            <div style="display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:start">
              <div style="min-width:0">
                <h3 style="font-size:1.05rem;margin-bottom:.2rem">${esc(m.title)} ${pill}</h3>
                <div class="muted small">${esc(m.category)} · ${esc(classes)} · ${fmtSize(m.file_size)}${m.available_until ? " · " + formatDate(m.available_until) + " tarixinə qədər" : ""}</div>
                ${m.description ? `<div class="small" style="margin-top:.3rem">${esc(m.description)}</div>` : ""}
                <div class="small" style="margin-top:.4rem"><b>${s.users.size}</b> şagird · <b>${s.total}</b> dəfə baxılıb</div>
              </div>
              <div class="actions" style="display:flex;gap:.4rem;flex-wrap:wrap">
                <button class="btn btn-ghost btn-sm" data-mat="views" data-id="${m.id}">Kim baxıb</button>
                <a class="btn btn-ghost btn-sm" href="material.html?id=${m.id}" target="_blank" rel="noopener">Bax</a>
                <button class="btn btn-warn btn-sm" data-mat="toggle" data-id="${m.id}">${m.is_published ? "Gizlət" : "Paylaş"}</button>
                <button class="btn btn-bad btn-sm" data-mat="delete" data-id="${m.id}">Sil</button>
              </div>
            </div>
            <div class="views hidden"></div>
          </article>`;
      }).join("");
    }

    async function uploadMaterial(e) {
      e.preventDefault();
      const file = document.getElementById("mat-file").files[0];
      const title = document.getElementById("mat-title").value.trim();
      const category = document.getElementById("mat-cat").value.trim() || "Digər";
      const description = document.getElementById("mat-desc").value.trim() || null;
      const target_classes = [...document.querySelectorAll("#mat-classes input:checked")].map((i) => i.value);
      const untilVal = document.getElementById("mat-until").value;
      const is_published = document.getElementById("mat-pub").checked;

      if (!file) return toast("PDF faylı seç", "err");
      if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) return toast("Yalnız PDF fayl yükləmək olar", "err");
      if (file.size > 50 * 1048576) return toast("Fayl 50 MB-dan böyükdür", "err");
      if (!title) return toast("Başlıq yaz", "err");

      const btn = document.getElementById("mat-submit");
      const prog = document.getElementById("mat-progress");
      btn.disabled = true; btn.textContent = "Yüklənir…";
      prog.classList.remove("hidden"); prog.firstElementChild.style.width = "35%";

      const path = `${crypto.randomUUID()}.pdf`;
      try {
        const up = await sb.storage.from("materials").upload(path, file, { contentType: "application/pdf", upsert: false });
        if (up.error) throw up.error;
        prog.firstElementChild.style.width = "85%";
        const ins = await sb.from("materials").insert({
          title, category, description, file_path: path, file_size: file.size,
          target_classes: target_classes.length ? target_classes : null,
          available_until: untilVal ? new Date(untilVal).toISOString() : null,
          is_published,
        });
        if (ins.error) { await sb.storage.from("materials").remove([path]); throw ins.error; }
        prog.firstElementChild.style.width = "100%";
        toast("Material yükləndi ✓", "ok");
        e.target.reset();
        document.getElementById("mat-cat").value = category;
        loadMaterials();
      } catch (err) {
        toast(translateError(err), "err");
      } finally {
        btn.disabled = false; btn.textContent = "Yüklə";
        setTimeout(() => { prog.classList.add("hidden"); prog.firstElementChild.style.width = "0"; }, 600);
      }
    }

    async function materialAction(action, id, btn) {
      const m = materials.find((x) => x.id === id);
      if (!m) return;
      if (action === "toggle") {
        const { error } = await sb.from("materials").update({ is_published: !m.is_published }).eq("id", id);
        if (error) return toast(translateError(error), "err");
        toast(m.is_published ? "Material gizlədildi" : "Material paylaşıldı", "ok");
        return loadMaterials();
      }
      if (action === "delete") {
        if (!confirm(`"${m.title}" tamamilə silinsin? Bunu geri qaytarmaq olmur.`)) return;
        const rm = await sb.storage.from("materials").remove([m.file_path]);
        if (rm.error) return toast(translateError(rm.error), "err");
        const { error } = await sb.from("materials").delete().eq("id", id);
        if (error) return toast(translateError(error), "err");
        toast("Silindi", "ok");
        return loadMaterials();
      }
      if (action === "views") {
        const box = document.querySelector(`#m-${id} .views`);
        if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
        box.classList.remove("hidden");
        box.innerHTML = '<div class="muted">Yüklənir…</div>';
        const { data, error } = await sb
          .from("material_views")
          .select("viewed_at, user_id, profiles(full_name, class_name, student_code, role)")
          .eq("material_id", id)
          .order("viewed_at", { ascending: false })
          .limit(1000);
        if (error) { box.innerHTML = esc(translateError(error)); return; }
        const byUser = new Map();
        for (const v of data) {
          if (v.profiles?.role === "admin") continue;
          const u = byUser.get(v.user_id) || { p: v.profiles, n: 0, last: v.viewed_at };
          u.n++; byUser.set(v.user_id, u);
        }
        if (!byUser.size) { box.innerHTML = '<div class="muted">Hələ heç bir şagird baxmayıb.</div>'; return; }
        box.innerHTML = `<table>${[...byUser.values()].map((u) => `
          <tr>
            <td><b>${esc(u.p?.full_name || "—")}</b> <span class="muted">${esc(classLabel(u.p?.class_name))}</span> <span class="code" style="font-family:ui-monospace,monospace;font-size:.78rem;color:var(--indigo)">${esc(u.p?.student_code || "")}</span></td>
            <td class="n">${u.n} dəfə · son: ${formatDate(u.last)}</td>
          </tr>`).join("")}</table>`;
      }
    }

    async function start() {
      if (!configured) { app.innerHTML = '<div class="card empty">Sayt hələ bazaya qoşulmayıb.</div>'; return; }
      let me;
      try { me = await getMyProfile(); } catch (err) { app.innerHTML = `<div class="card empty">${esc(translateError(err))}</div>`; return; }
      if (!me) { location.href = "login.html"; return; }
      if (me.role !== "admin" || me.status !== "approved") { location.href = "portal.html"; return; }

      app.innerHTML = document.getElementById("tpl-admin").innerHTML;
      document.getElementById("hello").textContent = `Xoş gəldin, ${me.full_name}.`;

      for (const sel of [document.getElementById("class-filter"), document.getElementById("ann-class")]) {
        for (const c of CLASSES) sel.insertAdjacentHTML("beforeend", `<option value="${esc(c)}">${esc(classLabel(c))}</option>`);
      }
      document.getElementById("mat-classes").innerHTML = CLASSES.map((c) =>
        `<label class="chk"><input type="checkbox" value="${esc(c)}"> ${esc(classLabel(c))}</label>`).join("");
      document.getElementById("mat-file").addEventListener("change", (e) => {
        const f = e.target.files[0], t = document.getElementById("mat-title");
        if (f && !t.value) t.value = f.name.replace(/\.pdf$/i, "").replace(/[_-]+/g, " ");
      });
      document.getElementById("mat-form").addEventListener("submit", uploadMaterial);

      // Tablar
      app.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
        app.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
        app.querySelectorAll("[data-panel]").forEach((s) => s.classList.toggle("hidden", s.dataset.panel !== t.dataset.tab));
        if (t.dataset.tab === "ann") loadAnnouncements();
        if (t.dataset.tab === "mat") loadMaterials();
      }));

      // Düymələr
      app.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.act === "class") return changeClass(b.dataset.id);
        if (b.dataset.act) return setStatus(b.dataset.id, b.dataset.act);
        if (b.hasAttribute("data-refresh")) return loadPeople();
        if (b.dataset.mat) return materialAction(b.dataset.mat, b.dataset.id, b);
        if (b.dataset.del) {
          if (!confirm("Elan silinsin?")) return;
          sb.from("announcements").delete().eq("id", b.dataset.del).then(({ error }) => {
            if (error) toast(translateError(error), "err"); else { toast("Silindi", "ok"); loadAnnouncements(); }
          });
        }
      });

      document.getElementById("search").addEventListener("input", render);
      document.getElementById("class-filter").addEventListener("change", render);

      document.getElementById("ann-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = document.getElementById("ann-title").value.trim();
        const body = document.getElementById("ann-body").value.trim();
        const target_class = document.getElementById("ann-class").value || null;
        if (!title || !body) return toast("Başlıq və mətni yaz", "err");
        const { error } = await sb.from("announcements").insert({ title, body, target_class });
        if (error) return toast(translateError(error), "err");
        e.target.reset();
        toast("Elan paylaşıldı ✓", "ok");
        loadAnnouncements();
      });

      await loadPeople();
      // Yeni qeydiyyatları hər 30 saniyədən bir yoxla
      setInterval(() => { if (!document.hidden) loadPeople(); }, 30000);
    }

    start();
  </script>
</body>
</html>
