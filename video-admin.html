<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı dərs — Admin — Wordora</title>
  <meta name="theme-color" content="#0e1f3d">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wd_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <style>
    .when { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
    .when button { flex: 1 1 140px; }
    .when button.on { background: var(--tab-on); color: #fff; border-color: var(--tab-on); }
    .vl { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .vl:last-child { border-bottom: 0; }
    .vl-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .vl-h b { font-family: var(--display); font-size: 1.05rem; }
    .vl-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: .12rem .6rem; border-radius: 99px; background: var(--soft); color: var(--text-2); }
    .pill.live { background: var(--bad); color: #fff; }
    .who { font-size: .85rem; color: var(--muted); margin-top: 6px; }
    .who span { display: inline-block; background: var(--ok-bg); color: var(--ok); border-radius: 99px; padding: .1rem .55rem; margin: 2px 3px 0 0; }
    .tip { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: .9rem; }
    .tip li { margin: .3rem 0 .3rem 1.1rem; }
    details summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html"><img src="assets/img/logo-icon.png" alt=""><span>WORD<span class="ora">ORA</span></span></a>
      <nav class="topbar-actions"><a class="btn btn-ghost btn-sm" href="admin.html">← Admin panel</a></nav>
    </div>
  </header>
  <main class="container" id="app"><div class="spinner"></div></main>

  <script type="module">
    import { sb, configured, getMyProfile, esc, toast, translateError, CLASSES, classLabel, loadStudyGroups, studyGroupLabel } from "./assets/js/app.js";
    import { meetUrl } from "./assets/js/video.js";

    const app = document.getElementById("app");
    const $ = (id) => document.getElementById(id);
    let me, groups = [], members = {}, names = {}, when = "now";
    const fmt = (iso) => { const d = new Date(new Date(iso).getTime() + 4 * 3600e3), p = (n) => String(n).padStart(2, "0"); return `${p(d.getUTCDate())}.${p(d.getUTCMonth() + 1)} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; };
    const isLive = (v) => !v.ended_at && new Date(v.starts_at) <= Date.now() + 15 * 60e3 && new Date(v.starts_at) > Date.now() - 4 * 3600e3;
    const isPlanned = (v) => !v.ended_at && new Date(v.starts_at) > Date.now() + 15 * 60e3;

    function audience(v) {
      const c = (v.target_classes || []).map(classLabel);
      const g = (v.target_groups || []).map((id) => groups.find((x) => x.id === id)).filter(Boolean).map(studyGroupLabel);
      return [...c, ...g].join(", ") || "Bütün şagirdlər";
    }

    async function loadList() {
      const box = $("list");
      const { data, error } = await sb.from("video_lessons").select("*, video_joins(user_id, first_at, n)").order("starts_at", { ascending: false }).limit(40);
      if (error) {
        box.innerHTML = `<div class="empty">${/video_lessons/.test(error.message) ? "Əvvəlcə <b>39-video.sql</b> faylını Supabase-də işə salın (SETUP.md-ə baxın)." : esc(translateError(error))}</div>`;
        return;
      }
      if (!data.length) { box.innerHTML = '<div class="empty muted">Hələ dərs yoxdur. Yuxarıdan ilk dərsi başladın.</div>'; return; }
      box.innerHTML = data.map((v) => {
        const st = isLive(v) ? '<span class="pill live">● CANLI</span>' : isPlanned(v) ? '<span class="pill">📅 Planlaşdırılıb</span>' : '<span class="pill">Bitib</span>';
        const j = (v.video_joins || []).sort((a, b) => (names[a.user_id] || "").localeCompare(names[b.user_id] || "", "az"));
        const acts = !v.ended_at && (isLive(v) || isPlanned(v)) ? `<div class="vl-acts">
            <button class="btn btn-primary btn-sm" data-enter="${v.id}">🎥 Dərsə gir</button>
            <button class="btn btn-ghost btn-sm" data-copy="${v.id}">🔗 Linki kopyala</button>
            <button class="btn btn-ghost btn-sm" data-end="${v.id}">⏹ Dərsi bitir</button></div>` : "";
        return `<div class="vl"><div class="vl-h">${st}<b>${esc(v.title)}</b><span class="muted small">${fmt(v.starts_at)} · ${esc(audience(v))}${v.ext_url ? " · öz link" : ""}</span></div>
          <div class="who">Qoşulanlar: <b>${j.length}</b> ${j.map((x) => `<span title="${fmt(x.first_at)}">${esc(names[x.user_id] || "?")}</span>`).join("")}</div>${acts}</div>`;
      }).join("");
      const byId = Object.fromEntries(data.map((v) => [v.id, v]));
      box.querySelectorAll("[data-enter]").forEach((b) => b.addEventListener("click", () => {
        const v = byId[b.dataset.enter];
        window.open(meetUrl({ room: v.room, url: v.ext_url, name: me.full_name, teacher: true, title: v.title }), "_blank", "noopener");
      }));
      box.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
        const v = byId[b.dataset.copy];
        const link = v.ext_url || `https://meet.jit.si/${v.room}`;
        try { await navigator.clipboard.writeText(link); toast("Link kopyalandı ✓", "ok"); } catch { prompt("Linki kopyalayın:", link); }
      }));
      box.querySelectorAll("[data-end]").forEach((b) => b.addEventListener("click", async () => {
        if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Əminsiniz? Yenə basın"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "⏹ Dərsi bitir"; }, 4000); return; }
        const { error } = await sb.rpc("admin_video_end", { p_id: b.dataset.end });
        if (error) return toast(translateError(error), "err");
        toast("Dərs bitirildi — uşaqların portalından düymə götürüldü", "ok");
        loadList();
      }));
    }

    async function start() {
      if (!configured) { app.innerHTML = '<div class="card empty">Sayt hələ bazaya qoşulmayıb.</div>'; return; }
      me = await getMyProfile().catch(() => null);
      if (!me) { location.href = "login.html"; return; }
      if (me.role !== "admin") { location.href = "portal.html"; return; }
      ({ groups, members } = await loadStudyGroups(true).catch(() => ({ groups: [], members: {} })));
      const { data: ps } = await sb.from("profiles").select("id, full_name");
      names = Object.fromEntries((ps || []).map((p) => [p.id, p.full_name]));

      app.innerHTML = `
        <div class="section-title"><h1>🎥 Görüntülü canlı dərs</h1></div>
        <form class="card" id="f">
          <div class="field"><label for="t">Dərsin adı</label><input id="t" maxlength="100" placeholder="məs. Present Perfect — təkrar"></div>
          <div class="field"><label>Kimlər qoşula bilər — siniflər</label><div class="chk-row" id="cls">${CLASSES.map((c) => `<label class="chk"><input type="checkbox" value="${esc(c)}"> ${esc(classLabel(c))}</label>`).join("")}</div></div>
          <div class="field"><label>və ya dərs qrupları</label><div class="chk-row" id="grp">${groups.length
            ? groups.map((g) => `<label class="chk"><input type="checkbox" value="${g.id}"> ${esc(studyGroupLabel(g))} <span class="muted small">(${members[g.id]?.size || 0})</span></label>`).join("")
            : '<span class="muted small">Dərs qrupu yoxdur.</span>'}</div>
            <div class="muted small" style="margin-top:4px">Heç nə seçməsəniz — bütün şagirdlər görəcək.</div></div>
          <div class="when" id="when"><button type="button" class="btn btn-ghost on" data-w="now">▶ İndi başlat</button><button type="button" class="btn btn-ghost" data-w="later">📅 Vaxtını planlaşdır</button></div>
          <div class="field hidden" id="at-f"><label for="at">Başlama vaxtı</label><input id="at" type="datetime-local"><div class="muted small">Uşaqlara bildiriş dərsdən 15 dəqiqə əvvəl gedəcək.</div></div>
          <details style="margin:4px 0 12px"><summary>Öz Zoom / Google Meet linkimi istifadə etmək istəyirəm</summary>
            <div class="field" style="margin-top:8px"><input id="url" placeholder="https://..." inputmode="url"><div class="muted small">Boş qalsa, pulsuz Jitsi Meet otağı avtomatik yaradılır.</div></div></details>
          <button class="btn btn-primary" type="submit" id="go">▶ Dərsi başlat</button>
        </form>

        <div class="tip" style="margin:14px 0">
          <b>Necə işləyir?</b>
          <ol>
            <li>"Dərsi başlat" basırsınız — seçilən uşaqlara bildiriş gedir, portallarında qırmızı <b>"Dərsə qoşul"</b> düyməsi çıxır.</li>
            <li>Siz aşağıdakı siyahıdan <b>"🎥 Dərsə gir"</b> basırsınız. Jitsi ilk dəfə <b>"I am the host / Log in"</b> soruşacaq — Google hesabınızla bir dəfə daxil olun, dərs başlayır.</li>
            <li>Ekran paylaşmaq üçün aşağıdakı 🖥 düyməsi, uşaqların səsini bağlamaq üçün "Mute everyone".</li>
            <li>Qoşulan uşaqlar həmin gün avtomatik <b>davamiyyətdə "iştirak etdi"</b> olur.</li>
            <li>Pulsuz Jitsi-də bir görüş ən çox <b>95 dəqiqə</b> davam edir. Uzun dərs üçün bitirib yenisini başladın.</li>
          </ol>
        </div>

        <div class="section-title"><h2>Dərslər</h2></div>
        <div class="card" id="list"><div class="spinner"></div></div>`;

      $("when").addEventListener("click", (e) => {
        const b = e.target.closest("[data-w]"); if (!b) return;
        when = b.dataset.w;
        $("when").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        $("at-f").classList.toggle("hidden", when !== "later");
        $("go").textContent = when === "later" ? "📅 Planlaşdır" : "▶ Dərsi başlat";
      });
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        let at = null;
        if (when === "later") {
          if (!$("at").value) return toast("Başlama vaxtını seçin", "err");
          at = new Date($("at").value + ":00+04:00");
          if (at < Date.now() - 60e3) return toast("Keçmiş vaxt seçmək olmaz", "err");
        }
        const url = $("url").value.trim();
        if (url && !/^https:\/\//.test(url)) return toast("Link https:// ilə başlamalıdır", "err");
        $("go").disabled = true;
        const { error } = await sb.rpc("admin_video_start", {
          p_title: $("t").value.trim(),
          p_classes: [...document.querySelectorAll("#cls input:checked")].map((i) => i.value),
          p_groups: [...document.querySelectorAll("#grp input:checked")].map((i) => i.value),
          p_starts_at: at ? at.toISOString() : null,
          p_url: url || null,
        });
        $("go").disabled = false;
        if (error) return toast(/admin_video_start/.test(error.message) ? "Əvvəlcə 39-video.sql faylını Supabase-də işə salın" : translateError(error), "err");
        toast(when === "later" ? "Dərs planlaşdırıldı ✓" : "Dərs başladı ✓ İndi \"Dərsə gir\" basın", "ok");
        $("f").reset(); loadList();
      });
      loadList();
      setInterval(() => document.visibilityState === "visible" && loadList(), 30000);
    }
    start();
  </script>
</body>
</html>
