# Supabase-in pulsuz planında layihə 1 həftə aktivlik olmasa dayandırılır.
# Bu iş 3 gündən bir bazaya kiçik sorğu göndərir ki, sayt heç vaxt "yatmasın".
# Lazım olan secrets: SUPABASE_URL, SUPABASE_KEY (SETUP.md, 6-cı addım)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Bazaya ping göndər
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL və SUPABASE_KEY secrets hələ əlavə edilməyib."
            exit 0
          fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Baza aktivdir ✓"
